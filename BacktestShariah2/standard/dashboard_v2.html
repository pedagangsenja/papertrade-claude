/* ================= tooltip istilah (ganti tab Panduan istilah) ================= */
const TIPS={
  trend_jp:{t:'Trend (susunan SMA 50/150/200)',d:'Bullish = tutup > SMA50 > SMA150 > SMA200; Bearish = tutup < SMA50 < SMA150 < SMA200; lain-lain Neutral. Status bertukar hanya selepas 2 tutup berturut. "Sejak" = tutup kedua itu (umur dikira dari situ, tarikh sah = 1); baharu = ≤ 20 sesi, lama = > 60 sesi; Neutral menunjukkan status sebelumnya. Titik mula = harga terendah (Bullish) atau tertinggi (Bearish) dalam 63 sesi hingga tarikh sah, dibekukan; berapa jauh harga sudah bergerak sebelum label bertukar. Kajian 23 Okt 2026 (lebih 500 varian, 2020–2026): status ini tidak meramal pulangan 3–30 hari dan tiada peraturan jual berasaskannya yang lebih baik daripada lorong 1/lorong 2. Bullish tidak bermaksud lebih selamat; risiko diukur oleh ATR (lajur Risiko), jarak lorong 2 dan earnings. Bearish lama (diisi merah) satu-satunya amaran: lebih kerap jatuh > 8% dalam 10 sesi (bukti sederhana).',e:'Bullish lama · 142 sesi · sejak 1 Apr (+38.5%) · titik mula 2 Jan @ 121.61 (+87%)'},
  stage_w:{t:'Stage (Stage Analysis Weinstein)',d:'Peringkat kitaran saham pada bar MINGGUAN dengan purata bergerak 30 minggu (MA30), kaedah Stan Weinstein. Stage 2 = tutup di atas MA30 yang menaik (fasa naik); Stage 4 = tutup di bawah MA30 yang menurun (fasa turun); 1/3 = selain itu — asas (selepas Stage 4) atau kawasan puncak (selepas Stage 2); kedua-duanya kelihatan sama pada carta, jadi screener stageanalysis.net menggabungkannya dan baris kecil di bawah label menyatakan yang mana. Sebelas label sama seperti screener itu: 2A (minggu breakout pertama kitaran ini) · 2 · 2− · 2B · 2B− · 1/3 · 4A (minggu breakdown pertama) · 4 · 4− · 4B · 4B−. B = sudah 39 minggu atau lebih dalam kitaran yang sama (surut sementara ke 1/3 tidak menetapkan semula kiraan). “−” dalam label = harga menentang arah peringkat berbanding MA 10 minggu (Stage 2 bawah MA10 = hambar; Stage 4 atas MA10 = mula perk up). Cip kecil (+)/(−) di sebelah label ialah penggred kualiti Weinstein dan BERBEZA daripada “−” dalam label: (+) = garis Mansfield RP positif dan volum minggu mula ≥ 2× purata 4 minggu sebelumnya; (−) = Mansfield negatif. Dikira daripada stor harga repo mengikut takrif yang diterbitkan stageanalysis.net; tiada sambungan ke laman itu (tiada API awam). Stor 520 sesi ≈ 104 minggu, jadi kitaran yang bermula lebih awal ditanda “≥ n minggu” dan tidak diberi label A. PAPARAN SAHAJA (keputusan pengguna 27 Okt 2026): belum diuji sama ada ia meramal pulangan 3–30 hari, jadi ia bukan penapis belian dan bukan isyarat jual — keluar kekal ikut lorong kaedah dan lorong 2.',e:'2B+ · 64 minggu · sejak 15 Ogo 2025'},
  j52_jarak:{t:'Jarak ke tinggi 52 minggu',d:'Tutup ÷ tinggi intrahari tertinggi 252 sesi (termasuk hari ini) − 1. 0.0% = harga pada tinggi 52 minggu; −12.0% = 12% di bawahnya. Nombor kecil = sesi sejak tinggi itu ditetapkan. Kajian REVERSE/JARAK_52W.md (4 Nov 2026), 10,468,053 bar 2012–2025 dengan tingkap latih/tahan berasingan: sebagai PENAPIS belian ia GAGAL — band 0%…−2% memberi lift −1.34 mata (21 sesi) dan −5.76 mata (126 sesi) pada tingkap tahan, sama seperti N35 (pecah 52w), N66 dan N120 (Minervini) yang sudah diuji dan gagal. Sebagai URUTAN antara calon pada HARI YANG SAMA ia berfungsi sedikit: IC Spearman +0.032 hingga +0.116, bertanda sama dalam kedua-dua tingkap, positif dalam 10 daripada 14 tahun. Tetapi kelebihan itu HABIS kira-kira −10%: median pulangan 126 sesi desil 6–10 ialah +4.43%, +4.53%, +4.70%, +4.53%, +3.87% (tahan) — desil paling hampir tinggi BUKAN yang terbaik. Jadual band mutlak mengukur pemasaan pasaran, bukan pemilihan saham (Mac 2020 hampir setiap nama > 40% di bawah tingginya). Alam kajian tiada saham delist. PAPARAN SAHAJA: bukan penapis belian, bukan isyarat jual.',e:'−12.4% 49s'},
  atr_risiko:{t:'Risiko (ATR14%)',d:'ATR14% = purata julat harian 14 sesi ÷ harga. Q1–Q5 = kuintil merentas semua saham stor pada tarikh sama (Q5 ambar). Backtest posisi 19 kaedah, 2020–2026: peluang jatuh > 8% dalam 10 sesi ≈ 7–11% (Q1), 11–16% (Q2), 16–23% (Q3), 21–31% (Q4), 31–42% (Q5). Ini ukuran risiko yang lulus ujian luar sampel; status trend tidak menambah maklumat melebihinya. Maklumat, bukan peraturan saiz posisi atau isyarat jual. Earnings (📅, ≤ 10 sesi) menambah risiko jatuh tajam +6.5 hingga +13.9 mata.',e:'ATR 3.1% Q3'},
  r_multiple:{t:'R (unit risiko)',d:'Untung dibahagi risiko awal. Risiko awal = (harga beli − henti kaedah pada hari isyarat) ÷ harga beli. +2R = untung dua kali ganda risiko; −1R = rugi sebanyak risiko penuh. Bagi kaedah yang hentinya mengekor, R ialah anggaran kerana hanya henti awal digunakan.',e:'Beli 100, henti 95 (risiko 5%), kini 110 (+10%) = +2R.'},
  aliran:{t:'Aliran isyarat',d:'Ke mana setiap isyarat Papertrade C pergi: dibeli atau tidak, masih dipegang atau sudah keluar lorong kaedah, dan sedang untung, menang atau rugi. Tebal jalur = bilangan isyarat; peratus = bahagian daripada peringkat sebelumnya.'},
  peta_portfolio:{t:'Peta portfolio',d:'Posisi yang masih dipegang (lorong kaedah) dikumpul ikut sektor dan industri. Saiz kotak = bilangan SAHAM unik (satu saham yang dibeli beberapa kaedah dikira sekali; bilangan posisi dalam tooltip); warna = untung purata semasa (hijau untung, merah rugi, penuh pada ±10%). Ketik kotak untuk menapis jadual; ketik sekali lagi untuk membuang tapisan.'},
  pand_risiko:{t:'Pandangan jadual',d:'Ringkas dan Penuh seperti sebelum ini. Risiko: R, risiko awal, penurunan dan kenaikan maksimum, jarak ke henti kaedah dan kedudukan lorong 2. Gred: semua lajur gred. Pilihan disimpan dalam pelayar ini (skrin lebar sahaja).'},
  mfe:{t:'Kenaikan maksimum (MFE)',d:'Untung tertinggi yang pernah dicapai sejak beli: harga tinggi tertinggi hingga sehari sebelum keluar (dan harga keluar) ÷ harga beli − 1. Jarak antara kenaikan maksimum dan untung akhir = untung yang terlepas sebelum keluar.',e:'Naik maks +6%, keluar +1%: 5 mata terlepas.'},
  kejatuhan:{t:'Kejatuhan dari puncak',d:'Berapa jauh untung terkumpul (% modal) berada di bawah paras tertingginya, dalam mata peratus. Menunjukkan dalam dan lamanya tempoh rugi, yang tersembunyi dalam carta untung terkumpul.'},
  harian_kaedah:{t:'Prestasi harian setiap kaedah',d:'Satu baris setiap kaedah, satu kotak setiap hari dagangan. Asal: untung terkumpul lawan SPY — hijau = kaedah mengatasi SPY sejak mula sehingga hari itu, merah = kalah; kelabu gelap = tiada posisi. ✓ / ✕ = keluar untung / rugi. Lajur kanan = untung purata % semua posisi kaedah (untung akhir bagi yang keluar, semasa bagi yang dipegang).',e:'Baris yang kebanyakannya hijau dengan untung purata positif = kaedah yang menjadi apabila diikut (masuk dan keluar ikut peraturan).'},
  peta_bulanan:{t:'Untung bulanan setiap kaedah',d:'Untung purata dagangan selesai setiap kaedah ikut bulan keluar. Kaedah yang hanya untung dalam satu bulan, atau mula lemah, kelihatan serta-merta.'},
  carta_kecil:{t:'Carta harga sejak beli',d:'Harga tutup setiap hari sejak beli. Garis putus kelabu = harga beli; titik-titik kuning = paras keluar lorong selagi naik. Hijau jika harga terkini di atas harga beli.'},
  kp_saringan:{t:'Saringan 7 langkah',d:'Setiap kaedah disemak dengan 7 soalan. 1–5: Ujian 1 (431 saham Shariah, 2019–2026; gate enjin G2, G3, G4, G1, G5). 6: varian sama untung dalam keempat-empat kumpulan kecil S1–S4. 7: Ujian 2 (2000 saham AS lain, 2013–2018, parameter asal) masih untung dalam kumpulan A dan B. Hijau lulus, merah gagal, kelabu tiada data.',e:'●●●●●●● = lulus semua; ●●○●●●● = gagal langkah 3.'},
  kp_pingat:{t:'Keputusan dan pingat',d:'Hanya kaedah yang lulus ketujuh-tujuh langkah mendapat pingat, ikut keputusan enjin v1.2: 🥇 Emas = GUNA (skor ≥ 75 dan atasi QQQ dalam kedua-dua separuh), 🥈 Perak = UJI KERTAS (skor 60–75), 🥉 Gangsa = SIMPAN (skor < 60). Selain itu ditunjuk langkah pertama yang gagal (✗) atau belum diuji kerana tiada data (◌). Dinilai bagi varian yang sedang digunakan dalam papertrade; kaedah tidak aktif ikut varian terbaik. # = kedudukan antara pemenang pingat (Emas dahulu, kemudian skor).',e:'✗ Langkah 3 = jatuh lebih 45%.'},
  kp_u1:{t:'Untung setahun · Ujian 1',d:'CAGR portfolio (8 slot × 12.5%) atas 431 saham Shariah, 1 Nov 2019 – 2 Okt 2026. Hijau = atasi SPY. RM10k → = nilai RM10,000 pada akhir tempoh (6.9 tahun).',e:'52% setahun: RM10,000 → kira-kira RM181,000.'},
  kp_u2:{t:'Untung setahun · Ujian 2',d:'CAGR atas 2000 saham AS lain (tanpa penapis Shariah), 2013–2018, parameter asal kaedah. Angka utama = kumpulan saham A atau B yang lebih lemah (lorong terbaik). Pasaran dan tempoh berbeza, jadi biasanya lebih rendah daripada Ujian 1; yang penting masih positif.',e:'+12.6% (A 15% · B 13%) = untung dalam kedua-dua kumpulan.'},
  kp_jatuh:{t:'Jatuh terburuk',d:'Kejatuhan paling dalam nilai portfolio dari puncak ke lembah dalam Ujian 1 (MDD). Merah jika lebih teruk daripada −45%.',e:'−37%: RM10,000 pernah turun ke RM6,300 sebelum naik semula.'},
  kp_menang:{t:'Menang',d:'Berapa dagangan daripada 10 yang ditutup dengan untung (Ujian 1). Cara jual-cepat-bila-rugi biasanya 3–4 daripada 10; untung datang daripada beberapa dagangan besar.',e:'4/10 = 4 untung, 6 rugi kecil.'},
  kp_pegang:{t:'Pegang',d:'Purata hari dagangan setiap posisi dipegang, dan purata bilangan dagangan setahun bagi semua saham dalam set (Ujian 1).',e:'34 hari ≈ 1.5 bulan.'},
  kp_pt:{t:'Papertrade C',d:'Prestasi sebenar setakat ini dalam Papertrade C (akaun rasmi sejak 13 Okt 2026; Moomoo lama dalam tab Prestasi atau Posisi): untung purata (akhir bagi yang keluar, semasa bagi yang dipegang) dan bilangan dagangan.',e:'+2.1% · 3 dagangan · 1 keluar.'},
  at_skor_sar:{t:'Lebihan min',d:'Skor saringan = nilai lebih kecil antara (CAGR A − SPY) dan (CAGR B − SPY), 2013–2018. Positif = mengatasi SPY dalam kedua-dua kumpulan saham.',e:'−2.5% = sekurang-kurangnya satu kumpulan ketinggalan 2.5% setahun berbanding SPY.'},
  at_dag:{t:'Dagangan portfolio',d:'Bilangan dagangan yang benar-benar dibeli oleh portfolio (8 slot × 12.5%, atau 5 × 20% bagi A03) dalam tempoh ujian, bagi kumpulan saham itu; hari = purata hari pegang.',e:'440 dagangan dalam 6 tahun ≈ 1–2 dagangan seminggu.'},
  at_lorong:{t:'Lorong',d:'had60: enjin menutup dagangan selepas 60 hari pegang. asal: tiada had enjin; keluar ikut peraturan asal kaedah (TMAX asal).',e:'M82 had60 = kaedah M82 dengan had pegang 60 hari.'},
  at_lulus:{t:'Label A02',d:'LULUS: pulangan berlebihan atas SPY > 0 pada OOS A dan B, lebihan pengesahan 2019 – kini > 0, MDD OOS ≥ MDD SPY − 10 mata peratus, DSR ≥ 0.90 dan imbasan pandang ke hadapan bersih. CALON: tiga syarat pertama sahaja. TIDAK LULUS: selain itu.',e:'Lebihan A +3.5% tetapi pengesahan −0.6% = TIDAK LULUS.'},
  at_menang_lbl:{t:'Label MENANG (A03)',d:'MENANG: kadar menang ≥ 55% pada OOS A dan B (2013–2018), CAGR > 0 dan PF ≥ 1.3 pada A dan B, MDD OOS ≥ −35%, pengesahan 2019 – kini menang ≥ 55% dan CAGR > 0, ≥ 100 dagangan, imbasan bersih. HAMPIR: semua kecuali satu syarat. TIDAK: selain itu.',e:'Baris kecil "gagal" dalam jadual menyenaraikan syarat yang tidak dipenuhi.'},
  at_menang:{t:'Kadar menang / kalah',d:'Peratus dagangan portfolio yang untung selepas kos. A dan B = OOS bersih 2013–2018 bagi saham kumpulan A dan B; 2019– = pengesahan (A+B). Kalah = 100% − menang.',e:'Menang 64% dengan purata untung +10% dan purata rugi −13% masih boleh memberi PF rendah.'},
  at_purata:{t:'Purata untung / rugi',d:'Purata pulangan dagangan yang menang dan yang kalah dalam tempoh pengesahan 2019 – kini. Jangkaan = menang% × purata untung + kalah% × purata rugi, iaitu pulangan dijangka setiap dagangan.',e:'Jangkaan +1.28% = purata untung bersih setiap dagangan.'},
  at_pf:{t:'Faktor untung (PF)',d:'Jumlah untung semua dagangan menang ÷ jumlah rugi semua dagangan kalah. MENANG perlu ≥ 1.3 pada A dan B.',e:'PF 1.0 = pulang modal; PF 1.5 = untung 1.5 kali rugi.'},
  at_oos2:{t:'OOS bersih 2013–2018',d:'Gabungan 6 tetingkap ujian walk-forward 2013…2018; setiap tetingkap memakai parameter yang ditala atas 3 tahun sebelumnya. A = saham kumpulan tala, B = saham kumpulan semakan. Tempoh ini sebelum kebanyakan kaedah direka.',e:'CAGR hijau = mengatasi SPY tempoh sama.'},
  at_peng:{t:'Pengesahan 2019 – kini',d:'Parameter AKHIR (latih 2016–2018) diuji atas 2019-01-01 hingga data terakhir, saham A+B. Tidak digunakan semasa pemilihan.',e:'SPY sekitar 17% setahun dalam tempoh ini.'},
  at_label:{t:'Label AUTOTUNE',d:'TINGGI: CAGR OOS-A dan OOS-B > SPY, MDD OOS-A ≥ −30%, CAGR tempoh kunci > SPY, DSR ≥ 0.95 dan PBO ≤ 0.30. SEDERHANA: tiga syarat pertama sahaja. RENDAH: CAGR OOS-A > 0. GAGAL: selain itu. BUKAN SWING: purata pegang OOS-A < 2 atau > 60 hari. PANDANG HADAPAN: imbasan potong-data mendapati kod memakai data hari esok; dikecualikan. BELUM DITALA: modul gagal kesetaraan atau kajian tidak lengkap.',e:'Hanya TINGGI dan SEDERHANA menjadi calon portfolio gabungan.'},
  at_oosa:{t:'OOS-A',d:'Gabungan 12 tetingkap ujian walk-forward (2013 – Sep 2024). Setiap tetingkap memakai parameter yang ditala atas 3 tahun sebelumnya, saham kumpulan A (kumpulan tala). SPY = tempoh yang sama.',e:'CAGR OOS-A 15% lawan SPY 12% = mengatasi SPY.'},
  at_oosb:{t:'OOS-B',d:'Tetingkap dan parameter sama seperti OOS-A, tetapi atas saham kumpulan B yang tidak digunakan semasa tala (semakan merentas saham).',e:'OOS-B jauh di bawah OOS-A menandakan parameter terlalu sesuai dengan saham A.'},
  at_kunci:{t:'Tempoh kunci',d:'1 Okt 2024 hingga data terakhir, parameter AKHIR, saham A+B. Dibuka sekali sahaja selepas semua pilihan dibuat.',e:'Kunci jauh di bawah OOS menandakan overfitting atau perubahan rejim pasaran.'},
  at_dsr:{t:'DSR dan PBO',d:'DSR (Deflated Sharpe Ratio): Sharpe OOS-A selepas mengambil kira jumlah semua percubaan; TINGGI perlu ≥ 0.95. PBO (Probability of Backtest Overfitting, CSCV 8 blok): kebarangkalian pilihan terbaik dalam sampel jatuh di bawah median luar sampel; TINGGI perlu ≤ 0.30.',e:'DSR 0.40 = Sharpe mungkin kebetulan daripada banyak percubaan.'},
  at_param:{t:'Param SEMASA',d:'Parameter yang ditala atas 3 tahun data terakhir (kajian SEMASA), untuk cadangan dagangan. Parameter lain kekal PARAM asal kaedah.',e:'rsi_13=16: tempoh RSI ditala daripada 13 kepada 16.'},
  at_tala:{t:'Kemajuan tala',d:'Kaedah yang semua 14 kajian (12 tetingkap walk-forward, AKHIR dan SEMASA) sudah siap, daripada semua kaedah yang sudah mula ditala.',e:'5 / 160 = 5 kaedah lengkap.'},
  kaedah:{t:'Kaedah / varian',d:'Kod dan nama kaedah. M = kaedah dagangan lengkap (masuk, henti rugi, keluar). I = satu indikator sahaja, keluar apabila harga tutup di bawah SMA20. Baris kecil ialah varian, iaitu variasi tetapan bagi kaedah yang sama.',e:'"M96 · V1 Dikunci (+henti tutup−3×ATR14)" = kaedah M96, varian V1 dengan henti rugi 3×ATR di bawah harga tutup.'},
  keputusan:{t:'Keputusan',d:'Penilaian enjin v1.2. DITOLAK jika gagal walau satu gate. Jika lulus semua gate: GUNA (skor ≥ 75 dan atasi QQQ di kedua-dua separuh), UJI KERTAS (skor 60–75) atau SIMPAN (skor < 60).',e:'Skor 80 tetapi gagal G4 tetap DITOLAK, kerana gate dinilai dahulu.'},
  skor:{t:'Skor (0–100)',d:'Markah gabungan, hanya dikira jika lulus semua gate. Tujuh bahagian: CAGR lawan SPY/QQQ (25), MAR (20), tahun atasi SPY (15), keseimbangan dua separuh (10), tutup ≥ +10% (15), kekerapan dan tempoh dagangan (10), untung purata setiap dagangan (5).',e:'Kosong (–) bermaksud kaedah itu DITOLAK oleh gate.'},
  jumlah:{t:'Jumlah untung',d:'Keuntungan keseluruhan modal portfolio dari 1 Nov 2019 hingga 2 Okt 2026 (6.9 tahun), 8 slot × 12.5% modal. Dikira daripada CAGR.',e:'+100% bermaksud modal menjadi dua kali ganda.'},
  cagr:{t:'CAGR',d:'Kadar pertumbuhan tahunan purata modal portfolio (8 slot × 12.5%), selepas kos dagangan 0.1%. Bandingkan dengan beli semua sama rata, SPY dan QQQ.',e:'CAGR 40%: RM10,000 → RM14,000 selepas setahun → RM19,600 selepas dua tahun.'},
  win:{t:'Kadar menang',d:'Peratus entry yang ditutup dengan untung, daripada SEMUA isyarat. Untuk cara jual-cepat-bila-rugi, 30–40% adalah normal asalkan purata menang jauh lebih besar daripada purata kalah.',e:'38% = daripada 100 entry, 38 untung dan 62 rugi.'},
  n:{t:'Jumlah entry',d:'Bilangan dagangan (isyarat beli) dari Nov 2019 hingga Okt 2026 bagi semua saham dalam set. Kurang daripada 100 entry gagal gate G2.',e:'343 entry dalam 6.9 tahun ≈ 1 entry seminggu.'},
  avg:{t:'Untung/dagangan',d:'Purata untung bersih setiap entry selepas kos 0.1%, termasuk yang rugi. Ukuran paling penting jika anda menilai ikut peratus setiap belian.',e:'+10.1% = setiap RM1,000 dalam satu entry kembali sebagai RM1,101 secara purata.'},
  avgwin:{t:'Purata menang',d:'Purata untung bagi entry yang untung sahaja.',e:'+44.4% = entry yang menang biasanya naik 44% sebelum dijual.'},
  avgloss:{t:'Purata kalah',d:'Purata rugi bagi entry yang rugi sahaja. Gate G1 menolak purata kalah lebih teruk daripada −12%.',e:'−8.1% = entry yang rugi biasanya dijual pada rugi sekitar 8%.'},
  nisbah:{t:'Menang:kalah',d:'Purata menang dibahagi saiz purata kalah. Kaedah untung jika (kadar menang × nisbah) > (1 − kadar menang).',e:'4.0× dengan menang 38%: 0.38 × 4.0 = 1.52 > 0.62, jadi untung secara purata.'},
  days:{t:'Hari pegang',d:'Purata bilangan hari dagangan sesuatu saham dipegang, dari isyarat beli hingga dijual.',e:'20 hari dagangan ≈ sebulan.'},
  harian:{t:'Untung/hari',d:'Untung/dagangan dibahagi hari pegang: berapa cepat modal membiak.',e:'+10% dalam 32 hari = +0.31%/hari.'},
  mdd:{t:'MDD (kejatuhan maksimum)',d:'Penurunan paling besar nilai portfolio dari puncak ke lembah. Gate G4 menolak MDD lebih teruk daripada −45%.',e:'−42% = modal pernah jatuh dari RM20,000 ke RM11,600 sebelum pulih.'},
  mar:{t:'MAR',d:'CAGR dibahagi saiz MDD: pulangan bagi setiap unit risiko kejatuhan. Skor penuh pada 1.5.',e:'CAGR 40% ÷ MDD 42% = 0.95.'},
  ret10:{t:'Tutup ≥ +10%',d:'Peratus entry yang DIJUAL dengan untung sekurang-kurangnya 10%. Paling dekat dengan matlamat anda.',e:'30% = 30 daripada 100 entry dijual dengan untung ≥ 10%.'},
  hit10:{t:'Sentuh +10%',d:'Peratus entry yang harganya PERNAH naik 10% atau lebih semasa dipegang. Jurang besar dengan "Tutup ≥ +10%" bermaksud banyak untung terlepas.',e:'Sentuh 63% tetapi tutup 30%: separuh daripada entry yang pernah naik 10% dijual di bawah +10%.'},
  bulan10:{t:'Bulan ≥ +10%',d:'Peratus bulan nilai portfolio naik 10% atau lebih.',e:'23% ≈ 1 daripada 4 bulan.'},
  bulan_untung:{t:'Bulan untung',d:'Peratus bulan nilai portfolio naik.',e:'60% = 6 daripada 10 bulan untung.'},
  pf:{t:'PF (faktor untung)',d:'Jumlah semua untung dibahagi jumlah semua rugi. Melebihi 1 bermaksud untung bersih.',e:'PF 2.0 = setiap 1% rugi terkumpul, ada 2% untung.'},
  dagangan_setahun:{t:'Dag/thn',d:'Purata bilangan entry setahun bagi semua saham dalam set.',e:'50 ≈ satu entry baharu setiap minggu.'},
  h1:{t:'Separuh 1',d:'CAGR bagi Nov 2019 hingga Dis 2022 (termasuk kejatuhan 2020 dan 2022).',e:'Gate G5 memerlukan kedua-dua separuh untung.'},
  h2:{t:'Separuh 2',d:'CAGR bagi Jan 2023 hingga 2 Okt 2026.',e:'Jika jauh lebih tinggi daripada separuh 1, keputusan mungkin bergantung pada pasaran menaik.'},
  thn_kalah_spy:{t:'Tahun atasi SPY',d:'Peratus tahun kalendar penuh (2020–2025) kaedah atasi SPY.',e:'50% = 3 daripada 6 tahun.'},
  terburuk:{t:'Dagangan terburuk',d:'Rugi paling besar bagi satu entry. Boleh melebihi henti rugi jika harga dibuka jauh lebih rendah (gap).',e:'−48% = satu entry pernah rugi hampir separuh.'},
  gate:{t:'Gate gagal',d:'G1 henti rugi & purata kalah ≥ −12%; G2 ≥ 100 entry; G3 CAGR atasi SPY; G4 MDD tidak lebih teruk daripada −45%; G5 untung di kedua-dua separuh; G6 beli sahaja & mekanikal.',e:'"G3 G4" = kalah kepada SPY dan kejatuhan melebihi −45%.'},
  menang_ew:{t:'Atasi beli semua',d:'Sama ada CAGR kaedah melebihi CAGR membeli semua saham dalam set dengan modal sama rata.',e:'Set 431: beli semua 21.9% setahun.'},
  pegang:{t:'Profil pegangan',d:'Pulangan purata jika setiap entry dipegang tepat 5, 10 … 60 hari dari harga masuk, tanpa peraturan jual.',e:'Garis terus naik hingga hari 40 = isyarat masih berkesan selama itu.'},
  gaya:{t:'Gaya saya',d:'Penapis: purata pegangan ≤ 40 hari dan sekurang-kurangnya 100 entry, disusun ikut untung/dagangan.',e:''},
  set:{t:'Set saham',d:'431 = semua saham Shariah dalam ujian. S1–S4 = empat kumpulan kecil (≈108 saham setiap satu) daripada 431. Kaedah yang baik berprestasi di keempat-empatnya.',e:''},
  tarikh_beli:{t:'Tarikh beli',d:'Hari dagangan posisi dibeli (pesanan pasaran pada buka).',e:''},
  saham:{t:'Saham',d:'Simbol saham AS.',e:''},
  kaedah_pt:{t:'Kaedah',d:'Kaedah M yang memberi isyarat beli. "Kongsi" = kaedah lain yang juga beri isyarat pada saham yang sudah dipegang; direkod tanpa unit kedua.',e:''},
  sektor:{t:'Sektor',d:'Sektor GICS saham, daripada SST Terminal (atau dipetakan daripada pelan industri Moomoo).',e:''},
  industri:{t:'Industri',d:'Industri saham dalam sektornya.',e:''},
  harga_beli:{t:'Harga beli',d:'Harga isian purata order beli.',e:''},
  unit:{t:'Unit',d:'Bilangan saham dipegang. Sistem v2 membeli 1 unit; unit lebih besar ialah pegangan lama sebelum 8 Okt.',e:''},
  harga_terkini_pt:{t:'Harga terkini',d:'Harga tutup sesi AS terakhir (bar harian muktamad; harga beli hari ini = harga buka sementara sehingga disahkan selepas tutup). Selepas isyarat keluar, harga dibekukan pada harga keluar dan tidak dikemas kini lagi.',e:''},
  harga_terkini:{t:'Harga terkini',d:'Harga tutup terkini dalam data imbasan.',e:''},
  untung_pct:{t:'Untung %',d:'Harga terkini ÷ harga beli − 1. Bagi posisi yang sudah keluar, ini untung pada harga keluar.',e:'+5.0% = RM100 kini bernilai RM105.'},
  hari_pt:{t:'Hari pegang (KK)',d:'Bilangan hari dagangan sejak tarikh beli hingga keluar lorong kaedah (atau hingga kini jika masih dipegang). Bar kecil di bawah nombor ada dua maksud. (1) Kaedah yang ADA had masa (33 daripada 134 kaedah; had 10, 20, 21, 42, 63 atau 126 hari dagangan, daripada katalog kaedah): bar biru = berapa banyak had sudah dipakai, bertukar kuning pada 80% ke atas, dan label di bawah berbunyi "had 20 hari" — bila sampai had, kaedah menjual walaupun sasaran belum dicapai. (2) Kaedah yang TIADA had masa (101 kaedah): bar ungu dan label "purata backtest 62 hari" hanya membanding tempoh pegang sekarang dengan purata pegang kaedah itu dalam backtest — rujukan sahaja, bukan had, jadi bar penuh tidak bermakna perlu jual. Hover bar untuk ayat penuh.',e:'had 20 hari = kaedah jual pada hari ke-20. purata backtest 62 hari = kaedah ini biasanya dipegang 62 hari dalam backtest, tiada had.'},
  hari_psn:{t:'Hari pegang (PSN)',d:'Bilangan hari dagangan sejak tarikh beli hingga keluar lorong 2 “pegang selagi naik” (atau hingga kini jika lorong itu masih terbuka). Lorong 2 tiada had masa, jadi tiada bar.',e:'Berbeza daripada Hari pegang (KK) apabila satu lorong sudah keluar dan satu lagi masih terbuka.'},
  isyarat_keluar:{t:'Keluar kaedah (lorong 1)',d:'Status mengikut peraturan keluar penuh kaedah itu: Pegang, atau Keluar (henti rugi, sasaran, isyarat jual, had masa). Keputusan rasmi papertrade. Baris ditanda merah hanya apabila kedua-dua lorong sudah keluar. Susun ikut untung lorong ini (akhir jika keluar, semasa jika dipegang).',e:'Keluar 15 Okt · @ 20.50 · +4.91% · capai sasaran.'},
  keluar_henti:{t:'Pegang selagi naik (lorong 2)',d:'Pegang selagi trend naik (sejak 19 Okt 2026). Paras keluar = tutup tertinggi sejak beli tolak 4 × ATR14 (purata julat harian 14 hari); paras hanya naik, tidak pernah turun. Jual pada buka esok apabila harga tutup di bawah paras keluar. Saham yang lebih bergoyang diberi ruang lebih luas, jadi satu dua hari turun tidak menjual. Henti kaedah tidak dipakai dalam lorong ini (kekal dalam lorong Kaedah). Untuk melihat berapa lama trend naik dan berapa hari dipegang. Susun ikut untung lorong ini.',e:'Pegang · paras keluar 102.00; puncak 110.00; 12 hari = jual pada buka esok jika tutup bawah 102.00; paras naik apabila puncak naik.'},
  portfolio_slot:{t:'Portfolio maya 10 slot',d:'Eksperimen (sejak 16 Okt 2026): daripada semua posisi Lejar Penuh, dua portfolio maya 10 slot (10% ekuiti setiap satu, satu posisi setiap saham, keluar ikut lorong 2 Chandelier) dibina semula setiap malam. RS_10 mengisi slot kosong dengan RS pasaran tertinggi; RAWAK_10 memilih secara rawak sebagai kawalan. Kajian backtest (KAJIAN_PORTFOLIO.md) mendapati RS + Chandelier satu-satunya peraturan yang kekal di atas rawak selepas bias set 431 dikurangkan. Rekod sahaja; tiada wang sebenar.'},
  dua_lorong:{t:'Dua lorong keluar',d:'Setiap posisi dinilai serentak dengan dua peraturan keluar dari harga beli yang sama: Kaedah (peraturan penuh kaedah) dan Pegang selagi naik (tutup bawah paras keluar = tutup tertinggi sejak beli − 4×ATR14). Kaedah+saham sama boleh dibeli semula selepas lorong Kaedah keluar (lorong 2 tidak menyekat). Purata = untung akhir bagi lorong yang keluar, semasa bagi yang dipegang.',e:'Kaedah +1.2% · Selagi naik +2.5%: memegang selagi naik lebih untung setakat ini.'},
  tarikh_keluar:{t:'Tarikh keluar',d:'Hari peraturan keluar dicetuskan.',e:''},
  harga_keluar:{t:'Harga keluar',d:'Harga yang dipakai peraturan keluar (contohnya paras henti atau harga buka esok).',e:''},
  untung_akhir:{t:'Untung akhir %',d:'Untung dibekukan pada harga keluar. Kosong bagi posisi yang masih dipegang.',e:''},
  win_p:{t:'Kadar menang (papertrade)',d:'Peratus dagangan yang untung. Asasnya dinamakan di sebelah angka: (semua) = semua dagangan, untung akhir bagi yang sudah keluar dan untung semasa bagi yang masih dipegang; (selesai) = dagangan yang sudah keluar sahaja; "sedang untung" = posisi yang masih dipegang. Label kaedah menggunakan asas (semua).',e:'3/5 = 60%.'},
  pct_dipenuhi:{t:'% hampir',d:'Sejauh mana isyarat entry hampir lengkap: 100 − jarak pencetus (%). Hanya calon 90–100% dipapar. Dihadkan 99.9%. "Paras disentuh" = jarak 0: paras pencetus sudah disentuh tetapi syarat hari esok (contohnya lilin hijau atau volum) belum berlaku. Calon yang sudah menjadi isyarat lengkap dipapar berasingan. Corak lilin tanpa jarak = 90.',e:'99.2% = pencetus tinggal 0.8% lagi.'},
  harga_w:{t:'Harga',d:'Harga tutup terkini dalam data imbasan malam (sesi lengkap terakhir).',e:''},
  skor_panas:{t:'Skor panas (0–100)',d:'Gabungan pangkat persentil berbanding kumpulan lain: prestasi 1M 25%, 1W 15%, 3M 15%, breadth 15%, RS 15%, volum relatif 10%, aliran institusi bersih 5%. Tinggi = kuat DAN ramai fokus. Industri perlu ≥ 3 saham berharga.',e:'85 = lebih kuat daripada kira-kira 85% kumpulan lain.'},
  selang_p5:{t:'Julat 95% dan peluang positif',d:'Titik = anggaran terbaik skor kaedah itu. Bar = julat 95% (skor ± 1.96 × ralat piawai, medan skor_bawah/skor_atas dalam analisis/papan): bahagian bar di KIRI sifar diwarnakan merah, di KANAN hijau. Lajur kanan = peluang skor sebenar lebih besar daripada sifar, iaitu 1 − P(purata ≤ 0) yang dikira standard/penganalisis.py daripada julat yang sama; warna titik dan nombor mengikut peluang itu. Bar yang masih merangkumi sifar bermakna data setakat ini belum cukup untuk membezakan kaedah itu daripada tiada kelebihan — kedudukan tinggi tidak mengubah hakikat itu. Angka "h" = bilangan hari beli berbeza; makin banyak, makin sempit julat. Paksi dipotong pada persentil 10–90 sempadan supaya satu julat yang sangat lebar tidak memicit yang lain; julat yang terkeluar ditanda dengan anak panah di tepi.',e:'Peluang 70% bermakna: jika kita boleh ulang tempoh ini berkali-kali, kira-kira 7 daripada 10 kali skor sebenar kaedah itu positif. Itu belum cukup untuk memanggilnya terbukti.'},
  g_kump:{t:'Skor gred kumpulan',d:'Skor 0–100 setiap sektor atau industri daripada standard/gred_kumpulan.py (GitHub Actions gred_kumpulan.yml, harian): berapa banyak saham dalam kumpulan itu mempunyai RS positif, RS yang sedang naik, dan berada dalam trend naik. Carta kecil = skor itu setiap sesi sejak 25 Sep 2026 (dokumen db kumpulan/siri). Ini BUKAN harga kumpulan dan BUKAN penapis beli — kajian 13 Okt 2026 mendapati kekuatan kumpulan tidak meramal pulangan 1–3 bulan seterusnya.',e:'Skor 90 dengan garis menaik = hampir semua saham dalam kumpulan itu kuat, dan makin ramai menyertainya.'},
  fasa:{t:'Fasa rotasi',d:'Kedudukan kumpulan lawan pasaran (median semua saham). Leading: 3M dan 1M atasi pasaran. Improving: 3M masih kalah tetapi 1M atasi (mula pulih). Weakening: 3M atasi tetapi 1M kalah (mula pudar). Lagging: kedua-duanya kalah. Maklumat sahaja: ujian 2019–2026 tidak menunjukkan kumpulan Leading mengatasi kumpulan lain selepas itu.',e:''},
  prestasi_1d:{t:'1H (hari ini)',d:'Purata perubahan harga hari ini bagi saham dalam kumpulan (SST Terminal, intraday jika pasaran dibuka).',e:''},
  prestasi_1w:{t:'1W',d:'Median pulangan 5 hari dagangan bagi saham dalam kumpulan.',e:''},
  prestasi_1m:{t:'1M',d:'Median pulangan 21 hari dagangan (≈ sebulan) bagi saham dalam kumpulan.',e:'+5% = saham biasa dalam kumpulan naik 5% sebulan.'},
  prestasi_3m:{t:'3M',d:'Median pulangan 63 hari dagangan (≈ 3 bulan) bagi saham dalam kumpulan.',e:''},
  rs_sek:{t:'RS (kekuatan relatif)',d:'Purata RS Rating SST Terminal (1–99) bagi saham dalam kumpulan: prestasi harga berbanding semua saham pasaran.',e:'RS 80 = saham biasa kumpulan ini mengatasi 80% pasaran.'},
  breadth:{t:'Breadth',d:'Peratus saham dalam kumpulan yang naik dalam sebulan (data seluruh pasaran AS; snapshot lama: di atas SMA50). Tinggi = kenaikan meluas, bukan bergantung pada satu dua saham.',e:'70% = 7 daripada 10 saham dalam aliran naik jangka sederhana.'},
  breadth_pasaran:{t:'Breadth pasaran',d:'Peratus semua saham AS harga ≥ USD5 yang naik dalam sebulan (screener Moomoo). Di bawah 40% = pasaran lemah; di atas 60% = sihat.',e:''},
  volum_relatif:{t:'Volum relatif',d:'Median nisbah volum purata 5 hari terakhir berbanding purata 50 hari. Melebihi 1× = lebih ramai pedagang memberi fokus.',e:'1.3× = volum 30% lebih tinggi daripada biasa.'},
  aliran_institusi:{t:'Aliran institusi',d:'Bilangan saham kumpulan dalam senarai 20 teratas pengumpulan institusi tolak bilangan dalam senarai 20 teratas pengagihan (SST institutional_flow, perubahan % pegangan institusi).',e:'+2 = dua saham lebih banyak sedang dikumpul berbanding diagihkan.'},
  inst_skor:{t:'Skor aliran institusi',d:'Purata pangkat persentil aliran (nilai) dan median saham antara kumpulan sejenis, 0–100; gred A > 80 … E ≤ 20. Kumpulan < 3 saham tiada skor. Sumber: SEC Form 13F (standard/institusi_13f.py). Paparan sahaja, belum diuji sebagai peramal.',e:'A = institusi menambah pegangan dalam kumpulan ini lebih daripada kebanyakan kumpulan lain pada suku itu.'},
  inst_aliran:{t:'Aliran (nilai)',d:'Jumlah perubahan saham dipegang institusi × harga akhir suku, dibahagi nilai pegangan suku lalu. Hanya dana yang memfail 13F bagi KEDUA-DUA suku; pecahan saham dilaras. Ditimbang nilai, jadi saham besar menguasai.',e:'+3.0% = institusi memegang 3% lebih banyak saham kumpulan ini (ikut nilai) berbanding suku lalu.'},
  inst_median:{t:'Median saham',d:'Median perubahan % saham dipegang institusi bagi saham kumpulan ini yang ada ≥ 5 pemegang suku lalu. Berat sama: tidak dikuasai saham besar.',e:'+5% = saham biasa dalam kumpulan ini dipegang 5% lebih banyak oleh institusi.'},
  inst_bersih:{t:'Saham bersih dibeli',d:'% saham kumpulan dengan lebih banyak dana membuka posisi baharu daripada menutup posisi sepenuhnya.',e:'70% = tujuh daripada sepuluh saham mendapat pemegang institusi baharu bersih.'},
  inst_usd:{t:'Aliran USD',d:'Jumlah aliran dalam dolar AS pada harga akhir suku (j = juta, bn = bilion).',e:'+850 j = institusi bersih membeli ~USD 850 juta saham kumpulan ini.'},
  inst_dana:{t:'Dana baru · keluar',d:'Bilangan pasangan dana–saham yang dibuka baharu (hijau) dan ditutup sepenuhnya (merah) dalam kumpulan ini pada suku itu.',e:'120 · 40 = 120 posisi baharu dibuka, 40 ditutup penuh.'},
  inst_teratas:{t:'Saham dikumpul teratas',d:'Lima saham kumpulan ini dengan aliran USD institusi terbesar (≥ 5 pemegang suku lalu). Peratus = perubahan saham dipegang institusi. Hover untuk dana baru tolak keluar dan aliran USD.',e:'NVDA +4.2% = institusi memegang 4.2% lebih banyak saham NVDA berbanding suku lalu.'},
  volum_luar_biasa:{t:'Volum luar biasa',d:'Saham yang didagangkan ≥ 2× purata volum 20 hari hari ini (SST unusual_volume).',e:''},
  n_saham:{t:'Saham',d:'Bilangan saham dengan sejarah harga yang dipakai untuk 1W/1M/3M, breadth dan volum; \"daripada\" = semua saham yang dikelaskan dalam kumpulan.',e:''},
  pencetus:{t:'Pencetus',d:'Syarat entry terakhir yang belum dipenuhi.',e:''},
  syarat_belum:{t:'Syarat belum cukup',d:'Keadaan semasa dan apa yang perlu berlaku pada tutup esok supaya isyarat lengkap.',e:''},
  paras:{t:'Paras pencetus',d:'Paras harga tutup esok yang melengkapkan isyarat.',e:''},
  jarak:{t:'Jarak',d:'Beza peratus antara harga terkini dan paras pencetus.',e:''},
  ditambah:{t:'Tarikh masuk watchlist',d:'Tarikh tutup sesi apabila saham mula masuk watchlist.',e:''},
  hari_watch:{t:'Hari dalam watchlist',d:'Hari dagangan sejak ditambah. Calon dibuang sebaik sahaja terkeluar signal (< 90%).',e:''},
  slot_m:{t:'Slot Moomoo',d:'Bilangan posisi sistem harian bagi kaedah itu dalam akaun simulasi Moomoo (maksimum 10). Posisi yang kena isyarat keluar tidak dijual, jadi slotnya kekal dikira.',e:'10/10 = isyarat baharu kaedah ini dibeli secara maya dalam Papertrade C.'},
  slot_w:{t:'Moomoo + warisan',d:'Semua pegangan Moomoo yang dipetakan ke kaedah itu, termasuk pegangan lama v1 dan isyarat dikongsi.',e:''},
  jumlah_dag:{t:'Jumlah dagangan',d:'Bilangan posisi (dipegang + sudah keluar) dalam akaun yang dipilih. Gabung = Moomoo lama + Papertrade C.',e:''},
  untung_purata:{t:'Untung purata',d:'Purata untung setiap dagangan: untung akhir bagi yang sudah kena isyarat keluar, untung semasa bagi yang masih dipegang.',e:'+1.5% = secara purata setiap belian naik 1.5%.'},
  untung_median:{t:'Untung median',d:'Untung dagangan di tengah-tengah selepas disusun. Kurang terkesan oleh satu dua dagangan yang sangat besar atau sangat teruk berbanding purata.',e:'Purata +3% tetapi median −0.5%: untung datang daripada beberapa saham sahaja.'},
  kerugian_terbesar:{t:'Kerugian terbesar',d:'Untung paling rendah bagi satu dagangan (akhir atau semasa).',e:''},
  hari_purata:{t:'Purata hari dipegang',d:'Purata hari dagangan dari tarikh beli hingga hari ini (atau hingga tarikh keluar).',e:''},
  min_n:{t:'Minimum dagangan',d:'Sembunyikan kaedah yang dagangannya kurang daripada bilangan ini daripada carta dan jadual kaedah. Kad KPI dan bahagian Paling Teruk tetap mengira semua.',e:''},
  kadar_gagal:{t:'Kadar gagal',d:'Peratus dagangan kaedah itu yang sedang rugi atau keluar dengan rugi.',e:'4 rugi daripada 5 = 80%. Amaran jika ≥ 60% (≥ 3 dagangan).'},
  skor_swing:{t:'Skor kaedah swing',d:'Satu skor 0–100% bagi setiap kaedah untuk memilih 3–4 kaedah swing yang untung dan mampan. Semua untung ialah pulangan BERSIH kos 0.1% setiap belah dan TIDAK dipangkas (untung kaedah swing datang daripada beberapa dagangan besar). Asas: posisi matang apabila kaedah ada ≥ 20 matang dan ≥ 10 hari beli; sebelum itu semua posisi (awal). Lorong terbaik ditolak penalti pilihan SE × √((1 − ρ)/π). Untung dilaras = jangkaan backtest dipotong (Papan Penganalisis) + B × (purata − jangkaan), B = bahagian bukti hadapan (n berkesan ikut hari beli). Sembilan metrik dalam empat tunjang: Untung 40 (untung dilaras 25; untung 21 hari = 21 × untung dilaras ÷ hari pegang 10; lebihan atas penanda aras dalaman = purata semua posisi semua kaedah yang dibeli hari sama 5), Konsisten 20 (faktor untung had 3; had bawah Wilson pecahan hari beli berpurata positif), Risiko 25 (CVaR 10% = purata 10% dagangan terburuk 15; penurunan maks ÷ ATR14 hari isyarat 10), Bukti 15 (B 10; semakan luar sampel 0–3 5). Setiap metrik dipeta 0–100 pada julat beku persentil 5–95 kaedah backtest set 431; tunjang digabung secara geometrik dengan lantai 5, jadi satu tunjang lemah menurunkan skor dengan jelas. Metrik sekunder tanpa data dianggar pada persentil ke-25. Pintu: ≥ 20 selesai, ≥ 10 hari beli, pegang backtest 3–30 hari, untung dilaras > 0. Teras = skor ≥ 70%, asas matang, ≥ 20 hari beli, P(untung > 0) ≥ 90% dan stabil. ▲▼ = berbanding tutup sesi lalu. Stabil = P(4 teratas) ≥ 50% dalam 1,000 simulasi Monte Carlo berbiji: untung dilaras diambil daripada taburan posterior, wajaran tunjang dan metrik × U(0.5, 1.5), gabungan geometrik atau aritmetik secara rawak (Pangkat MC = median dan p5–p95). Bertindih = peratus posisi yang sahamnya juga dibeli kaedah lain dalam ±5 hari. Pantau (Papan Penganalisis): AMARAN = 1 amaran CUSUM bawah atas purata kohort harian matang (h dikalibrasi bootstrap backtest supaya amaran palsu ~ sekali dalam 2 tahun); GANTUNG = kejatuhan ekuiti kohort > 1.5 × maks backtest, tempoh di bawah puncak > maks backtest, atau purata 20 hari beli matang terakhir < persentil ke-5 purata bergulir 20 hari beli backtest (dilaras ke jangkaan; brek ikut data hadapan); BERSARA = P(purata ≤ 0) > 90% dengan ≥ 20 hari beli, atau 2 amaran CUSUM. Gabungan cadangan: skor tertinggi ≥ 55% dalam kaedah stabil yang tidak GANTUNG/BERSARA, setiap pasangan pertindihan ≤ 20% dan korelasi pulangan lebihan atas SPY ≤ 0.7 (mingguan jika ≥ 8 minggu sepunya, selainnya harian ≥ 10 hari; lorong kaedah; belum cukup data tidak menyekat); pemberat sama, DM = 1/√(1/N + (1 − 1/N)ρ̄) (ρ negatif = 0, had 2.5), kuota 10 slot sama rata. Gabungan beku (data/analisis/gabungan_beku.json) dijejak ke hadapan dalam portfolio maya 10 slot lawan #1 sahaja, kaedah rawak dan SPY. Ujian ramalan: Spearman mingguan skor lawan pulangan posisi 5 sesi seterusnya.',e:'Tunjang U 80 · K 60 · R 50 · B 40 → geometrik = 80^0.40 × 60^0.20 × 50^0.25 × 40^0.15 ≈ 61% (aritmetik 62.5%).'},
  kerugian_purata:{t:'Kerugian purata',d:'Purata untung bagi dagangan yang rugi sahaja. Amaran jika −5% atau lebih teruk.',e:''},
  keluar_rugi:{t:'Isyarat keluar rugi',d:'Bilangan posisi yang kena isyarat keluar kaedah (henti rugi, isyarat jual) dengan untung akhir negatif. Amaran jika ≥ 3.',e:''},
  penurunan_maks:{t:'Penurunan maksimum',d:'Bagi setiap dagangan: harga rendah terendah sejak hari beli (hingga hari ini atau hingga keluar) ÷ harga beli − 1. Purata = risiko biasa yang ditanggung; terburuk = satu kejatuhan paling dalam. Lebih hampir 0 = lebih selamat.',e:'Beli 100, pernah jatuh ke 94 = −6%, walaupun kini untung.'},
  skor_us:{t:'Skor Untung×Selamat (0–100)',d:'Skor = 100 × U × S. U (untung) = 0.6 × untung purata dipetakan −5%→0 hingga +10%→1, + 0.4 × kadar menang. S (selamat) = 0.6 × penurunan maks purata dipetakan −10%→0 hingga 0%→1, + 0.4 × kerugian terbesar dipetakan −20%→0 hingga 0%→1. Tinggi hanya jika KEDUA-DUANYA baik. Kaedah dengan kurang daripada 5 dagangan didarab n/5 (keyakinan rendah).',e:'U 0.8 × S 0.9 = 72; jika hanya 2 dagangan: 72 × 0.4 = 29.'},
  g_s:{t:'S · Sektor',d:'Sejak 19 Okt 2026 (v2): kedudukan sektor saham itu dalam seluruh pasaran AS pada hari isyarat, ikut peratus saham sektor itu di atas SMA200, dipangkat antara 11 sektor (skor 0–100; A > 80, B > 60, C > 40, D > 20, E ≤ 20). Paparan sahaja: kajian 18 Okt 2026 mendapati gred sektor tidak membantu memilih saham, jadi tidak dikira dalam gred keseluruhan. Gred sebelum 19 Okt = v1 (skor panas). Baris "1B kini" ialah prestasi median sektor sebulan menurut tab Sector hari ini.',e:'A 91/100 · Technology = peratus saham di atas SMA200 antara tertinggi semasa isyarat.'},
  g_i:{t:'I · Industri',d:'Sejak 19 Okt 2026 (v2): kekuatan industri saham itu (plate Moomoo, seluruh pasaran AS) pada hari isyarat = pangkat Weinstein (RS lawan SPY di atas purata 52 minggu, RS naik sebulan, indeks di atas purata 30 minggu yang naik) + pangkat pulangan median 1 bulan, antara ~141 industri. A > 80, B > 60, C > 40, D > 20, E ≤ 20. Kajian 2019–2026: A kuat, B–D hampir neutral, E lemah (purata dagangan kaedah momentum A +0.03% … E −1.21% relatif). Tidak terpakai bagi kaedah pantulan.',e:'B 73/100 · Semiconductors = industri kuat, tetapi bukan 20% teratas.'},
  g_r:{t:'R · RS rating',d:'Kekuatan relatif harga saham (gaya IBD, 1–99) berbanding SELURUH pasaran AS harga ≥ USD5 (~3,900 saham; sandaran: stor harga): 40% pulangan 3 bulan terkini + 20% setiap satu daripada tiga suku sebelumnya. Gred (sejak 18 Okt 2026): A = RS 90–99 disahkan, B = 80–89 disahkan, C = 70–79 atau ≥ 80 tidak disahkan, D < 70. Disahkan = saham naik dalam 12 bulan, SPY di atas SMA200 dan Mansfield > 0 (RS line di atas purata 52 minggu). Kajian 3,830 saham 2005–2026: lebihan 63 hari atas pasaran A +1.5%, B +0.6%, C ≈ 0, D −0.2 hingga −0.4%; apabila SPY < SMA200 saham RS tinggi kalah kepada pasaran; RS 95+ purata tertinggi tetapi median ≈ 0 (ditanda berisiko). Kelebihan tidak signifikan 2005–2015. Direkod sahaja, bukan penapis belian.',e:'A · RS 92 · disahkan = 8% teratas pasaran dan pasaran sedang naik. C · RS 91 · tidak disahkan: pasaran lemah = kekuatan RS belum boleh dipercayai.'},
  g_p:{t:'P · Pemangkin (v3, sejak 18 Okt 2026)',d:'Hanya isyarat yang lulus ujian data 2012–2026. K1 premium pengumuman: earnings dijadualkan 6–21 hari dagangan lagi +2, 1–5 hari +1. K2: reaksi hari earnings ≥ +20% lawan pasaran, ≤ 10 hari lalu +4, 11–20 hari +3 (🔥 Panas). Veto berita ≤ 20 hari dagangan: tawaran saham (pencairan) atau keputusan FDA akan datang → had C; sasaran ambil alih → had D. Gred: A ≥ 3, B 2, C 1, D 0 (tiada pemangkin). Berita, analisis dan volum tidak diberi mata. Baris sebelum 18 Okt guna skala lama. Ketik tajuk untuk membuka artikel.',e:'"🔥 Panas · reaksi earnings +24.0% lawan pasaran (3 hari lalu) +4" = A; "earnings 12 hari dagangan lagi (premium pengumuman) +2" = B.'},
  g_k:{t:'Kewangan · gred kewangan v7 (sejak 18 Okt 2026)',d:'Keadaan kewangan syarikat daripada penyata suku Moomoo (dikira sendiri, bukan nisbah siap). K kekukuhan: hutang bersih/EBITDA dan FFO/hutang ikut jadual S&P, semakan Simply Wall St, distance-to-default; U keuntungan: ROIC > 9%, ROE ≥ 15% dengan ROA ≥ 6%, kemampanan 5/10 tahun, margin, aliran tunai; T pertumbuhan: EPS dan jualan YoY, ROIC tambahan; S arah suku terkini berbanding suku sama tahun lalu. Gred = purata K U T S, tidak melebihi K + 1 huruf; berubah 1 huruf hanya selepas 2 suku berturut. Peringkat (muda, tumbuh laju, matang, kitaran, merosot), bendera forensik (menurunkan keyakinan sahaja) dan jarak had Syariah (hutang dan tunai berbanding aset dan nilai pasaran 24 bulan; gagal semua kaedah = E). Rekod sahaja: tidak masuk Gred keseluruhan dan belum diuji prestasi. Spec: spec/GRED_KEWANGAN_v7.md.',e:'B (K:A U:B T:C S:B) · tumbuh laju · keyakinan sederhana · Syariah lulus.'},
  g_q:{t:'Q · Laporan suku (QR)',d:'Bilangan hari dagangan sebelum laporan suku (earnings) seterusnya. Harga boleh melompat melepasi paras henti pada hari laporan. Kajian 18 Okt 2026 (659k dagangan 134 kaedah, 2019–2026), risiko lompat henti berbanding beli > 30 hari sebelum QR: E (≤ 5 hari) 5.7×, D (6–10) 3.8×, C (11–15) 2.5×, B (16–21) 1.7×, A (> 21 atau tiada laporan dalam 30 hari) ~1×. Selepas QR: 0–1 hari sekurang-kurangnya C, 2–3 hari sekurang-kurangnya B (volatiliti belum reda). Label ini maklumat risiko sahaja, bukan penapis belian dan bukan jangkaan untung.',e:'E · 4 hari lagi · 20 Okt · Elak = laporan jatuh dalam tempoh pegangan.'},
  gred:{t:'Gred keseluruhan',d:'Purata mata dimensi pada hari isyarat (A=4, B=3, C=2, D=1, E=0). Sejak 19 Okt 2026: Industri (kecuali kaedah pantulan), Pemangkin dan QR. Sektor tidak dikira (paparan sahaja, kajian 18 Okt 2026); RS tidak dikira sejak 18 Okt 2026 (gred RS sudah menggabung pengesahan pasaran dan dinilai berasingan). Dimensi tanpa data tidak dikira. Direkod untuk diuji, belum terbukti meramal dan bukan penapis belian. Panel Prestasi ikut gred menilai setiap gred selepas ≥ 20 dagangan tertutup.',e:'Industri A, Pemangkin C, QR A = purata 3.3 → gred B.'},
  usd_sama:{t:'Nilai sama USD1,000',d:'Untung bersih jika setiap posisi bernilai USD1,000 (sama berat), tanpa mengira harga saham. Rekod tetap 1 unit; ini cara kiraan sahaja supaya saham mahal tidak mendominasi.',e:'3 posisi +10%, −5%, +2% = +USD70 atas modal USD3,000.'},
  data_kini:{t:'Kemas kini terakhir',d:'Masa data dashboard terakhir dikemas kini (harian/status) dan tarikh tutup sesi AS yang dipakai. Data dikira oleh GitHub Actions selepas pasaran AS tutup dan ditolak ke dashboard setiap hari (Isnin–Sabtu, selepas belian 9:35 NY). Merah jika lebih 30 jam tanpa kemas kini (74 jam merentas hujung minggu).',e:'"2026-10-19 22:25 MYT · data tutup 2026-10-16" = data hingga tutup Jumaat 16 Okt, ditolak Isnin malam.'},
  kat_asal:{t:'Asal kaedah',d:'Pencipta (orang atau pihak yang memperkenalkan teknik) dan sumbernya: buku, artikel, laman atau saluran YouTube. "Tidak dinyatakan" = sumber tidak menamakan pencipta; tidak diteka.',e:'Mark Minervini · Trade Like a Stock Market Wizard (2013).'},
  kat_masuk:{t:'Masuk (entry)',d:'Syarat isyarat beli varian yang sedang digunakan dalam kod. Isyarat dikira pada harga tutup; belian pada harga buka hari dagangan berikutnya.',e:''},
  kat_keluar:{t:'Keluar (exit)',d:'Sasaran untung atau isyarat jual kaedah (selain henti rugi). Isyarat jual pada tutup dilaksanakan pada harga buka esok; sasaran dijual pada paras sasaran.',e:''},
  kat_pegang:{t:'Pegang (hold)',d:'Berapa lama posisi dipegang: had masa maksimum dalam hari dagangan (jual pada tutup hari terakhir), atau tiada had iaitu pegang sehingga isyarat keluar atau henti rugi.',e:'Maks 21 hari = jual pada tutup hari ke-21 jika belum keluar.'},
  kat_henti:{t:'Henti rugi',d:'Paras jual untuk menghadkan rugi. Jika harga rendah menyentuh henti, jual pada paras henti; jika harga buka sudah di bawah henti, jual pada harga buka.',e:'Henti 12% bawah tutup isyarat: beli 100 → jual jika jatuh ke 88.'},
  kat_bt:{t:'Backtest (set 431)',d:'Keputusan ujian data lama bagi varian yang sama seperti dalam kod, atas 431 saham Shariah dari 1 Nov 2019 hingga 2 Okt 2026, dengan istilah yang sama seperti tab Backtest: pingat atau langkah saringan pertama yang gagal, untung setahun, jatuh terburuk, purata setiap dagangan, kadar menang, bilangan dagangan dan purata hari pegang. Susun ikut untung setahun.',e:'🥈 Perak · untung setahun 33.3% · jatuh terburuk −41%.'},
  kat_pt:{t:'Papertrade (M+C)',d:'Prestasi sebenar setakat ini dalam Papertrade C (akaun rasmi sejak 13 Okt 2026; Moomoo lama dalam tab Prestasi atau Posisi): untung purata (akhir bagi yang keluar, semasa bagi yang dipegang), kadar menang, kerugian terbesar dan bilangan dagangan. Pil status (KUAT/PERHATI/LEMAH) datang daripada Papan Penganalisis, bukan daripada dagangan akaun ini. Susun ikut untung purata.',e:'PERHATI · +1.8% · menang (semua) 60% · 5 dagangan (2 selesai).'},
  kat_umum:{t:'Peraturan belian',d:'Semua kaedah: isyarat pada harga tutup hari ini, beli 1 unit maya pada harga buka esok dalam Papertrade C. Dibatalkan jika harga buka ≤ henti. Tiada order Moomoo dan tiada wang sebenar.',e:''},
  slot_c:{t:'Slot Claude',d:'Posisi maya Claude bagi kaedah itu: dipegang (belum keluar) dan jumlah semua (termasuk yang sudah keluar). Tiada had.',e:''},
  lajur:{t:'Lajur ringkas / penuh',d:'Ringkas: lajur utama sahaja; gred jadi satu lajur lencana dan butiran penuh dibuka dengan mengetik baris. Penuh: semua lajur seperti dahulu. Pilihan disimpan dalam pelayar ini. Di telefon pilihan ini tiada: setiap saham satu baris (Saham · Kaedah · hari dipegang (h) · status keluar · Gred · Untung %); ketik baris untuk kad tiga zon (posisi; keluar dengan jarak harga ke paras keluar, oren jika dalam 3%, merah jika dalam 1%; gred dengan nilai), butang Butiran penuh untuk helaian. Jalur kiri kad: hijau untung, merah rugi, oren hampir paras keluar.',e:''},
  selesai:{t:'Dagangan selesai',d:'Dagangan yang sudah keluar ikut peraturan kaedah (lorong 1). Purata = untung akhir purata; menang = peratus yang keluar dengan untung. Pada minggu awal angka ini cenderung negatif kerana dagangan rugi kena henti dahulu, manakala yang untung masih dipegang.',e:''},
  dipegang:{t:'Masih dipegang',d:'Posisi yang belum kena peraturan jual kaedah. Purata = untung semasa (belum direalisasi) berbanding harga beli.',e:''},
  jangkaan:{t:'Jangkaan (expectancy)',d:'Kadar menang × purata menang + kadar rugi × purata rugi = purata untung yang dijangka bagi setiap dagangan. Kadar menang rendah masih boleh untung jika untung purata jauh lebih besar daripada rugi purata.',e:'40% × +10% + 60% × −4% = +1.6% setiap dagangan.'},
  sebab_keluar:{t:'Sebab keluar',d:'Sebab dagangan keluar dalam lorong kaedah: kena henti rugi, isyarat jual kaedah (jual pada buka esok), capai sasaran untung, atau had masa. Lajur terakhir = untung purata bagi setiap sebab.',e:''},
  untung_terkumpul:{t:'Untung terkumpul',d:'Untung dagangan yang sudah selesai, dikumpul ikut tarikh keluar, sebagai % modal jika modal dibahagi sama rata kepada setiap dagangan selesai. Nilai akhir = untung purata % setiap dagangan selesai, jadi bilangan dagangan tidak membesarkan angka. Posisi yang masih dipegang tidak termasuk (untung belum direalisasi).',e:'3 dagangan selesai +10%, −5%, +2% → terkumpul +3.33%, +1.67%, +2.33% (akhir = purata).'},
  taburan:{t:'Taburan untung',d:'Bilangan dagangan dalam setiap julat untung 2 mata peratus. Pilih Semua, Selesai atau Masih dipegang. Bentuknya menunjukkan sama ada keputusan datang daripada banyak dagangan kecil atau beberapa dagangan besar.',e:''},
  keyakinan:{t:'Tahap keyakinan',d:'Ikut bilangan dagangan selesai: rendah (< 30), sederhana (30–99), tinggi (≥ 100). Dengan sampel kecil, kadar menang dan purata boleh jauh daripada nilai sebenar kerana nasib. Label kaedah diberi selepas 20 dagangan selesai.',e:''},
  terlalu_awal:{t:'Terlalu awal',d:'Label sudah diberi, tetapi papertrade kaedah ini belum berjalan selama purata tempoh pegang backtestnya. Dalam tempoh pendek hanya dagangan yang keluar cepat (biasanya kena henti rugi) sudah selesai, jadi keputusan awal belum mewakili kaedah. Peraturan label tidak berubah; ini amaran sahaja. Tarikh adil = hari dagangan ke-N selepas belian pertama kaedah, N = purata hari pegang backtest (dibundar ke atas).',e:'Papertrade 7 hari lawan backtest pegang 15 hari = terlalu awal.'},
  bt_vs_pt:{t:'Sebenar lawan backtest',d:'Sebenar = dagangan papertrade yang sudah selesai (kadar menang dan purata untung). Backtest = varian sama, 2019–2026 (kadar menang, purata setiap dagangan, purata hari pegang). Tempoh = hari dagangan sejak belian pertama kaedah dalam papertrade.',e:'Menang 0% lawan 21% · tempoh 7 lawan 15 hari = belum boleh dibandingkan.'},
  isyarat_lengkap:{t:'Isyarat lengkap dalam watchlist',d:'Calon yang syarat belum cukupnya "Tiada (isyarat sah)": semua syarat entry dipenuhi pada tutup terakhir. Ia kekal dalam watchlist sehingga imbasan 8:02 malam (Isnin–Jumaat) memindahkannya ke senarai beli, kemudian dibeli maya pada buka hari dagangan berikutnya. Status disemak dalam Papertrade C: menunggu belian, dibeli, dilangkau kerana posisi kaedah dan saham yang sama masih dipegang, atau tidak dibeli walaupun sesi belian sudah berlalu.',e:'Lengkap pada tutup Jumaat → imbasan Isnin 8:02 malam → dibeli pada buka Isnin.'},
  anl_skor:{t:'Skor gabungan',d:'Purata pulangan bersih setiap dagangan yang dijangka, menggabungkan backtest (dipotong) dan posisi hadapan matang: (n0 × jangkaan backtest + n × purata matang) ÷ (n0 + n). n0 = berat backtest, maksimum 30 dagangan setara, kurang jika backtest ada sedikit dagangan. Makin banyak posisi matang, makin data sebenar menguasai skor. Julat = selang keyakinan 95%; julat yang merentasi 0 bermaksud belum terbukti untung.',e:'Jangkaan +1.2%, 0 posisi matang → skor +1.2%. Selepas 300 posisi matang dengan purata −0.5%, skor ≈ −0.3%.'},
  anl_bulan:{t:'Skor sebulan',d:'Skor gabungan ÷ purata hari pegang backtest × 21 hari dagangan: anggaran untung setiap posisi sebulan jika modal dipusing semula sebaik keluar. Membolehkan kaedah pegang pendek dan panjang dibanding secara adil. Kaedah yang jarang memberi isyarat tidak menggunakan modal sepenuhnya; lihat CAGR backtest dan Dagangan/tahun.',e:'Skor +2.0% setiap dagangan, pegang 10 hari → +4.2% sebulan.'},
  lift_lift:{t:'Lift masuk 10 sesi (G3)',d:'Sejak pindaan 7 Nov 2026: pulangan kaedah pada ufuk TETAP 10 sesi (beli pada buka hari beli, nilai pada tutup sesi ke-10, kos 0.2%) TOLAK purata saham-hari UNIK lain dalam kolam Lejar yang dibeli pada hari sama DAN berada dalam tercile ATR14% yang sama, tidak termasuk saham-hari kaedah itu sendiri. Ufuk tetap bermakna peraturan keluar tidak mempengaruhi nombor ini; nilai keluar diukur oleh G2 (buku harian) dan G6 (portfolio). SE dua hala (saham, minggu beli), BH-FDR atas semua kaedah diuji. Reka bentuk ini lulus ujian plasebo: belian rawak lulus palsu 1.9–3.4% sahaja (laporan/PLASEBO_GATE.md). Versi lama (padan hari beli × baldi hari pegang) meluluskan belian RAWAK sehingga 51% dan dibuang.',e:'Lift +2.0 mata = saham pilihan kaedah naik purata 2 mata peratus lebih banyak dalam 10 sesi daripada saham lain yang dibeli hari sama dengan turun naik setara.'},
  lift_status:{t:'Status lift',d:'BELUM CUKUP = hari beli langsung (ufuk 10 sesi lengkap) masih kurang daripada yang diperlukan untuk melihat lift 2 mata peratus pada kuasa 80%, selepas mengambil kira semua kaedah dibanding serentak. Sesuatu kaedah hanya diuji selepas ≥ 30 saham-hari merentas ≥ 5 minggu beli. Selagi BELUM CUKUP, jadual ini senarai calon — bukan pangkat yang boleh dipilih.',e:'Ujian pertama memerlukan ~5 minggu data langsung; sebelum itu jadual kosong dengan sengaja.'},
  rejim_qqq:{t:'Rejim pasaran QQQ (ON / OFF)',d:'ON = QQQ tutup > SMA50 DAN SMA10 > SMA20; OFF selainnya. Gate G1 kad skor memerlukan ≥ 10 hari beli langsung dalam SETIAP rejim, kerana kelebihan relatif saham pemimpin bertukar tanda ikut rejim ini dalam kedua-dua tingkap 2010–19 dan 2020–26 (12/17 tahun). Paparan dan gate kematangan sahaja: ia bukan penapis belian papertrade.',e:'Data yang dikumpul semasa OFF belum menjawab bagaimana kaedah berprestasi semasa ON, jadi G1 menunggu kedua-duanya.'},
  beli_kertas:{t:'Belian papertrade esok',d:'Isyarat lengkap pada tutup sesi terakhir daripada SEMUA kaedah (papertrade/senarai_beli, sama dengan panel Senarai beli). beli.yml membelinya secara MAYA pada buka sesi berikutnya, dan membatalkan jika buka ≤ henti atau buka > buka maks. Ini belian kertas: tiada order, tiada wang sebenar. Hanya kaedah berstatus TERBUKTI dalam kad skor bermakna untuk wang sebenar.',e:'Senarai 1,000 isyarat = sehingga 1,000 posisi kertas baharu pada buka esok; tiada satu pun order sebenar.'},
  buku_harian:{t:'Buku harian (G2)',d:'Satu buku bagi setiap kaedah: setiap posisi lorong 1 diberi berat sama pada belian, ditanda pada tutup setiap sesi, keluar ikut peraturan kaedah, kos 0.2% setiap pusingan. Nombor = purata pulangan harian buku itu (% sehari); [had bawah … had atas] = selang 95% dengan SE Newey-West (lag 5), kerana posisi sehari berkorelasi. G2 lulus jika purata > 0 DAN had bawah > 0. Ganti selang setiap posisi lama yang terlalu sempit.',e:'+0.05% [−0.10 … +0.20] = purata positif tetapi selang merangkumi sifar: belum terbukti.'},
  skor_kaedah:{t:'Skor Kaedah 0–100',d:'Pangkat MAKLUMAT semua kaedah dari semua segi (standard/skor_kaedah.py; pradaftar 9 Nov 2026 SPEC_SKOR_KAEDAH.md). Empat tiang: Untung 35 (jangkaan, lebihan T4 lawan SPUS, payoff), Tahan 30 (pulangan/|MDD| T4, Ulcer, CVaR10, tanpa5), Bukti 25 (t Newey-West buku harian dideflasi N ujian, saiz sampel, liputan rejim), Konsisten 10 (K-ratio, lift, kecekapan jalan-ke-depan). Setiap metrik dipetakan 0–100 dengan sauh tetap daripada pakar, tiang digabung sebagai min geometri berberat, kemudian dikecut ke 50 ikut hari beli. BUKAN keputusan wang sebenar: hanya TERBUKTI kad skor.',e:'61 dengan 11 hari beli = tiang kuat tetapi data sedikit; selepas 60 hari beli skor yang sama akan ~80.'},
  t4_r10:{t:'T4 pada MDD −10% (G6)',d:'Lorong T4 = portfolio maya 10 slot yang membeli isyarat kaedah itu SAHAJA. Supaya setara dengan toleransi kejatuhan anda (−10%), pulangannya diskala: pulangan × min(1, 10 ÷ |MDD|) — berat yang akan memegang kejatuhan pada −10% — dan dibanding SPUS yang diskala sama dalam tingkap sama. G6 lulus jika T4 ≥ 126 sesi, pulangan > 0, nilai berskala > SPUS berskala, DAN nisbah pulangan ÷ |MDD| melebihi MAKSIMUM 20 cabutan rawak.',e:'T4 +12% dengan MDD −20% → +6% pada MDD −10%; SPUS +8% dengan MDD −8% → +8%; G6 gagal.'},
  anl_jangkaan:{t:'Jangkaan backtest',d:'Purata pulangan bersih setiap dagangan dalam backtest set 431 (2019–2026, varian aktif), dipotong kerana kaedah dipilih atas data yang sama: dikekalkan 25%, tambah 25% bagi setiap semakan luar sampel yang lulus (maksimum 100%).',e:'Backtest +4.0%, lulus 1 semakan → jangkaan +2.0%.'},
  anl_semakan:{t:'Semakan luar sampel',d:'Tiga ujian di luar data backtest asal. S1–S4: varian sama mengatasi beli-semua (EW) dalam sekurang-kurangnya 3 daripada 4 kumpulan saham kecil. WFO: walk-forward luar sampel 1 Jan 2023 – 2 Okt 2026, CAGR melebihi EW 423 dalam tempoh sama. 2000 AS: AUTOTUNE A01 atas 2000 saham AS lain (luar sampel 2013 – Sep 2024), CAGR melebihi SPY dalam kumpulan A dan B. ✓ lulus, ✗ gagal, – tiada data.',e:'✗ ✓ ✗ = lulus WFO sahaja (1/3).'},
  anl_hadapan:{t:'Data hadapan',d:'Posisi Lejar Penuh (semua isyarat setiap kaedah, seluruh alam Shariah, sejak 16 Okt 2026) dan Papertrade C sebelum Lejar bermula (8–15 Okt 2026). Hanya posisi MATANG dikira: dibeli sekurang-kurangnya maks(14 hari, 1.5 × hari pegang backtest) lalu; tutup = untung akhir, masih terbuka = untung semasa. Ini mengelak bias awal, kerana posisi yang tutup dahulu kebanyakannya kena henti rugi. Posisi Lejar yang isyaratnya jatuh semasa Papertrade C sebelum Lejar masih memegang kaedah dan saham yang sama tidak dikira (enjin mengabaikan isyarat itu), supaya laluan harga yang sama tidak dikira dua kali.',e:'92 posisi · 0 matang = belum ada bukti hadapan.'},
  anl_status:{t:'Status analisis',d:'BELUM CUKUP: kurang 20 posisi matang. AMARAN: sekurang-kurangnya 10 posisi matang dan purata jauh di bawah jangkaan (t < −2). KUAT: julat 95% skor di atas 0. LEMAH: julat 95% skor di bawah 0. PERHATI: selainnya. Rekod analisis sahaja; tidak menapis belian.',e:''},
  anl_c:{t:'Papertrade C (semakan)',d:'Posisi sah Papertrade C bagi kaedah ini dan purata pulangan bersih semasa (semua posisi, termasuk yang belum matang). Selepas Lejar bermula, isyarat C sama dengan Lejar, jadi C tidak dikira dua kali dalam skor; lajur ini menyemak pelaksanaan (harga buka Moomoo lawan yfinance).',e:''},
  anl_l2:{t:'Lorong 2 (selagi naik)',d:'Purata untung bersih (kos 0.1% setiap belah) posisi matang jika keluar ikut lorong 2 (Chandelier tutup 4×ATR14, paras hanya naik, tanpa henti kaedah), untuk dibanding dengan purata lorong kaedah; yang masih dipegang dinilai pada tutup terakhir. Maklumat sahaja; tidak masuk skor.',e:''},
  kn_pangkat:{t:'Pangkat (dalam pradaftar sendiri)',d:'Kedudukan baris itu antara ujian pradaftar YANG SAMA, 1 = terbaik, ikut metrik yang disebut dalam sel (jangkaan tahan bagi A/B/GAB/SX, CAGR tahan bagi PORT, jangkaan setiap signal bagi CARA). Tiada pangkat merentas kumpulan: 2 mata lift dan 9% CAGR bukan unit yang sama. Pangkat dan gate dua perkara berbeza \u2014 pangkat 1 boleh gagal gate, dan selalunya begitu. Baris rujukan (asas, kawalan, semak pemalsuan) tiada pangkat kerana ia bukan ujian dipradaftar.',e:'A 2/280 = jangkaan tahan kedua tertinggi antara 280 ujian masuk \u2014 bukan antara 413 ujian.'},
  kn_lift:{t:'Lift tahan (Nxx)',d:'Jangkaan peraturan itu tolak jangkaan "beli SETIAP bar" dengan KELUAR YANG SAMA, pada tingkap tahan 2020\u20132025. Lift positif bermakna peraturan menambah nilai atas asas; lift negatif bermakna menapis merugikan. Asas mesti keluar yang sama, kerana pilihan keluar sendiri menggerakkan jangkaan ~5 mata peratus.',e:'Lift +0.392 mata pada keluar X3 = peraturan ini +0.392 lebih baik daripada membeli setiap bar dan keluar cara sama.'},
  kn_jangkaan:{t:'Jangkaan setiap dagangan (Nxx)',d:'Purata pulangan mutlak setiap dagangan dalam tingkap tahan, selepas kos. Lift positif atas asas NEGATIF masih merugikan, jadi kedua-dua lajur mesti dibaca bersama. Ini jangkaan setiap dagangan, bukan prestasi portfolio: 8\u201310 slot mendarat dekat median, bukan min.',e:'+8.541% setiap dagangan dengan n 195,681.'},
  kn_ekor:{t:'Tanpa 5% teratas',d:'Jangkaan selepas 5% dagangan paling untung dibuang. Dalam kajian ini 5% teratas membawa 63.7% jumlah pulangan kolam, jadi peraturan yang kelebihannya hidup sepenuhnya dalam ekor kanan tidak boleh ditangkap dengan 8\u201310 slot. Positif = kelebihan bertahan walaupun ekor dipangkas.',e:'+2.858% tanpa 5% teratas (asas +0.912%).'},
  kn_gate:{t:'Gate pradaftar',d:'Empat syarat yang ditulis dan dikomit SEBELUM keputusan dilihat. Gate 0: jangkaan mutlak > 0. Gate 1: lift positif pada kedua-dua tingkap (latih 2012\u20132019 dan tahan 2020\u20132025). Gate 2: BH-FDR q \u2264 0.05 dengan m dipradaftar dan ralat piawai berkelompok ikut hari beli. Gate 3: ujian ekor \u2014 jangkaan selepas buang 5% teratas melebihi asas.',e:'Pradaftar A: 280 ujian, gate 1 52, gate 2 7, gate 3 0 \u2014 ruang masuk ditutup.'},
  gred_ringkas:{t:'Gred keseluruhan',d:'Gred keseluruhan pada hari isyarat, A terbaik hingga E terlemah (purata gred Industri, Pemangkin dan QR). Pecahan setiap gred (industri, laporan suku, pemangkin, RS, sektor) dalam Lajur penuh, atau ketik baris.',e:''},
  jejak_slot:{t:'Jejak 10 slot',d:'Rekod enam portfolio maya 10 slot (10% ekuiti setiap slot, satu posisi setiap saham, keluar lorong 2 Chandelier) yang dibina semula setiap malam daripada Lejar Penuh (standard/portfolio_slot.py): RS_10 (RS pasaran tertinggi), RAWAK_10 (kawalan rawak), GABUNGAN_10 / TOP1_10 / RAWAK_KAEDAH_10 (gabungan kaedah beku lawan #1 sahaja lawan kaedah rawak, sejak 22 Okt 2026) dan RISIKO_10 (susunan sama RS_10, saiz berskala risiko). Rekod sahaja — bukan pangkat, bukan keputusan; kad skor kekal satu-satunya keputusan. Lorong dalam jalur tidak dapat dibezakan daripada pemilihan rawak; baca persentil, bukan pulangan. MDD RISIKO_10 mesti dibaca bersama pendedahan.',e:'RS_10 persentil 0 = di bawah kesemua 20 cabutan rawak setakat ini; bermakna hanya jika kekal apabila tingkap memanjang (~126 sesi).'},
  persentil_jalur:{t:'Persentil dalam jalur rawak',d:'Peratus daripada 20 cabutan RAWAK_10 (benih berbeza, pembinaan sama; portfolio_slot/rawak_jalur_ekuiti.csv) yang pulangannya di bawah lorong itu atas tingkap lorong yang sama (cara standard/banding_spus.py). 0 = di bawah semua cabutan, 100 = di atas semua, antaranya = dalam jalur = tidak dapat dibezakan daripada rawak (hingar pemilihan pada 10 slot besar: SD ~4 mata setahun, REVERSE/KEPEKATAN_BENIH.md). Hanya lorong di luar jalur yang KEKAL di luar apabila jalur memanjang bermakna apa-apa.',e:'Persentil 30 = lorong mengatasi 6 daripada 20 cabutan rawak: dalam jalur.'},
  spus_tingkap:{t:'SPUS tingkap sama',d:'Pulangan SPUS (ETF S&P 500 patuh Syariah, penanda aras sah repo ini) atas tingkap lorong itu sendiri: asas BUKA sesi mula lorong hingga TUTUP sesi terakhir, kerana lorong beli pada buka sesi pertama (laporan/BANDING_SPUS.md). Setiap lorong dibanding atas tingkapnya sendiri: lorong beku bermula 22 Okt, bukan 16 Okt, jadi satu angka SPUS tidak sah untuk semua. "tiada liputan" = spus_harian.csv belum meliputi sesi itu.',e:'RS_10 −24% lawan SPUS −6% atas tingkap sama = −18 mata; tetapi bacaan yang betul ialah persentil jalur.'},
  kepekatan:{t:'Kepekatan (industri & sektor)',d:'Bilangan saham UNIK yang dipegang (lorong kaedah, mengikut akaun dan tapisan semasa) dalam setiap industri dan sektor — saham, bukan posisi, kerana beberapa kaedah boleh membeli saham yang sama. Merah = lebih 1 saham dalam industri yang sama (had 1 saham setiap industri, REVERSE/KEPUTUSAN_AKHIR.md dapatan 3) atau satu sektor melebihi 30% saham dipegang. Had 1 saham setiap industri memberi MDD lebih cetek 1.1–1.6 mata pada kos pulangan sifar (luar sampel, BH-FDR). Sektor tidak meramal saham; ia risiko kepekatan. Maklumat, bukan isyarat jual dan bukan peraturan Papertrade C.',e:'Semiconductors 3 (merah) = tiga saham berbeza dalam industri sama.'},
  kuarantin_data:{t:'Kuarantin data',d:'Ticker yang bar harganya didapati tercemar atau tidak sah (data/harga/kuarantin.csv, standard/kuarantin.py; sejak 7 Nov 2026). Anomali tidak boleh menimpa bar: ticker dikuarantin, isyarat dan posisinya ditopeng dalam kiraan, dan dilepas hanya selepas semakan manusia (kuarantin.py lepas). Baris ini membaca medan harian/status.kuarantin; "menunggu tolakan db" = db belum ditolak oleh jana_db versi baharu.',e:'SUPN (sejak 21 Okt 2026): bar SUPN = bar INDV × 0.7759 — data INDV disajikan di bawah simbol SUPN.'},
  keputusan_terbuka:{t:'Keputusan terbuka (KOORDINATOR)',d:'Perkara yang menunggu keputusan pengguna dalam koordinator/keputusan.csv (status terbuka), seperti yang dipapar KOORDINATOR.md (standard/koordinator.py). Ini senarai perkara untuk diputuskan, BUKAN keputusan kad skor dan bukan isyarat; kad skor (tab Pilih kaedah) kekal satu-satunya jawapan "kaedah mana". Ditutup dengan menyunting keputusan.csv secara manual.',e:'"Pilih berat T4 (SPUS 80/20, 70/30 atau 50/50)" dibuka 6 Nov 2026.'}
};
const TIPLBL={'kaedah / varian':'kaedah','keputusan':'keputusan','skor':'skor','jumlah untung':'jumlah','cagr':'cagr','kadar menang':'win','jumlah entry':'n','untung/dagangan':'avg','purata menang':'avgwin','purata untung':'avgwin','purata kalah':'avgloss','purata rugi':'avgloss','menang:kalah':'nisbah','hari pegang':'days','purata hari pegang':'days','untung/hari':'harian','mdd':'mdd','mar':'mar','tutup ≥ +10%':'ret10','sentuh +10%':'hit10','bulan ≥ +10%':'bulan10','bulan untung':'bulan_untung','faktor untung':'pf','dagangan setahun':'dagangan_setahun','separuh 1 (2019–22)':'h1','separuh 2 (2023–)':'h2','tahun atasi spy':'thn_kalah_spy','dagangan terburuk':'terburuk','atasi beli semua':'menang_ew','profil pegangan':'pegang','set saham':'set'};
const tipEl=document.createElement('div');tipEl.className='tip';tipEl.hidden=true;tipEl.setAttribute('role','tooltip');document.body.appendChild(tipEl);
function applyTips(root){if(!root)return;
  root.querySelectorAll('[data-tip]').forEach(el=>el.classList.add('has-tip'));
  root.querySelectorAll('.m .k, h2').forEach(el=>{if(el.dataset.tip)return;const k=TIPLBL[(el.textContent||'').trim().toLowerCase()];if(k&&TIPS[k]){el.dataset.tip=k;el.classList.add('has-tip');}});}
/* hover glosari hanya bawa ~2 ayat pertama; teks penuh kekal dalam panel Panduan & glosari (butang ?) */
function tipPotong(d,n=260){if(!d||d.length<=n)return [d,false];
  const c=d.slice(0,n),p=Math.max(c.lastIndexOf('. '),c.lastIndexOf('; '),c.lastIndexOf('! '));
  return [p>110?c.slice(0,p+1):c.slice(0,Math.max(0,c.lastIndexOf(' ')))+'…',true];}
function showTip(el){const k=el.dataset.tip||'';let C='';
  if(k.slice(0,6)==='stage:'){C=stKad(k.slice(6));if(!C)return;}  /* kad kitaran Stage (v105) */
  else if(k.slice(0,6)==='trend:'){C=trKad(k.slice(6));if(!C)return;}  /* kad tangga Trend (v105) */
  else if(k==='rejim_kini'&&S.ks&&S.ks.rejim){C=rejimTip();if(!C)return;}  /* rejim semasa daripada kad skor (v160) */
  else{const T=TIPS[k];if(!T)return;const [d,lagi]=tipPotong(T.d);
    C=`<div class="tip-h">${esc(T.t)}</div><div class="tip-b">${esc(d)}</div>${T.e?`<div class="tip-e"><b>Contoh:</b> ${esc(T.e)}</div>`:''}${lagi?`<div class="tip-e">Selanjutnya dalam Panduan & glosari (butang ?).</div>`:T.e?'':'<div style="height:6px"></div>'}`;}
  tipEl.innerHTML=C;
  tipEl.hidden=false;const r=el.getBoundingClientRect(),W=tipEl.offsetWidth,H=tipEl.offsetHeight,vw=document.documentElement.clientWidth,vh=window.innerHeight;
  let x=Math.min(Math.max(8,r.left+r.width/2-W/2),vw-W-8),y=r.bottom+8;if(y+H>vh-8)y=Math.max(8,r.top-H-8);
  tipEl.style.left=x+'px';tipEl.style.top=y+'px';}
function hideTip(){tipEl.hidden=true;}
let tipTimer=null,tipSuppress=false;
document.addEventListener('mouseover',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el)showTip(el);});
document.addEventListener('mouseout',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el&&!el.contains(e.relatedTarget))hideTip();});
document.addEventListener('focusin',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el)showTip(el);});
document.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')return;const el=e.target.closest&&e.target.closest('[data-tip]');hideTip();if(!el)return;tipTimer=setTimeout(()=>{tipSuppress=true;showTip(el);},450);},true);
['pointerup','pointercancel','pointermove'].forEach(ev=>document.addEventListener(ev,e=>{if(ev==='pointermove'&&e.pointerType==='touch'&&tipTimer&&(Math.abs(e.movementX)+Math.abs(e.movementY))<3)return;clearTimeout(tipTimer);tipTimer=null;},true));
document.addEventListener('click',e=>{if(tipSuppress){tipSuppress=false;e.preventDefault();e.stopPropagation();}},true);
window.addEventListener('scroll',hideTip,{passive:true});
$('#setLbl').dataset.tip='set';$('#setLbl').classList.add('has-tip');

let foldState={};try{foldState=JSON.parse(localStorage.getItem('pbs2_fold')||'{}');}catch(e){}
/* panel yang belum cukup data dilipat secara lalai; tajuknya kekal memapar kesimpulan satu baris */
const LIPAT_LALAI=['rujukan & cara skor dikira','banding dua lorong keluar','prestasi ikut gred','isyarat tidak dibeli','isyarat lengkap dalam watchlist'];
const foldKey=p=>{const h=p.querySelector(':scope>.panel-h h2');return (viewId()+'|'+(h?h.textContent:'')).toLowerCase();};
function saveFold(){try{localStorage.setItem('pbs2_fold',JSON.stringify(foldState));}catch(e){}}
function applyFold(root){root.querySelectorAll('.panel').forEach(p=>{const h=p.querySelector(':scope>.panel-h');if(!h||p.closest('.sheet'))return;
  h.classList.add('foldable');const sas=h.querySelector('button,a,input,select')?h.querySelector('h2'):h;if(!sas)return;if(sas!==h)sas.classList.add('fold-t');
  sas.setAttribute('role','button');sas.setAttribute('tabindex','0');const k=foldKey(p);const shut=k in foldState?!!foldState[k]:LIPAT_LALAI.some(t=>k.endsWith('|'+t));p.classList.toggle('lipat',shut);sas.setAttribute('aria-expanded',String(!shut));});}
function toggleFold(p){const k=foldKey(p);const shut=!p.classList.contains('lipat');foldState[k]=shut;saveFold();p.classList.toggle('lipat',shut);{const h=p.querySelector(':scope>.panel-h'),t=h.querySelector('.fold-t')||h;t.setAttribute('aria-expanded',String(!shut));}if(!shut)requestAnimationFrame(()=>topScrolls(p));}
document.addEventListener('click',e=>{const h=e.target.closest&&e.target.closest('.panel-h.foldable');if(!h||h.closest('.view.pnav'))return;if(e.target.closest('button,a,input,select'))return;toggleFold(h.parentElement);});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&(e.target.classList.contains('foldable')||e.target.classList.contains('fold-t'))&&!e.target.closest('.view.pnav')){e.preventDefault();toggleFold(e.target.closest('.panel'));}});
function foldAllNow(shut){const v=document.getElementById(viewId());v.querySelectorAll('.panel').forEach(p=>{if(!p.querySelector(':scope>.panel-h'))return;foldState[foldKey(p)]=shut;p.classList.toggle('lipat',shut);});saveFold();if(!shut)requestAnimationFrame(()=>topScrolls(v));}
$('#foldAll').onclick=()=>foldAllNow(true);$('#openAll').onclick=()=>foldAllNow(false);

          S[keyName+'Diag']=`asas ${b.id} · ${ada}/${b.n} bahagian`+(hil.length?' · belum: '+hil.slice(0,6).join(', ')+(hil.length>6?` dan ${hil.length-6} lagi`:''):'');
          if(ada<b.n){S[keyName+'Tunggu']={ada,perlu:b.n};re(...tabs);return;}
          for(let i=2;i<=b.n;i++)rows=rows.concat(ch[i].rows||[]);}
        d=Object.assign({},asas,{rows});}
      /* `Siap` juga, bukan hanya data (3 Nov 2026). ptSiap() membaca S.ptmSiap/S.ptcSiap untuk
         membezakan "belum dimuat" daripada "tiada posisi", dan `sub` menetapkannya. Apabila
         pembaca sandaran moomoo ditukar daripada sub kepada subBhg tanpa ini, tab Moomoo akan
         tersekat pada "Memuatkan…" SELAMANYA - kegagalan senyap, jenis yang paling sukar
         dikesan kerana halaman nampak sedang bekerja. Ditetapkan hanya apabila gabung() benar-
         benar menerbit, jadi keadaan separa tidak pernah dilapor sebagai siap. */
      S[keyName+'Tunggu']=null;lepasAnak();if(!asas)S[keyName+'Diag']='dokumen asas tidak sampai';
      S[keyName]=d;S[keyName+'Siap']=true;S.live=true;re(...tabs);};
    langgan(path,s=>{asas=s.exists?s.data():null;const b=asas&&asas.bahagian,n=b?b.n:1;
      if(b&&idLama!==null&&idLama!==b.id){lepasAnak();dah.clear();for(const k in ch)delete ch[k];}
      if(b)idLama=b.id;
      for(let i=2;i<=n;i++){if(dah.has(i))continue;dah.add(i);
        tok[i]=langgan(path+'_'+i,t=>{ch[i]=t.exists?t.data():null;gabung();},
          e=>{ch[i]=null;dbErr(path+'_'+i,e);gabung();});}
      gabung();},e=>dbErr(path,e));};
  /* Langganan ringkas_m/ringkas_c diletak SELEPAS takrifan subBhg (3 Nov 2026): sandaran
     moomoo kini memanggil subBhg, dan `const` mempunyai zon mati temporal - memanggilnya
     sebelum pernyataan takrifan dilaksanakan membuang ReferenceError. Callback sandaran
     berjalan secara async jadi ia MUNGKIN selamat, tetapi "mungkin" bukan asas yang
     munasabah untuk laluan yang hanya dipakai apabila dokumen padat tiada - iaitu tepat
     keadaan tidak normal yang sandaran itu wujud untuk menanganinya. */
  /* `papertrade/moomoo` pada 93.1% had dokumen db dan naik ~0.5 mata sehari: ia melanggar
     dalam ~12 hari, dan apabila itu berlaku jana_db.py SystemExit dan tolakan db MALAM berhenti
     sepenuhnya - walaupun halaman ini jarang membacanya (laluan utama ialah bentuk padat
     `ringkas_m`; ini sandaran). subBhg serasi ke belakang - laluan n=1 membaca dokumen yang
     BELUM dipecah seperti biasa - jadi baris ini selamat diterbitkan SEBELUM jana_db mula
     memecahnya, dan ia MESTI diterbitkan dahulu. Terbalik urutannya, halaman kehilangan baris
     secara senyap. */
  subRingkas('ringkas_m','ptm',()=>{subBhg('papertrade/moomoo','ptm',['ptm','prestasi']);sub('papertrade/moomoo_peta','ptmPeta',['ptm','prestasi']);});
  subRingkas('ringkas_c','ptc',()=>{
    sub('papertrade/claude','ptc',['ptc','prestasi']);
    /* papertrade/claude_2, _3, … tanpa had: dokumen yang wujud membuka langganan dua nombor seterusnya */
    const ptcDah=new Set();
    const subPtc=n=>{if(ptcDah.has(n))return;ptcDah.add(n);
      langgan('papertrade/claude_'+n,s=>{S.ptcN[n]=s.exists?s.data():null;S.live=true;if(s.exists){subPtc(n+1);subPtc(n+2);}re('ptc','prestasi');},e=>dbErr('papertrade/claude_'+n,e));};
    subPtc(2);subPtc(3);});
  subBhg('papertrade/watchlist','watch',['watch']);
  sub('institusi/kumpulan','inst',['sektor']);
  /* v156: senarai beli sebenar (henti, buka_maks, sasaran) untuk tab Hari ini */
  subBhg('papertrade/senarai_beli','sb',['utama']);
  langgan('harian/status',s=>{S.hst=s.exists?s.data():null;renderData();},e=>dbErr('harian/status',e));
  subBhg('prestasi/mae','mae',['prestasi']);subBhg('prestasi/mae_atr','maeAtr',['prestasi','ptc']);
  subBhg('prestasi/garis','garis',['utama','ptc','prestasi','watch']);subBhg('prestasi/mfe','mfe',['prestasi']);subBhg('prestasi/harian_kaedah','hk',['utama','prestasi','analisis']);subBhg('posisi/lorong2','l2s',['ptc']);subBhg('posisi/jalur','jlr',['ptc']);subBhg('harian/trend','trend',['ptc','watch']);subBhg('harian/stage','stage',['ptc','watch']);
  sub('prestasi/portfolio_slot','pslot',['utama','prestasi']);
  /* 274,573 bait pada 228 kaedah = 12,429 MELEBIHI had dokumen db 262,144, jadi dokumen
     ini mesti dipecah. subBhg serasi ke belakang (laluan n=1 membaca dokumen yang belum
     dipecah seperti biasa), jadi baris ini selamat diterbitkan SEBELUM jana_db.py mula
     memecahnya — dan ia MESTI diterbitkan dahulu, bukan selepas. */
  subBhg('analisis/papan','anl',['analisis']);
  sub('analisis/lift','lift',['analisis']);
  /* v158: siri untung semua posisi lawan SPUS (Hari ini) dan siri lorong T4 setiap kaedah (Pilih kaedah) */
  sub('prestasi/untung_siri','us',['utama']);sub('analisis/t4_siri','t4s',['analisis']);
  /* v155: kad skor keputusan (standard/kad_skor.py) - tab Pilih kaedah + tajuk tab Hari ini */
  sub('analisis/kad_skor','ks',['analisis','utama','kaedah']);
  /* v167: Skor Kaedah 0–100 (standard/skor_kaedah.py) — panel di Pilih kaedah + jubin helaian kaedah; maklumat, bukan keputusan */
  sub('analisis/skor_kaedah','skk',['analisis','kaedah']);
  sub('kaedah/katalog','kat',['kaedah']);
  /* (2 Nov 2026) 232,704 bait pada 489 baris ujian = 88.8% had 262,144, dan ia tumbuh setiap kali
     satu pradaftar ditambah (lonjakan terakhir: +67 baris daripada P94 + CARAK).
     subBhg serasi ke belakang (laluan n=1 membaca dokumen yang belum dipecah seperti
     biasa), jadi baris ini diterbitkan SEBELUM jana_db.py mula memecahnya — urutan
     itu WAJIB, dan sebab `analisis/papan` hampir hilang baris secara senyap. */
  /* v155: registry backtest (~2 MB), meta/info, autotune dan kaedah_n/papan dimuat ATAS PERMINTAAN - hanya apabila
     tab yang memerlukannya dibuka (PERLU_RUJ) atau helaian kaedah dibuka. Hari ini dan Pilih kaedah tidak memerlukannya,
     jadi semakan pagi di telefon tidak memuat turun 2 MB (audit v154 pepijat #18). */
  S.muatRujukan=()=>{if(S.rujMuat)return;S.rujMuat=true;
  db.collection('registry').limit(1000).onSnapshot(snap=>{
    const d={};snap.docs.forEach(x=>{if(!x.exists)return;const v=x.data();d[x.id]=Object.assign({},v,{rows:(v.rows||[]).map(r=>Object.assign({},r,{jumlah:jumlahDari(r.cagr),nisbah:(r.avgwin!=null&&r.avgloss<0)?r.avgwin/-r.avgloss:null,harian:(r.avg!=null&&r.days>0)?r.avg/r.days:null}))});});S.docs=d;
    const ts=Object.values(d).map(x=>x.tarikh||'').sort().pop()||'';S.live=true;
    setLive(true,`Langsung · ujian terkini ${ts}`);re('backtest');
  },()=>setLive(false,'Sambungan terputus. Muat semula halaman.'));
  langgan('meta/info',s=>{S.meta=s.exists?s.data():null;re('backtest');},e=>dbErr('meta/info',e));
  subBhg('kaedah_n/papan','kn',['kaedahn']);
  /* v161: ringkasan setiap kaedah (sebab keluar, taburan, contoh lilin) untuk helaian kaedah; ~580 KB dipecah, jadi atas permintaan */
  subBhg('analisis/kaedah_siri','ksr',[]);
  db.collection('autotune').limit(1000).onSnapshot(snap=>{const d={};snap.docs.forEach(x=>{if(x.exists)d[x.id]=x.data();});S.at=d;S.live=true;re('autotune','backtest');},()=>{});
  };
  if(PERLU_RUJ.has(S.tab))S.muatRujukan();
  /* AUTOTUNE: semua dokumen koleksi autotune (status, ringkasan, gabungan, kaedah_<ID>) */
})();
})();
</script>
