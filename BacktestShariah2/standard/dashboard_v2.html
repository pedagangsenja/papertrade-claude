<style>
/* Susun atur: konsol terminal satu lajur; pengepala melekit (tab utama + sub-tab), paparan bertab, helaian bawah untuk butiran.
   Gaya SST Terminal: navy gelap sahaja (pilihan sengaja, satu tema). */
:root{
  color-scheme:dark;
  --bg:#0b1220; --surface:#0f172a; --card:#111a2e; --sunk:#0c1526; --line:#1f2a40; --line-2:#2a3852;
  --fg:#e2e8f0; --fg-2:#cbd5e1; --muted:#8a9ab3;
  --accent:#2dd4bf; --accent-soft:rgba(45,212,191,.12); --violet:#8b5cf6; --violet-soft:rgba(139,92,246,.16);
  --pos:#22c55e; --pos-soft:rgba(34,197,94,.14); --neg:#ef4444; --neg-soft:rgba(239,68,68,.13); --neg-tx:#f87171; --warn:#f59e0b; --warn-soft:rgba(245,158,11,.14);
  --guna:#22c55e; --guna-bg:rgba(34,197,94,.15); --uji:#f59e0b; --uji-bg:rgba(245,158,11,.15); --simpan:#60a5fa; --simpan-bg:rgba(96,165,250,.15); --tolak:#ef4444; --tolak-bg:rgba(239,68,68,.14);
  --ref:#eab308;
  /* sebab keluar: slot kategori 1–4 (disahkan validator dataviz pada permukaan kad) */
  --k1:#3987e5; --k2:#d95926; --k3:#199e70; --k4:#c98500;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:8px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:16px}
body{margin:0;background:radial-gradient(1200px 500px at 80% -10%,rgba(45,212,191,.06),transparent 60%),var(--bg);background-color:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:'cv11','ss01'}
div.wrap{max-width:none;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
/* jalur di atas pengepala melekit (kawasan selamat telefon) */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.num{font-variant-numeric:tabular-nums lining-nums}
a{color:var(--accent)}
button{font-family:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,tr:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* pengepala */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));padding:12px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mk{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--violet));flex:none}
h1{font-size:1.2rem;font-weight:800;letter-spacing:-.01em;margin:0;text-wrap:balance}
.live{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted)}
.live{flex-wrap:wrap;row-gap:2px}
.gr{display:inline-block;min-width:1.45em;text-align:center;border-radius:4px;font-weight:700;font-size:.7rem;line-height:1.5;padding:0 3px;margin:0 2px 2px 0}
.gr small{font-weight:500;opacity:.75;margin-right:1px}
.nw{white-space:nowrap}
/* jadual bergred: angka dan perkataan tidak dipecah; tiada skrol mendatar (lajur kurang penting disembunyi oleh muatLajur) */
.tablewrap.tw-grd{overflow-x:visible}.tablewrap.tw-grd td,.tablewrap.tw-grd th{overflow-wrap:break-word;padding-inline:4px}
/* Syarat belum cukup (watchlist penuh, .syr) 250px. Pemangkin (.grp) dan Kewangan (.grk) sama lebar 230px di desktop:
   teks pemangkin maksimum 3 baris, pautan berita 1 baris (teks penuh dalam title) */
td.grd{min-width:0}.tablewrap.tw-grd td.wrap{min-width:150px}.tablewrap.tw-grd td.syr{min-width:250px}td.grd .vv{font-size:.72rem}.tablewrap td .nw{white-space:nowrap}
@media (min-width:761px){.tablewrap.tw-grd td.grp,.tablewrap.tw-grd td.grk{width:230px;min-width:230px;max-width:230px}}
td.grp .grc,td.grk .grc{display:flex;width:100%}td.grp .grt,td.grk .grt{flex:1 1 auto}
td.grp .pmt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}td.grp a.berita{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grc{display:inline-flex;gap:8px;align-items:center;text-align:left;vertical-align:middle}
.grc>.gr{flex:none;display:flex;align-items:center;justify-content:center;min-width:2em;height:2.1em;margin:0;padding:0 6px;font-size:1.05rem;border-radius:6px}
.lrk{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px}.lrb{flex:none;display:flex;align-items:center;justify-content:center;height:1.8em;padding:0 7px;border-radius:6px;font-weight:700;font-size:.72rem;letter-spacing:.02em}.lrp{font-size:1.05rem;line-height:1.2;white-space:nowrap}.lrk b.lrp.pos{color:var(--pos)}.lrk b.lrp.neg{color:var(--neg)}.lrk b.lrp.mut{color:var(--muted)}
.grt{min-width:0;display:flex;flex-direction:column;justify-content:center}.grt b{color:var(--fg)}.grt .pill{align-self:flex-start}
/* sub-gred kewangan: label K U T S di atas cip */
.kskor{display:flex;gap:4px;align-self:flex-start;margin-bottom:3px}.kskor>span{display:flex;flex-direction:column;align-items:center;gap:1px}.kskor small{font-size:.6rem;line-height:1.1;font-weight:600;color:var(--muted)}.kskor .gr{margin:0}
td.grd{text-align:center;vertical-align:middle}
@media (min-width:761px){td.kdh{width:1%;max-width:76px;white-space:normal}td.kdh .vv{white-space:normal;overflow-wrap:normal}}
td.ctr,th[data-tip="hari_watch"],th[data-tip="hari_pt"]{text-align:center}
.tablewrap.tw-grd td{vertical-align:middle}
.tablewrap.tw-grd th[data-tip^="g_"],.tablewrap.tw-grd th[data-tip="gred"]{text-align:center}
td.grd .vv.nm1{white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;max-width:110px;overflow-wrap:normal}
a.berita{color:var(--accent);text-decoration:none;margin-top:2px}a.berita:hover{text-decoration:underline}
.g-A{background:var(--pos-soft);color:var(--pos)}.g-B{background:var(--accent-soft);color:var(--accent)}.g-C{background:var(--sunk);color:var(--fg-2);box-shadow:inset 0 0 0 1px var(--line)}.g-D{background:var(--warn-soft);color:var(--warn)}.g-E{background:var(--neg-soft);color:var(--neg-tx)}.g-x{background:var(--sunk);color:var(--muted)}
/* kemas kini terakhir (atas kanan) */
.titlerow{flex-wrap:nowrap;align-items:flex-start}
.brand{flex:1 1 auto;padding-top:2px}
.kanan{display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right;flex:none;max-width:62%}
.kini{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25;cursor:help}
.kini .kl{font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kini b{font-size:.92rem;font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums;white-space:nowrap}
.kini b.neg{color:var(--neg)}
.kini .kd{font-size:.74rem;color:var(--muted)}
.kanan .live{justify-content:flex-end}
@media (max-width:520px){h1{font-size:1.02rem}#liveTxt{display:none}.kini b{font-size:.84rem}}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--pos);box-shadow:0 0 0 3px var(--pos-soft)}
nav.tabs{display:flex;gap:2px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;color:var(--muted);font-weight:600;font-size:.92rem;padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{color:var(--fg-2)}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);background:linear-gradient(0deg,var(--accent-soft),transparent 70%)}
.subbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0}
.subbar[hidden]{display:none}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:500;font-size:.85rem;padding:6px 11px;border-radius:6px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--card);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.lbl{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.spacer{flex:1}
.fold-btn{border:1px solid var(--line);background:var(--card);color:var(--fg-2);font-size:.82rem;padding:6px 10px;border-radius:6px;cursor:pointer}
.fold-btn:hover{border-color:var(--line-2)}

/* paparan */
section.view{padding-top:18px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
h2{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2);margin:0;text-wrap:balance;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:3px;height:12px;border-radius:2px;background:linear-gradient(var(--accent),var(--violet));flex:none}
h3{font-size:1rem;margin:0}
.sub{color:var(--muted);font-size:.86rem;margin:2px 0 0;max-width:80ch}
.headline{font-size:1rem;line-height:1.55;margin:0;max-width:120ch;color:var(--fg-2)}
.headline b{color:var(--fg)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:-14px -14px 12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.panel-h .sub{margin:0}
.panel-h.foldable{cursor:pointer;user-select:none}
.panel-h.foldable::after{content:"▾";color:var(--muted);font-size:.9rem;margin-left:4px}
.panel.lipat>:not(.panel-h){display:none!important}
.panel.lipat>.panel-h{margin-bottom:-14px;border-bottom:0}
.panel.lipat>.panel-h::after{content:"▸"}
/* tab sisi panel (v93, 21 Okt 2026): tab dengan >= 3 panel = rel kiri (telefon: jalur cip melekit); satu bahagian dipapar */
section.view.pnav .grid2,section.view.pnav .grid2.eq{grid-template-columns:minmax(0,1fr)}
section.view.pnav .pn-x{display:none!important}section.view.pnav .pn-j{display:block!important}section.view.pnav .pn-j>*+*{margin-top:16px}
section.view.pnav .panel.pn-a>.panel-h{cursor:default}section.view.pnav .panel-h.foldable::after{display:none}
.pnav-in{display:flex;flex-direction:column;gap:2px}
.pnav-in button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid transparent;background:none;color:var(--fg-2);font-size:.84rem;line-height:1.3;padding:8px 10px;border-radius:7px;cursor:pointer}
.pnav-in button:hover{background:var(--card);color:var(--fg)}
.pnav-in button[aria-current="true"]{background:var(--card);border-color:var(--line-2);color:var(--fg);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.pnav-in button.pn-dg{color:var(--neg-tx,#f87171)}
.pnav-in .pill{font-size:.66rem;padding:1px 6px;margin-left:auto;flex:none}
.pnav-in .pn-n{margin-left:auto;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pnav-in hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.pnav-in .pn-k{font-size:.66rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
@media (min-width:761px){
  section.view.pnav{padding-left:232px;position:relative}
  .pnav-rail{position:absolute;left:0;top:18px;bottom:0;width:216px}
  .pnav-in{position:sticky;top:calc(var(--hdr,0px) + 12px);max-height:calc(100vh - var(--hdr,0px) - 24px);overflow-y:auto;padding:2px 4px 2px 0;scrollbar-width:thin}
}
@media (max-width:760px){
  .pnav-rail{position:sticky;top:var(--hdr,0px);z-index:6;margin:-6px calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .pnav-in{flex-direction:row;overflow-x:auto;gap:6px;padding:8px 16px;scrollbar-width:none}.pnav-in::-webkit-scrollbar{display:none}
  .pnav-in button{width:auto;flex:none;white-space:nowrap;border-color:var(--line);padding:6px 11px;border-radius:999px;font-size:.8rem}
  .pnav-in button[aria-current="true"]{box-shadow:none;border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--card))}
  .pnav-in .pn-n,.pnav-in hr,.pnav-in .pn-k{display:none}
}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.kpi{background:linear-gradient(180deg,rgba(255,255,255,.02),transparent),var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0;display:grid;gap:3px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,var(--accent),var(--violet));opacity:.55}
.kpis6{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.kpi .lbl{font-size:.72rem}
.kpi .v{font-size:1.7rem;font-weight:700;line-height:1.15;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:.8rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.pill{display:inline-block;font-weight:600;font-size:.72rem;letter-spacing:.03em;padding:2px 8px;border-radius:999px;white-space:nowrap;vertical-align:1px}
.k-GUNA{background:var(--guna-bg);color:var(--guna)} .k-UJI{background:var(--uji-bg);color:var(--uji)}
.k-SIMPAN{background:var(--simpan-bg);color:var(--simpan)} .k-DITOLAK{background:var(--tolak-bg);color:var(--neg-tx)}
.p-buy{background:var(--pos-soft);color:var(--pos)} .p-hold{background:var(--simpan-bg);color:var(--simpan)} .p-exit{background:var(--neg-soft);color:var(--neg-tx)} .p-near{background:var(--violet-soft);color:#c4b5fd} .p-mute{background:var(--sunk);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.pos{color:var(--pos)} .neg{color:var(--neg-tx)} .mut{color:var(--muted)}
svg text{fill:var(--muted);font-family:var(--f-body);font-size:12px}
svg .grid line{stroke:var(--line)}

.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);color:var(--fg-2);font-size:.84rem;font-weight:500;padding:5px 11px;border-radius:999px;cursor:pointer}
.chip:hover{border-color:var(--line-2)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
input[type=search],select{font:inherit;font-size:.9rem;color:var(--fg);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
input[type=search]{flex:1 1 200px}
select{max-width:100%}

/* jadual boleh-susun (dikongsi semua tab) */
.topscroll{overflow-x:auto;overflow-y:hidden;height:12px;margin-bottom:4px;border-radius:6px;background:var(--sunk)}
.topscroll>div{height:1px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);min-width:0}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:6px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:.68rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--sunk);position:sticky;top:0;user-select:none}
th[data-k]{cursor:pointer}
th[data-k]:hover{color:var(--fg-2)}
th.l,td.l{text-align:left}
td{font-variant-numeric:tabular-nums lining-nums;color:var(--fg-2)}
th[data-k] span::after{content:" ↕";opacity:.3}
th[aria-sort="descending"] span::after{content:" ↓";opacity:1;color:var(--accent)}
th[aria-sort="ascending"] span::after{content:" ↑";opacity:1;color:var(--accent)}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--surface) 92%,#fff 1.5%)}

tbody tr.exit td{background:var(--neg-soft);color:#fecaca}

tbody tr.exit:nth-child(even) td{background:var(--neg-soft)}

td.name{text-align:left;white-space:normal;min-width:200px;max-width:320px}
td.name b{font-weight:700;color:var(--fg);margin-right:6px}
td .vv{display:block;color:var(--muted);font-size:.76rem;line-height:1.3;white-space:nowrap}
td.name .vv,td.wrap .vv{white-space:normal}
td.wrap{white-space:normal;min-width:220px;max-width:380px;text-align:left}
td.wrap.lrg{min-width:150px;max-width:210px}
td.tk b{color:var(--fg);font-weight:700}
.frz{position:sticky;left:0;z-index:2;background:var(--surface);box-shadow:1px 0 0 var(--line)}
th.frz{z-index:3;background:var(--sunk)}
.rkn{display:inline-block;min-width:1.7em;color:var(--muted);font-size:.78rem}
.dots{display:inline-flex;gap:3px;vertical-align:middle}.dots i{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--line-2)}.dots i.y{background:var(--pos)}.dots i.n{background:var(--neg)}
.pg{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:.78rem;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pg-GUNA{background:rgba(234,179,8,.16);color:#facc15}.pg-UJI{background:rgba(203,213,225,.13);color:#e2e8f0}.pg-SIMPAN{background:rgba(217,119,6,.16);color:#f59e0b}.pg-x{background:var(--neg-soft);color:var(--neg-tx)}
.corong{display:grid;gap:6px}.crg-h{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:6px}
.crg{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) 92px;gap:10px;align-items:center;font-size:.88rem;border:0;background:none;color:var(--fg-2);text-align:left;padding:3px 4px;border-radius:6px;cursor:pointer;font-family:inherit}
.crg:hover{background:var(--sunk)}.crg[aria-pressed="true"]{background:var(--accent-soft)}.crg .t{height:12px;background:var(--sunk);border-radius:6px;overflow:hidden}.crg .t i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--violet))}
.crg .nm{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}.crg .nm b{color:var(--fg);font-size:1rem}.crg .nm span{color:var(--neg);font-size:.76rem;margin-left:4px}
.crg.akhir .t i{background:var(--pos)}

/* ================= komponen jadual boleh-susun (dikongsi) =================

const SORT={},ST_R={};
function isNil(x){return x==null||x===''||(typeof x==='number'&&isNaN(x));}
function sortRows(rows,cols,st){const c=cols.find(c=>c.k===st.k);if(!c)return rows;const g=c.v||(r=>r[c.k]);
  return [...rows].sort((a,b)=>{const x=g(a),y=g(b),xn=isNil(x),yn=isNil(y);if(xn&&yn)return 0;if(xn)return 1;if(yn)return -1;
    if(typeof x==='string'||typeof y==='string')return String(x).localeCompare(String(y),undefined,{numeric:true})*st.dir;return (x-y)*st.dir;});}
function sortTable(o){

  const lp=o.lp&&Object.assign({},o.lp);if(lp&&!lp.kad)lp.kad=kadUmum(o.cols);if(lp)o=Object.assign({},o,{cols:[...o.cols,{k:'_ml',t:'',ns:1,l:1,hc:'mline',c:()=>'mline',f:lp.line},{k:'_mk',t:'',ns:1,l:1,hc:'mkad',c:()=>'mkad',f:lp.kad},...(lp.btn?[BTN_PENUH]:[])]});

  return ms+`<div class="tablewrap${grd?' tw-grd':''}${lp?' tw-lp':''}"><table data-st="${o.id}"><thead><tr>${th}</tr></thead><tbody>${tb}</tbody></table>${total?'':`<p class="empty">${o.empty||'Tiada data.'}</p>`}</div>`+(o.foot?o.foot(Math.min(total,rows.length),total):'');

function drawScatter(box,rows,b){
  const W=Math.max(300,box.clientWidth||600),H=Math.round(Math.min(360,W*0.62));
  const P={l:44,r:12,t:12,b:30};const pts=rows.filter(r=>r.cagr!=null&&r.mdd!=null);
  const xmin=Math.min(-0.8,...pts.map(r=>r.mdd)),xmax=0;
  let ymin=Math.min(-0.1,...pts.map(r=>r.cagr)),ymax=Math.max(0.3,...pts.map(r=>r.cagr));
  ymin=Math.floor(ymin*10)/10;ymax=Math.ceil(ymax*10)/10;const x0=Math.floor(xmin*10)/10;
  const X=v=>P.l+(v-x0)/(xmax-x0)*(W-P.l-P.r),Y=v=>P.t+(ymax-v)/(ymax-ymin)*(H-P.t-P.b);
  let g='<g class="grid">';const yt=[],xt=[];
  for(let v=ymin;v<=ymax+1e-9;v+=0.1)yt.push(+v.toFixed(2));for(let v=x0;v<=0.0001;v+=0.1)xt.push(+v.toFixed(2));
  const ys=yt.length>9?yt.filter((_,i)=>i%2===0):yt, xs=xt.length>6?xt.filter((_,i)=>i%2===0):xt;
  ys.forEach(v=>{g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}"/>`});g+='</g>';
  let t='';ys.forEach(v=>t+=`<text x="${P.l-6}" y="${Y(v)+4}" text-anchor="end">${Math.round(v*100)}%</text>`);
  xs.forEach(v=>t+=`<text x="${X(v)}" y="${H-12}" text-anchor="middle">${Math.round(v*100)}%</text>`);
  t+=`<text x="${W-P.r}" y="${H-1}" text-anchor="end">Kejatuhan maksimum (MDD) →</text>`;
  let ref='';
  if(b.ew!=null&&b.ew>=ymin&&b.ew<=ymax)ref+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(b.ew)}" y2="${Y(b.ew)}" stroke="var(--ref)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  ref+=`<line x1="${X(-0.45)}" x2="${X(-0.45)}" y1="${P.t}" y2="${H-P.b}" stroke="var(--tolak)" stroke-width="1" stroke-dasharray="2 3" opacity=".7"/><text x="${X(-0.45)+4}" y="${P.t+10}" style="fill:var(--tolak)">had G4 −45%</text>`;
  ref+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line-2)" stroke-width="1"/>`;
  const sorted=[...pts].sort((a,c)=>(3-(KORD[a.keputusan]??3))-(3-(KORD[c.keputusan]??3)));
  let d='';sorted.forEach(r=>{const strong=r.keputusan!=='DITOLAK';d+=`<circle cx="${X(r.mdd).toFixed(1)}" cy="${Y(r.cagr).toFixed(1)}" r="${strong?4.4:3}" fill="var(${KVAR[r.keputusan]||'--muted'})" fill-opacity="${strong?.95:.3}" stroke="var(--card)" stroke-width="${strong?1:0}" data-dk="${esc(key(r))}" style="cursor:pointer"><title>${esc(r.id+' '+r.varian)} · CAGR ${pct(r.cagr)} · MDD ${pct(r.mdd)}</title></circle>`});
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="Carta serakan CAGR lawan MDD">${g}${ref}${d}${t}<text x="${P.l}" y="${P.t-2}" style="font-size:10px">↑ CAGR</text></svg>`;
}

const SKP={1:['prestasi_1d','1H',3],w:['prestasi_1w','1W',5],m:['prestasi_1m','1M',10],q:['prestasi_3m','3M',20]};
const FASA={Leading:{c:'--pos',bm:'Memimpin'},Improving:{c:'--accent',bm:'Membaik'},Weakening:{c:'--warn',bm:'Melemah'},Lagging:{c:'--neg-tx',bm:'Ketinggalan'}};
const fasaPill=f=>f?`<span class="pill" style="background:color-mix(in srgb,var(${FASA[f].c}) 16%,transparent);color:var(${FASA[f].c})">${f}</span>`:'<span class="mut">–</span>';
function heatCol(v,lim){if(v==null||isNaN(v))return 'var(--sunk)';const t=Math.max(-1,Math.min(1,v/lim));const a=(0.18+0.72*Math.abs(t)).toFixed(2);
  return t>=0?`color-mix(in srgb,#22c55e ${Math.round(a*100)}%,#0f172a)`:`color-mix(in srgb,#ef4444 ${Math.round(a*100)}%,#0f172a)`;}
function squarify(items,x,y,w,h){const out=[];let rest=items.filter(d=>d.v>0).sort((a,b)=>b.v-a.v);const tot=rest.reduce((s,d)=>s+d.v,0);if(!tot)return out;
  const sc=w*h/tot;rest=rest.map(d=>Object.assign({},d,{a:d.v*sc}));
  const worst=(row,len)=>{const s=row.reduce((t,d)=>t+d.a,0),mx=Math.max(...row.map(d=>d.a)),mn=Math.min(...row.map(d=>d.a));return Math.max(len*len*mx/(s*s),(s*s)/(len*len*mn));};
  while(rest.length){const len=Math.min(w,h);let row=[rest[0]],i=1;
    while(i<rest.length&&worst(row.concat(rest[i]),len)<=worst(row,len)){row.push(rest[i]);i++;}
    rest=rest.slice(i);const s=row.reduce((t,d)=>t+d.a,0);

function drawRotasi(box,rows){

/* ================= lajur papertrade diselaraskan (M, C, Prestasi) ================= */
function hariDari(t){if(!t)return null;const d=Date.parse(t+'T00:00:00Z');if(isNaN(d))return null;let n=0;const now=new Date();for(let x=new Date(d);x<now;x.setUTCDate(x.getUTCDate()+1)){const w=x.getUTCDay();if(w&&w<6)n++;}return Math.max(0,n-1);}
function normPT(r){const keluar=!!(r.keluar||r.tarikh_keluar);const kk=r.kaedah_kongsi;return Object.assign({},r,{
  kaedah_kongsi:Array.isArray(kk)?kk:typeof kk==='string'&&kk.trim()?kk.split(/[,;]\s*/).filter(Boolean):null,
  kaedah:r.kaedah||r.id_kaedah||'–',hari:r.tidak_dibeli?null:(r.hari??hariDari(r.tarikh_beli)),keluar,
  isyarat_keluar:r.isyarat_keluar||(keluar?'Keluar':'Pegang'),
  untung_akhir_pct:keluar?(r.untung_akhir_pct??r.untung_pct):null,
  harga_terkini:keluar&&r.harga_keluar!=null?r.harga_keluar:r.harga_terkini,tidak_sah:!!r.tidak_sah,
  keluar_henti:benar(r.keluar_henti),
  /* tutup sepenuhnya hanya apabila kedua-dua lorong keluar; tanpa data lorong 2 (baris lama) ikut lorong kaedah */
  tutup_semua:r.tutup_semua!=null&&r.tutup_semua!==''?benar(r.tutup_semua):(r.status_henti||r.keluar_henti!=null&&r.keluar_henti!=='')?keluar&&benar(r.keluar_henti):keluar,
  untung_henti_pct:nomb(r.untung_henti_pct),harga_keluar_henti:nomb(r.harga_keluar_henti)});}
/* dua lorong keluar (sejak 17 Okt 2026): 1 kaedah, 2 pegang selagi naik (standard/keluar_lorong.py) */
const LORONG={kaedah:['keluar','tarikh_keluar','harga_keluar','untung_akhir_pct','isyarat_keluar'],henti:['keluar_henti','tarikh_keluar_henti','harga_keluar_henti','untung_henti_pct','status_henti']};
/* untung lorong: akhir jika lorong itu sudah keluar, semasa jika masih dipegang */
const hasilL=(r,l)=>r[LORONG[l][0]]?r[LORONG[l][3]]:r.untung_pct;
const BLN=['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis'];
/* hari dagangan (Isn–Jum) dari tarikh beli hingga tarikh keluar */
function hariAntara(a,b){const x=Date.parse((a||'')+'T00:00:00Z'),y=Date.parse((b||'')+'T00:00:00Z');if(isNaN(x)||isNaN(y)||y<x)return null;let n=0;for(let d=new Date(x+864e5);d<=y;d.setUTCDate(d.getUTCDate()+1)){const w=d.getUTCDay();if(w&&w<6)n++;}return n;}

function katPecah(s){const o=[];let d=0,b='';s=String(s||'').trim().replace(/\.$/,'');
  for(let i=0;i<s.length;i++){const c=s[i];if(c==='('||c==='[')d++;else if((c===')'||c===']')&&d)d--;

  o.push(b);return o.map(x=>x.trim()).filter(Boolean).map(x=>x[0].toUpperCase()+x.slice(1));}
/* pil jenis peraturan (warna tema) + butiran kelabu dengan nombor ditebalkan; henti merah, had masa kuning */

    else{const sa=it.some(x=>/sasaran|\b\d+R\b|mencecah|dicapai|\bATH\b/i.test(x)),is=it.some(x=>!/^sasaran/i.test(x)&&!/^jual apabila (harga )?mencecah/i.test(x));

  return [P,r];}

  g.rows.forEach(x=>{by[x.s]=x.c;});(g.spy||[]).forEach(([d,o,c])=>{spy[isoD(d)]={o,c};});return {T,by,spy,sT:Object.keys(spy).sort()};});
const garis=()=>garisM(S.garis);
const tutupPada=(s,t)=>{const G=garis();if(!G)return null;const i=G.T.indexOf(t),c=G.by[s];return i<0||!c?null:c[i];};
const tutupAkhir=s=>{const G=garis(),c=G&&G.by[s];if(!c)return null;for(let i=c.length-1;i>=0;i--)if(c[i]!=null)return c[i];return null;};
const akhirPos=r=>[r.tarikh_keluar,r.tarikh_keluar_henti].filter(Boolean).sort().pop()||'';
function siriPos(r){const G=garis(),c=G&&G.by[r.saham];if(!c||!r.tarikh_beli)return null;const t=[],v=[],z=r.tutup_semua?akhirPos(r):'';
  G.T.forEach((d,i)=>{if(d>=r.tarikh_beli&&c[i]!=null&&(!z||d<z)){t.push(d);v.push(c[i]);}});return v.length?{t,v}:null;}
/* SPY dalam tempoh sama: buka hari beli hingga buka hari keluar (lorong kaedah) atau tutup terakhir */
function spyPos(r){const G=garis();if(!G||!G.sT.length||!r.tarikh_beli)return null;const a=G.spy[r.tarikh_beli];if(!a||!a.o)return null;
  let b;if(r.keluar&&r.tarikh_keluar){const x=G.spy[r.tarikh_keluar];b=x&&x.o;}else b=G.spy[G.sT[G.sT.length-1]].c;return b?(b/a.o-1)*100:null;}
const mfeM=memo(d=>{const m={};(d&&d.rows||[]).forEach(x=>{if(Array.isArray(x))m[x[0]]=x[1];});return m;});
const mfeOf=r=>{const v=mfeM(S.mfe)[`${r.akaun}|${r.saham}|${r.kaedah}|${r.tarikh_beli}`];return v==null?null:v;};

/* lorong 2: kedudukan harga dalam julat paras keluar (0) hingga puncak sejak beli (1); paras = puncak − 4×ATR14, hanya naik */
function l2Info(r){if(r.tidak_dibeli||r.keluar_henti)return null;const s=String(r.status_henti||'');if(!s||/menunggu/.test(s))return null;
  const p=/paras keluar ([\d.]+)/.exec(s),k=/puncak ([\d.]+)/.exec(s);if(!p||!k)return null;const paras=+p[1],puncak=+k[1];
  const h=r.keluar?tutupAkhir(r.saham):nomb(r.harga_terkini);if(!h||!(puncak>paras))return null;return {paras,puncak,h,x:(h-paras)/(puncak-paras)};}
const barL2=r=>{const a=l2Info(r);if(!a)return '';const p=Math.max(0,Math.min(1,a.x));
  return `<span class="l2bar${a.x<0.25?' hmp':''}" title="Harga ${fx(a.h,2)} berada ${fx(a.x*100,0)}% julat di atas paras keluar ${fx(a.paras,2)} (kiri) menuju puncak ${fx(a.puncak,2)} (kanan)"><i style="left:${(p*100).toFixed(1)}%"></i></span>`;};
function statusPos(r){if(r.tidak_dibeli)return null;if(r.tutup_semua)return ['k'];
  const tk=!r.keluar&&/menunggu/.test(String(r.isyarat_keluar||'')),t2=!r.keluar_henti&&/menunggu/.test(String(r.status_henti||''));
  if(tk||t2)return ['m',`Jual pada buka sesi seterusnya: ${[tk?'lorong kaedah':'',t2?'lorong selagi naik':''].filter(Boolean).join(' dan ')}`,tk,t2];
  const a=l2Info(r),jk=r.keluar?null:jarakL(r,'kaedah'),why=[];
  if(a&&a.x<0.25)why.push(`lorong selagi naik ${fx(a.x*100,0)}% julat di atas paras ${fx(a.paras,2)}`);
  if(jk!=null&&jk>-2)why.push(`henti kaedah ${fx(-jk,1)}% di bawah harga`);
  return why.length?['h','Hampir paras keluar: '+why.join('; ')]:['j'];}
const titikPos=r=>{const s=statusPos(r);return s?titikH(s[0],s[1]):'';};
/* earnings dalam hari dagangan dari tarikh data */
const hariKeEarn=r=>{const te=String(r.tarikh_earnings||'').slice(0,10),D=tarikhData();if(!/^\d{4}-\d\d-\d\d$/.test(te)||!D||te<D)return null;return te===D?0:hariAntara(D,te);};
const earnH=r=>{if(r.tutup_semua||r.tidak_dibeli)return '';const h=hariKeEarn(r);return h!=null&&h<=5?`<span class="ern" title="Earnings ${esc(tkO(r.tarikh_earnings))}: ${h} hari dagangan lagi">📅${h}</span>`:'';};
const baruPos=r=>r.akaun==='C'&&r.tarikh_beli&&r.tarikh_beli===belianTerkini(prSrc('c'))?BARU:'';
const baruW=r=>S.watch&&r.ditambah&&String(r.ditambah).slice(0,10)===String(S.watch.tarikh_data||'').slice(0,10)?BARU:'';
const cipKeluar=r=>(r.keluar?cipL('K'):'')+(r.keluar_henti?cipL('2'):'');
const tandaPos=r=>`${titikPos(r)}${baruPos(r)}${earnH(r)}${r.tutup_semua?'':cipKeluar(r)}`;
/* warna latar ikut magnitud (penuh pada ±lim mata) */
const heatBg=(v,lim=10)=>v==null||isNaN(v)||!v?'':`background:color-mix(in srgb,var(${v<0?'--neg':'--pos'}) ${Math.round(6+Math.min(1,Math.abs(v)/lim)*18)}%,transparent)`;
const untungHc=(v,lim)=>`<b class="hc ${cls(v)}" style="${heatBg(v,lim)}">${sg2(v)}</b>`;
const spyCip=r=>{const s=spyPos(r),u=r.keluar?(r.untung_akhir_pct??r.untung_pct):r.untung_pct;if(s==null)return '';const b=u==null?null:u-s;
  return `<span class="vv nw" title="SPY dalam tempoh sama (buka hari beli hingga ${r.keluar?'buka hari keluar':'tutup terakhir'}); beza = untung posisi − SPY">SPY ${sg2(s)}</span>${b==null?'':`<span class="vv nw">beza <span class="${cls(b)}">${sg2(b)}</span></span>`}`;};
/* carta kecil harga sejak beli: garis putus kelabu = harga beli, titik-titik kuning = paras keluar lorong 2 */
function sparkPos(r,W=84,H=24,besar){const s=siriPos(r);if(!s)return '<span class="mut">–</span>';const hb=nomb(r.harga_beli);
  const v=hb?[hb,...s.v]:s.v,a=l2Info(r),pr=a?a.paras:null,all=pr?[...v,pr]:v;
  const lo=Math.min(...all),hi=Math.max(...all),sp=hi-lo||1,n=v.length,pd=besar?6:2,pb=besar?16:2;
  const X=i=>pd+(n<2?(W-2*pd)/2:i/(n-1)*(W-2*pd)),Y=x=>pd+(hi-x)/sp*(H-pd-pb);
  const last=v[n-1],col=hb&&last<hb?'--neg':'--pos';
  const ln=`<polyline points="${v.map((x,i)=>X(i).toFixed(1)+','+Y(x).toFixed(1)).join(' ')}" fill="none" stroke="var(${col})" stroke-width="${besar?2:1.5}" stroke-linejoin="round"/>`;
  const hl=(y,c,da)=>`<line x1="${pd}" x2="${W-pd}" y1="${Y(y).toFixed(1)}" y2="${Y(y).toFixed(1)}" stroke="var(${c})" stroke-dasharray="${da}"/>`;
  const lbl=`${r.saham}: ${s.v.length} harga tutup sejak beli ${tkO(r.tarikh_beli)}; garis putus kelabu = harga beli ${fx(hb,2)}${pr?`; titik-titik kuning = paras keluar lorong 2 ${fx(pr,2)}`:''}`;
  const ax=besar?`<text x="${W-pd}" y="${(Y(last)+(Y(last)<H/2?16:-8)).toFixed(1)}" text-anchor="end" class="skt">${fx(last,2)}</text><text x="${pd}" y="${H-3}" class="skt">${esc(tkO(r.tarikh_beli))} · beli ${fx(hb,2)}</text><text x="${W-pd}" y="${H-3}" text-anchor="end" class="skt">${esc(tkO(s.t[s.t.length-1]))}</text>`:'';
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" width="${besar?'100%':W}" height="${H}" role="img" aria-label="${esc(lbl)}"><title>${esc(lbl)}</title>${hb?hl(hb,'--muted','2 2'):''}${pr?hl(pr,'--warn','1 2'):''}${ln}<circle cx="${X(n-1).toFixed(1)}" cy="${Y(last).toFixed(1)}" r="${besar?3:2}" fill="var(${col})"/>${ax}</svg>`;}
/* hari dipegang lawan had masa kaedah (katalog "Maks N hari"), atau purata pegang backtest jika tiada had */
const hadMasaM=memo(kat=>{const m={};(kat&&kat.rows||[]).forEach(k=>{const p=String(k.pegang||'');if(/^tiada had masa/i.test(p))return;const x=/(\d+)\s*hari/.exec(p);if(x)m[k.id]=+x[1];});return m;});
function hariSel(r){const h=r.keluar?hariAntara(r.tarikh_beli,r.tarikh_keluar):r.hari;if(h==null)return '–';if(r.tutup_semua||r.tidak_dibeli)return fx(h,0);
  const had=hadMasaM(S.kat)[r.kaedah],b=had?null:btOf(r.kaedah),ruj=had||(b&&b.r.days);if(!ruj)return fx(h,0);
  const hmp=had&&h/had>=0.8;
  return `${fx(h,0)}<span class="hbar${had?'':' bt'}${hmp?' hmp':''}" title="${h} hari dipegang ${had?`daripada had masa ${had} hari kaedah`:`· purata pegang backtest ${fx(ruj,1)} hari`}"><i style="width:${(Math.min(1,h/ruj)*100).toFixed(0)}%"></i></span><span class="vv">${had?`had ${had}`:`bt ${fx(ruj,0)}`}</span>`;}

/* keadaan pada tutup sesi sebelum (P): posisi yang dibeli ≤ P; keluar lorong kaedah ≤ P guna untung akhir, selainnya tutup P.
   Penurunan maks (MAE) guna nilai terkini, jadi skor label semalam ialah anggaran. */
const semalamM=memo((src,G)=>{if(!G||G.T.length<2)return null;const P=G.T[G.T.length-2],rows=[];let kurang=0;
  src.forEach(r=>{if(!r.tarikh_beli||r.tarikh_beli>P)return;const kel=!!(r.keluar&&r.tarikh_keluar&&r.tarikh_keluar<=P);let h=null;
    if(kel)h=r.untung_akhir_pct;else{const c=tutupPada(r.saham,P),hb=nomb(r.harga_beli);if(c!=null&&hb)h=(c/hb-1)*100;else kurang++;}
    rows.push(Object.assign({},r,{keluar:kel,tarikh_keluar:kel?r.tarikh_keluar:'',untung_akhir_pct:kel?r.untung_akhir_pct:null,untung_pct:kel?r.untung_pct:h,hasil:h}));});
  return {P,D:G.T[G.T.length-1],rows,kurang};});
const semalam=src=>semalamM(src,garis());
const delta=(a,b,amb=0.05)=>{if(a==null||b==null||isNaN(a)||isNaN(b))return '';const d=a-b;
  if(Math.abs(d)<amb)return '<span class="dlt mut" title="Hampir tiada perubahan sejak tutup sesi sebelum">–</span>';
  return `<span class="dlt ${d>0?'pos':'neg'}" title="Berbanding tutup sesi sebelum">${d>0?'▲':'▼'} ${d>0?'+':''}${fx(d,2)} mata</span>`;};
const labelBerubahC=new WeakMap();
function labelBerubah(src){const sm=semalam(src);if(!sm)return [];const c=labelBerubahC.get(sm);if(c)return c;
  let a=prStatsC.get(src);if(!a){a=prStats(src);prStatsC.set(src,a);}const m={};prStats(sm.rows).forEach(o=>{m[o.kaedah]=o.kep;});
  const out=a.filter(o=>m[o.kaedah]&&m[o.kaedah]!==o.kep).map(o=>({kaedah:o.kaedah,dari:m[o.kaedah],ke:o.kep}));labelBerubahC.set(sm,out);return out;}

/* status saluran data: tarikh data setiap saluran lawan sesi yang dijangka (cuti NYSE tidak diambil kira) */
function jangkaSesi(jam){const now=Date.now(),d=new Date();d.setUTCHours(0,0,0,0);
  for(let i=0;i<10;i++){const w=d.getUTCDay();if(w&&w<6&&now>=d.getTime()+jam*3600e3)return d.toISOString().slice(0,10);d.setUTCDate(d.getUTCDate()-1);}return '';}
const hariKerjaSebelum=t=>{const d=new Date(t+'T00:00:00Z');do{d.setUTCDate(d.getUTCDate()-1);}while(d.getUTCDay()===0||d.getUTCDay()===6);return d.toISOString().slice(0,10);};
function saluran(){if(!S.live)return [];const h=S.hst||{},a=S.anl||{},iso=t=>(/^\d{4}-\d\d-\d\d/.exec(String(t||''))||[''])[0];
  /* data malam siap ≈ 6:30 pagi MYT (22:30 UTC hari sesi); belian 9:35 NY ≈ 21:35–22:35 MYT (13:35–14:35 UTC) */
  const js=jangkaSesi(23),jb=jangkaSesi(15);
  return [['Harga & posisi',iso(h.harga_tutup_pada),js,'harian.yml → harian/status'],['Belian 9:35 NY',iso(h.beli_pada),jb,'beli.yml → harian/status.beli_pada'],
    ['Watchlist',iso(S.watch&&S.watch.tarikh_data),js,'imbasan malam → papertrade/watchlist'],['Harga tinggi/rendah',iso(S.mae&&S.mae.harga_hingga),js,'prestasi/mae'],
    ['Lejar Penuh',iso(a.lejar_sesi),js,'lejar.yml → analisis/papan.lejar_sesi'],['Penganalisis',iso(a.harga_pada),js,'analisis.yml → analisis/papan'],
    ['Portfolio 10 slot',iso(S.pslot&&S.pslot.sesi_terakhir),js,'lejar.yml → prestasi/portfolio_slot'],['Sektor (mingguan)',iso(S.sektor&&S.sektor.dibina),null,'sektor/snapshot']]
   .map(([n,v,j,src])=>{let st;if(!v)st='x';else if(j===null)st=(Date.now()-Date.parse(v+'T00:00:00Z'))/864e5<=8?'ok':'basi';else st=v>=j?'ok':v>=hariKerjaSebelum(j)?'lewat':'basi';return {n,v,j,src,st};});}
const SAL={ok:['✓','pos','segar'],lewat:['!','wrn','lewat 1 sesi'],basi:['✗','neg','basi'],x:['?','mut','tiada data']};
const salChip=x=>`<span class="sal sal-${x.st}" title="${esc(x.n)}: data ${x.v?esc(tkP(x.v)):'tiada'}${x.j?` · dijangka ${esc(tkP(x.j))}`:''} · ${SAL[x.st][2]} (${esc(x.src)})"><b>${SAL[x.st][0]}</b>${esc(x.n)} <span class="mut">${x.v?esc(tkO(x.v)):'–'}</span></span>`;
function renderSal(){const b=$('#salH');if(!b)return;const L=saluran();if(!L.length){b.hidden=true;return;}
  const ok=L.filter(x=>x.st==='ok').length,teruk=L.some(x=>x.st==='basi'||x.st==='x')?'basi':L.some(x=>x.st==='lewat')?'lewat':'ok';
  b.hidden=false;b.className='salh sal-'+teruk;b.innerHTML=`<b>${SAL[teruk][0]}</b> Data ${ok}/${L.length}`;b.title=`${ok} daripada ${L.length} saluran data segar · ketik untuk butiran`;}
function openSal(){const L=saluran();sheet(`<div class="lbl">Status data</div><h3 id="shTitle">Kesegaran setiap saluran data</h3>
  <div class="sec"><div class="salsenarai">${L.map(x=>`<div>${salChip(x)}<span class="mut">${x.j?'dijangka '+esc(tkP(x.j)):'≤ 8 hari'} · ${esc(x.src)}</span></div>`).join('')}</div>
  <p class="ln mut">✓ segar · ! lewat satu sesi · ✗ basi (lebih satu sesi) · ? tiada data. Sesi dijangka = hari dagangan terakhir yang datanya sepatutnya sudah siap (cuti NYSE tidak diambil kira).</p></div>
  <div class="acts"><button type="button" class="btn ghost" data-tutup>Tutup</button></div>`);}

/* Ringkasan: panel Esok dan Berubah sejak sesi lalu */
function panelEsok(){const D=tarikhData(),nx=D?hariDagBerikut(D):'',pos=posRows('c').filter(r=>!r.tidak_dibeli);
  const jual=pos.map(r=>({r,s:statusPos(r)})).filter(x=>x.s&&x.s[0]==='m').sort((a,b)=>(a.r.untung_pct??0)-(b.r.untung_pct??0));
  const W=watchRows(),beli=W.map((r,i)=>({r,i})).filter(x=>wLengkap(x.r)&&wBeli(x.r).k==='tunggu');
  const er=[...new Map(pos.filter(r=>!r.tutup_semua&&(hariKeEarn(r)??99)<=5).map(r=>[r.saham,r])).values()].sort((a,b)=>hariKeEarn(a)-hariKeEarn(b));
  const hm=pos.map(r=>({r,s:statusPos(r),a:l2Info(r)})).filter(x=>x.s&&x.s[0]==='h').sort((a,b)=>(a.a?a.a.x:1)-(b.a?b.a.x:1));
  const HAD=TELEFON?12:24,lagi=(n,tab)=>n>HAD?`<button type="button" class="lnk" data-pergi="${tab}">+${n-HAD} lagi</button>`:'';
  /* satu cip setiap saham: bilangan posisi (kaedah) dan untung purata; ketik membuka posisi pertama */
  const kump=L=>{const m=new Map();L.forEach(x=>{const g=m.get(x.r.saham)||{x,n:0,u:[],k:new Set(),l1:0,l2:0};g.n++;g.u.push(x.r.untung_pct);g.k.add(x.r.kaedah);if(x.s&&x.s[2])g.l1=1;if(x.s&&x.s[3])g.l2=1;m.set(x.r.saham,g);});return [...m.values()];};
  const cP=g=>{const u=avgOf(g.u);return `<button type="button" class="ec" data-pos="${esc(g.x.r._p)}" title="${esc([...g.k].join(', '))}">${g.l1?cipL('K'):''}${g.l2?cipL('2'):''}<b>${esc(g.x.r.saham)}</b><span class="mut">${g.n>1?'×'+g.n:esc(g.x.r.kaedah)}</span><span class="${cls(u)}">${sg2(u)}</span></button>`;};
  const jualG=kump(jual),hmG=kump(hm);
  const blok=(t,tip,n,isi,kosong)=>`<div class="esb"><div class="esh"${tip?` data-tip="${tip}"`:''}>${t} <b>${n}</b></div>${n?`<div class="ecs">${isi}</div>`:`<p class="mut" style="margin:0">${kosong}</p>`}</div>`;
  return `<div class="panel"><div class="panel-h"><h2>Esok${nx?` · buka ${esc(tkO(nx))}`:''}</h2><span class="sub">Papertrade C · ketik saham untuk butiran</span></div>
    ${blok(`${titikH('m')} Dijual pada buka`,'isyarat_keluar',jual.length,`<span class="mut ecn">${nf(jualG.length)} saham</span>`+jualG.slice(0,HAD).map(cP).join('')+lagi(jualG.length,'posisi'),'Tiada isyarat keluar baharu.')}
    ${blok('Dibeli pada buka','isyarat_lengkap',beli.length,beli.slice(0,HAD).map(x=>`<button type="button" class="ec" data-wl="${x.i}"><b>${esc(x.r.saham)}</b><span class="mut">${esc(x.r.kaedah)}</span>${grB(x.r.gred_keseluruhan)}</button>`).join('')+lagi(beli.length,'watch'),'Tiada isyarat lengkap menunggu belian.')}
    ${blok(`${titikH('h')} Hampir paras keluar`,'',hm.length,`<span class="mut ecn">${nf(hmG.length)} saham</span>`+hmG.slice(0,HAD).map(cP).join('')+lagi(hmG.length,'posisi'),'Tiada posisi hampir paras keluar.')}
    ${blok('📅 Earnings ≤ 5 hari dagangan','g_q',er.length,er.slice(0,HAD).map(r=>`<button type="button" class="ec" data-pos="${esc(r._p)}"><b>${esc(r.saham)}</b><span class="mut">${esc(tkO(r.tarikh_earnings))} · ${hariKeEarn(r)}h</span></button>`).join('')+lagi(er.length,'posisi'),'Tiada earnings dalam 5 hari dagangan bagi posisi dipegang.')}</div>`;}
function panelBerubah(src){const sm=semalam(src),dB=belianTerkini(src),nB=src.filter(r=>r.tarikh_beli===dB).length;
  const dK=src.reduce((m,r)=>r.keluar&&(r.tarikh_keluar||'')>m?r.tarikh_keluar:m,''),nK=src.filter(r=>r.keluar&&r.tarikh_keluar===dK).length;
  const d2=src.reduce((m,r)=>r.keluar_henti&&(r.tarikh_keluar_henti||'')>m?r.tarikh_keluar_henti:m,''),n2=src.filter(r=>r.keluar_henti&&r.tarikh_keluar_henti===d2).length;
  const w=S.watch,wb=w&&w.rows?w.rows.filter(r=>baruW(r)).length:null,lb=labelBerubah(src);
  const ra=(S.anl&&S.anl.rows||[]).filter(r=>r.kedudukan&&r.kedudukan_sebelum).map(r=>({id:r.id,d:r.kedudukan_sebelum-r.kedudukan,k:r.kedudukan})).filter(x=>x.d).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d)).slice(0,6);
  const adaAnl=(S.anl&&S.anl.rows||[]).some(r=>r.kedudukan_sebelum!=null);
  const baris=(a,b)=>`<div class="bbr"><span>${a}</span><span>${b}</span></div>`;
  return `<div class="panel"><div class="panel-h"><h2>Berubah sejak sesi lalu</h2><span class="sub">${sm?`Tutup ${esc(tkO(sm.P))} → ${esc(tkO(sm.D))}`:'Menunggu data harga (prestasi/garis)'}</span></div>
    ${baris(`${BARU} Dibeli`,`<b>${nf(nB)}</b> <span class="mut">pada ${esc(tkO(dB))}</span>`)}
    ${baris(`${cipL('K')} Keluar lorong kaedah`,`<b>${nf(nK)}</b> <span class="mut">pada ${esc(tkO(dK)||'–')}</span>`)}

  const kanan=(o,j,np,tip)=>`<td class="jx"><span class="${o&&o.ex>=PR_MIN_TUTUP?'pos':''}">${o?o.ex:'–'}</span><span class="mut">/${PR_MIN_TUTUP}</span></td><td class="j" title="${esc(tip)}"><b class="${cls(j)}">${sg2(j)}</b> <span class="mut">${np??''}</span></td>`;

/* garis silang: garis menegak + kotak nilai pada titik terdekat (tetikus atau sentuh); xs = koordinat x dalam viewBox lebar W */
function silang(box,W,xs,lbl){const svg=box&&box.querySelector('svg');if(!svg||!xs.length)return;box.classList.add('silang');

const slB=(a,b)=>`<div><span class="mut">${a}</span> <b>${b}</b></div>`;
/* garis silang carta harga dalam helaian posisi: koordinat sama seperti sparkPos(r,W,120,1) */
function silangSpark(bx,r,W){const s=siriPos(r);if(!s)return;const hb=nomb(r.harga_beli),v=hb?[hb,...s.v]:s.v,t=hb?['',...s.t]:s.t,n=v.length,pd=6;
  const X=i=>pd+(n<2?(W-2*pd)/2:i/(n-1)*(W-2*pd));

/* R = untung ÷ risiko awal; risiko awal = (harga beli − henti kaedah pada hari isyarat) ÷ harga beli. Risiko < 0.5% diabaikan (R melambung). */
const riskAwal=r=>{const b=nomb(r.harga_beli),h=nomb(r.henti);return b&&h&&h<b?(1-h/b)*100:null;};
const rOf=r=>{const k=riskAwal(r),u=r.keluar?r.untung_akhir_pct:r.untung_pct;return k==null||k<0.5||u==null?null:u/k;};
const rTxt=v=>v==null||isNaN(v)?'–':(v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(2)+'R';
const rSel=r=>{const v=rOf(r),k=riskAwal(r);return v==null?'<span class="mut">–</span>':`<b class="${cls(v)}">${rTxt(v)}</b><span class="vv nw">risiko ${fx(k,1)}%</span>`;};
const R_BIN=[-2,-1.5,-1,-0.5,0,0.5,1,1.5,2,2.5,3];
function drawR(box,vals){if(!box)return;const v=vals.filter(x=>x!=null&&!isNaN(x));if(!v.length){box.innerHTML='<p class="empty">Tiada dagangan dengan henti kaedah.</p>';return;}
  const nb=R_BIN.length+1,cnt=new Array(nb).fill(0);v.forEach(x=>{let i=0;while(i<R_BIN.length&&x>=R_BIN[i])i++;cnt[i]++;});

  let g='<g class="grid">',t='';for(let c=0;c<=mx;c+=st){const y=Y(c).toFixed(1);g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}"/>`;t+=`<text x="${P.l-6}" y="${(+y+4).toFixed(1)}" text-anchor="end">${c}</text>`;}g+='</g>';
  const jul=i=>i===0?'bawah −2R':i===nb-1?'+3R ke atas':`${rTxt(R_BIN[i-1])} hingga ${rTxt(R_BIN[i])}`;

    b+=`<g class="hit"><rect x="${X(i).toFixed(1)}" y="${P.t}" width="${bw.toFixed(1)}" height="${(H-P.t-P.b).toFixed(1)}" fill="transparent"/>${c?`<rect x="${(X(i)+1).toFixed(1)}" y="${y.toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${(y0-y).toFixed(1)}" rx="3" fill="var(${col})"/>`:''}<title>${jul(i)}: ${c} dagangan (${fx(c/v.length*100,0)}%)</title></g>`;});
  const sk=W<480?2:1;R_BIN.forEach((x,i)=>{if(sk>1&&i%sk)return;t+=`<text x="${X(i+1).toFixed(1)}" y="${H-12}" text-anchor="middle" style="font-size:10.5px">${x>0?'+':''}${x}</text>`;});
  t+=`<text x="${W-P.r}" y="${H-1}" text-anchor="end" style="font-size:10px">R →</text>`;
  const z=`<line x1="${X(5).toFixed(1)}" x2="${X(5).toFixed(1)}" y1="${P.t-6}" y2="${y0.toFixed(1)}" stroke="var(--fg-2)" stroke-dasharray="3 3" opacity=".6"/>`;
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="Taburan untung dalam unit R">${g}${b}${z}${t}</svg>`;}
function prR(src,which){const ex=src.filter(r=>r.keluar),vr=ex.map(rOf).filter(x=>x!=null),vo=src.filter(r=>!r.keluar).map(rOf).filter(x=>x!=null);if(!vr.length&&!vo.length)return '';

/* plot kotak setiap kaedah: kotak = Q1–Q3, garis tebal = median, bulatan = purata, misai = 1.5 × IQR (Tukey), titik = luar biasa */
const kuantil=(s,f)=>{const p=(s.length-1)*f,i=Math.floor(p);return i+1<s.length?s[i]+(s[i+1]-s[i])*(p-i):s[i];};

function drawKotak(box,src){if(!box)return;const all=kotakStat(src);if(!all.length){box.innerHTML=`<p class="empty">Belum ada kaedah dengan ≥ ${KOTAK_MIN} dagangan.</p>`;return;}

  const lo0=Math.min(0,...B.map(o=>o.lo)),hi0=Math.max(0,...B.map(o=>o.hi)),st=langkahBulat(hi0-lo0||10,W<480?3:5),lo=Math.floor(lo0/st)*st,hi=Math.ceil(hi0/st)*st;
  const X=v=>P.l+(Math.max(lo,Math.min(hi,v))-lo)/(hi-lo)*(W-P.l-P.r);
  let g='<g class="grid">',t='';for(let v=lo;v<=hi+st/2;v+=st){const x=X(v).toFixed(1);g+=`<line x1="${x}" x2="${x}" y1="${P.t}" y2="${H-P.b}"/>`;t+=`<text x="${x}" y="${H-8}" text-anchor="middle">${v>0?'+':''}${fx(v,0)}</text>`;}g+='</g>';
  const z=`<line x1="${X(0).toFixed(1)}" x2="${X(0).toFixed(1)}" y1="${P.t}" y2="${H-P.b}" stroke="var(--fg-2)" stroke-dasharray="3 3" opacity=".6"/>`;
  const b=B.map((o,i)=>{const y=P.t+i*rh+rh/2,c=o.med>0?'--pos':o.med<0?'--neg':'--muted';

      <line x1="${X(o.med).toFixed(1)}" x2="${X(o.med).toFixed(1)}" y1="${(y-7).toFixed(1)}" y2="${(y+7).toFixed(1)}" stroke="var(--fg)" stroke-width="2.5"/>
      <circle cx="${X(o.avg).toFixed(1)}" cy="${y}" r="2.6" fill="var(--bg)" stroke="var(--fg)" stroke-width="1.4"/>
      ${o.luar.map(x=>`<circle cx="${X(x).toFixed(1)}" cy="${y}" r="1.8" fill="var(--muted)" opacity=".7"/>`).join('')}

/* air terjun: sumbangan USD setiap kaedah (USD1,000 setiap posisi) kepada jumlah "Jika USD1,000 setiap posisi" */

  const P=pos.slice(0,10),N=neg.slice(0,10),L=[...pos.slice(10),...neg.slice(10),...e.filter(x=>!x.v)],tot=e.reduce((t,x)=>t+x.v,0);
  return {items:[...P,...(L.length?[{k:`Lain-lain (${L.length})`,v:L.reduce((t,x)=>t+x.v,0),lain:1}]:[]),...N.reverse()],tot,n:e.length};}
function drawAir(box,src){if(!box)return;const A=airItems(src);if(!A.items.length){box.innerHTML='<p class="empty">Tiada data.</p>';return;}

  const b=L.map((x,i)=>{const y=P.t+i*rh,x0=X(Math.min(x.a,x.b)),w=Math.max(1,Math.abs(X(x.b)-X(x.a))),col=x.jum?'--accent':x.lain?'--muted':x.v<0?'--neg':'--pos',kn=X(Math.max(x.a,x.b))+4;

      <text x="${P.l-8}" y="${(y+14).toFixed(1)}" text-anchor="end" style="fill:var(${x.jum?'--fg':'--fg-2'});${x.jum?'font-weight:600':''}">${esc(x.k)}</text>
      <rect x="${x0.toFixed(1)}" y="${(y+3).toFixed(1)}" width="${w.toFixed(1)}" height="${rh-6}" rx="2" fill="var(${col})"${x.lain?' opacity=".6"':''}/>${sm}
      <text x="${kn.toFixed(1)}" y="${(y+14).toFixed(1)}" style="font-size:11px;fill:var(--fg-2)">${usdK(x.v)}</text>

  const z=`<line x1="${X(0).toFixed(1)}" x2="${X(0).toFixed(1)}" y1="${P.t}" y2="${H-P.b}" stroke="var(--line-2)"/>`;

/* aliran isyarat (Sankey) Papertrade C: isyarat → dibeli / tidak → dipegang / keluar → untung / rugi */
function aliranData(rows){const tdb=rows.filter(r=>r.tidak_dibeli),luar=rows.filter(r=>r.tidak_sah&&!r.tidak_dibeli),sah=rows.filter(r=>!r.tidak_sah);

  const N=[['i',0,rows.length,'Isyarat','--fg-2'],['b',1,sah.length,'Dibeli','--accent'],['t',1,tdb.length,'Tidak dibeli','--muted'],['l',1,luar.length,'Luar peraturan','--warn'],
    ['p',2,peg.length,'Dipegang','--simpan'],['k',2,kel.length,'Keluar','--violet'],['pu',3,pu,'Sedang untung','--pos'],['pr',3,peg.length-pu,'Sedang rugi','--neg'],['km',3,km,'Menang','--pos'],['kr',3,kel.length-km,'Rugi/rata','--neg']]
    .map(([id,c,n,t,col])=>({id,c,n,t,col})).filter(x=>x.n>0);
  const by={};N.forEach(x=>{by[x.id]=x;});
  const Lk=[['i','b'],['i','t'],['i','l'],['b','p'],['b','k'],['p','pu'],['p','pr'],['k','km'],['k','kr']].filter(([a,b])=>by[a]&&by[b]).map(([a,b])=>({s:by[a],t:by[b],n:by[b].n}));
  return {N,Lk,by,n:rows.length,sah:sah.length,kel:kel.length,km,peg:peg.length,pu};}
function drawAliran(box,rows){if(!box)return;const D=aliranData(rows);if(!D.n){box.innerHTML='<p class="empty">Tiada isyarat.</p>';return;}

  const nd=D.N.map(x=>`<rect x="${x.x.toFixed(1)}" y="${x.y.toFixed(1)}" width="${nw}" height="${x.h.toFixed(1)}" rx="2" fill="var(${x.col})"><title>${esc(x.t)}: ${nf(x.n)}</title></rect>`).join('');
  /* label: dua baris (nama · bilangan dan peratus daripada induk), dijarakkan supaya tidak bertindih */

function prAliran(which){const pc=ptcRows();if(which==='m'||!pc)return '';const D=aliranData(pc.rows);if(!D.n)return '';

/* peta portfolio (gaya Finviz): posisi dipegang (lorong kaedah) ikut sektor → industri; saiz = bilangan, warna = untung purata */
function petaData(rows){const by={};rows.forEach(r=>{const s=r.sektor||'Tiada sektor',i=r.industri||'Tiada industri';const S1=by[s]||(by[s]={k:s,v:0,ind:{}});S1.v++;(S1.ind[i]=S1.ind[i]||[]).push(r);});

    squarify(Object.entries(s.ind).map(([k,a])=>({k,v:a.length,rs:a,u:avgOf(a.map(r=>r.untung_pct))})),s.x+1,s.y+hd+1,s.w-3,s.h-hd-3).forEach(t=>{
      const pil=st&&st.sk===s.k&&st.ind===t.k,f=t.w>90&&t.h>40?12:10.5,vt=`${t.v} · ${sg2(t.u)}`,dua=t.w>vt.length*6.3+10&&t.h>34,satu=t.w>34&&t.h>16;

  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="group" aria-label="Peta portfolio ikut sektor dan industri">${o}</svg>`;}
function panelPeta(peg,st){if(!peg.length)return '';const sk=new Set(peg.map(r=>r.sektor||'Tiada sektor')).size;

/* tiada skrol mendatar: jika jadual lebih lebar daripada bekasnya, sembunyi lajur dari kanan ke kiri (untung bulanan: bulan
   terlama dahulu), kecuali lajur utama: lajur pertama, Saham/Kaedah, lajur ringkas telefon m0, Untung %; nota di bawah jadual
   menamakannya. Kad telefon (tw-lp, tw-grd ≤ 760px) tidak disentuh. Dipanggil selepas setiap lukisan (topScrolls) dan ubah saiz. */
function muatLajur(){
  document.querySelectorAll('.tablewrap').forEach(w=>{
    const t=w.querySelector(':scope>table');if(!t)return;
    w.querySelectorAll('.sbn').forEach(x=>x.classList.remove('sbn'));
    const nt=w.nextElementSibling;if(nt&&nt.classList.contains('sbn-nota'))nt.remove();
    if(!w.offsetParent||(skrinKecil()&&/\btw-(lp|grd)\b/.test(w.className)))return;
    const hr=t.tHead&&t.tHead.rows.length===1?t.tHead.rows[0]:null;if(!hr)return;
    const ths=[...hr.cells];if(ths.some(h=>h.colSpan>1))return;
    const lebih=()=>t.offsetWidth>w.clientWidth+1;if(!lebih())return;
    const r1=t.tBodies[0]&&t.tBodies[0].rows[0],td1=r1?[...r1.cells]:[];
    const utama=i=>i===0||ths[i].classList.contains('frz')||ths[i].offsetWidth===0||/\b(m0|tk|utg|name|mline|mkad|mbtn)\b/.test((td1[i]&&td1[i].className)||ths[i].className);
    const rows=[...t.querySelectorAll('tbody tr')].filter(tr=>tr.cells.length===ths.length),sor=[];
    const urut=ths.map((_,i)=>i).slice(1);if(!t.classList.contains('hmt'))urut.reverse();
    for(const i of urut){if(!lebih())break;if(utama(i))continue;
      ths[i].classList.add('sbn');rows.forEach(tr=>tr.cells[i].classList.add('sbn'));sor.push((ths[i].textContent||'').replace(/[↕↓↑]/g,'').trim());}
    if(!t.classList.contains('hmt'))sor.reverse();
    if(sor.length)w.insertAdjacentHTML('afterend',`<p class="sbn-nota">Lajur disembunyi kerana skrin tidak cukup lebar: ${esc(sor.join(', '))}. ${t.querySelector('tbody tr[tabindex]')?'Ketik baris untuk butiran penuh, atau besarkan tetingkap.':'Besarkan tetingkap untuk melihatnya.'}</p>`);
  });
}
