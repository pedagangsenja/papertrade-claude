<title>Papan Backtest Shariah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Susun atur: konsol terminal satu lajur; pengepala melekit (tab utama + sub-tab), paparan bertab, helaian bawah untuk butiran.
   Gaya SST Terminal: navy gelap sahaja (pilihan sengaja, satu tema). */
:root{
  color-scheme:dark;
  --bg:#0b1220; --surface:#0f172a; --card:#111a2e; --sunk:#0c1526; --line:#1f2a40; --line-2:#2a3852;
  --fg:#e2e8f0; --fg-2:#cbd5e1; --muted:#8a9ab3;
  --accent:#2dd4bf; --accent-soft:rgba(45,212,191,.12); --violet:#8b5cf6; --violet-soft:rgba(139,92,246,.16);
  --pos:#22c55e; --pos-soft:rgba(34,197,94,.14); --neg:#ef4444; --neg-soft:rgba(239,68,68,.13); --warn:#f59e0b; --warn-soft:rgba(245,158,11,.14);
  --guna:#22c55e; --guna-bg:rgba(34,197,94,.15); --uji:#f59e0b; --uji-bg:rgba(245,158,11,.15); --simpan:#60a5fa; --simpan-bg:rgba(96,165,250,.15); --tolak:#ef4444; --tolak-bg:rgba(239,68,68,.14);
  --ref:#eab308;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:8px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:16px}
body{margin:0;background:radial-gradient(1200px 500px at 80% -10%,rgba(45,212,191,.06),transparent 60%),var(--bg);background-color:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:'cv11','ss01'}
div.wrap{max-width:none;margin:0 auto;padding-inline:16px;padding-block:0 56px}
.num{font-variant-numeric:tabular-nums lining-nums}
a{color:var(--accent)}
button{font-family:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,tr:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* pengepala */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin-inline:-16px;padding:12px 16px 0}
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mk{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--violet));flex:none}
h1{font-size:1.2rem;font-weight:800;letter-spacing:-.01em;margin:0;text-wrap:balance}
.live{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted)}
.live{flex-wrap:wrap;row-gap:2px}
.gr{display:inline-block;min-width:1.45em;text-align:center;border-radius:4px;font-weight:700;font-size:.7rem;line-height:1.5;padding:0 3px;margin:0 2px 2px 0}
.gr small{font-weight:500;opacity:.75;margin-right:1px}
.nw{white-space:nowrap}
/* jadual bergred: angka dan perkataan tidak dipecah; skrol mendatar dalam jadual jika terlalu lebar */
.tablewrap:has(td.grd){overflow-x:auto}.tablewrap:has(td.grd) td,.tablewrap:has(td.grd) th{overflow-wrap:break-word;padding-inline:4px}
td.grd{min-width:0}.tablewrap:has(td.grd) td.wrap{min-width:150px}td.grd .vv{font-size:.72rem}td.grp{min-width:240px}.tablewrap td .nw{white-space:nowrap}
.grc{display:inline-flex;gap:8px;align-items:center;text-align:left;vertical-align:middle}
.grc>.gr{flex:none;display:flex;align-items:center;justify-content:center;min-width:2em;height:2.1em;margin:0;padding:0 6px;font-size:1.05rem;border-radius:6px}
.grt{min-width:0;display:flex;flex-direction:column;justify-content:center}.grt b{color:var(--fg)}.grt .pill{align-self:flex-start}
td.grd{text-align:center;vertical-align:middle}
td.ctr,th[data-tip="hari_watch"]{text-align:center}
.tablewrap:has(td.grd) td{vertical-align:middle}
.tablewrap:has(td.grd) th[data-tip^="g_"],.tablewrap:has(td.grd) th[data-tip="gred"]{text-align:center}
td.grd .vv.nm1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
a.berita{color:var(--accent);text-decoration:none;margin-top:2px}a.berita:hover{text-decoration:underline}
.g-A{background:var(--pos-soft);color:var(--pos)}.g-B{background:var(--accent-soft);color:var(--accent)}.g-C{background:var(--sunk);color:var(--fg-2);box-shadow:inset 0 0 0 1px var(--line)}.g-D{background:var(--warn-soft);color:var(--warn)}.g-E{background:var(--neg-soft);color:var(--neg)}.g-x{background:var(--sunk);color:var(--muted)}
#dataTxt b{color:var(--fg-2)}
#dataTxt b.neg{color:var(--neg)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--pos);box-shadow:0 0 0 3px var(--pos-soft)}
nav.tabs{display:flex;gap:2px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;color:var(--muted);font-weight:600;font-size:.92rem;padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{color:var(--fg-2)}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);background:linear-gradient(0deg,var(--accent-soft),transparent 70%)}
.subbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0}
.subbar[hidden]{display:none}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:500;font-size:.85rem;padding:6px 11px;border-radius:6px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--card);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.lbl{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.spacer{flex:1}
.fold-btn{border:1px solid var(--line);background:var(--card);color:var(--fg-2);font-size:.82rem;padding:6px 10px;border-radius:6px;cursor:pointer}
.fold-btn:hover{border-color:var(--line-2)}

/* paparan */
section.view{padding-top:18px;display:grid;gap:16px}
h2{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2);margin:0;text-wrap:balance;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:3px;height:12px;border-radius:2px;background:linear-gradient(var(--accent),var(--violet));flex:none}
h3{font-size:1rem;margin:0}
.sub{color:var(--muted);font-size:.86rem;margin:2px 0 0;max-width:80ch}
.headline{font-size:1rem;line-height:1.55;margin:0;max-width:120ch;color:var(--fg-2)}
.headline b{color:var(--fg)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:-14px -14px 12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.panel-h .sub{margin:0}
.panel-h.foldable{cursor:pointer;user-select:none}
.panel-h.foldable::after{content:"▾";color:var(--muted);font-size:.9rem;margin-left:4px}
.panel.lipat>:not(.panel-h){display:none!important}
.panel.lipat>.panel-h{margin-bottom:-14px;border-bottom:0}
.panel.lipat>.panel-h::after{content:"▸"}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.kpi{background:linear-gradient(180deg,rgba(255,255,255,.02),transparent),var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0;display:grid;gap:3px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,var(--accent),var(--violet));opacity:.55}
.kpis6{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.kpi .lbl{font-size:.72rem}
.kpi .v{font-size:1.7rem;font-weight:700;line-height:1.15;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:.8rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.pill{display:inline-block;font-weight:600;font-size:.72rem;letter-spacing:.03em;padding:2px 8px;border-radius:999px;white-space:nowrap;vertical-align:1px}
.k-GUNA{background:var(--guna-bg);color:var(--guna)} .k-UJI{background:var(--uji-bg);color:var(--uji)}
.k-SIMPAN{background:var(--simpan-bg);color:var(--simpan)} .k-DITOLAK{background:var(--tolak-bg);color:var(--tolak)}
.p-buy{background:var(--pos-soft);color:var(--pos)} .p-hold{background:var(--simpan-bg);color:var(--simpan)} .p-exit{background:var(--neg-soft);color:var(--neg)} .p-near{background:var(--violet-soft);color:#c4b5fd} .p-mute{background:var(--sunk);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.pos{color:var(--pos)} .neg{color:var(--neg)} .mut{color:var(--muted)}
svg text{fill:var(--muted);font-family:var(--f-body);font-size:12px}
svg .grid line{stroke:var(--line)}
.chartbox{width:100%;overflow:hidden}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);color:var(--fg-2);font-size:.84rem;font-weight:500;padding:5px 11px;border-radius:999px;cursor:pointer}
.chip:hover{border-color:var(--line-2)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
input[type=search],select{font:inherit;font-size:.9rem;color:var(--fg);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
input[type=search]{flex:1 1 200px}
select{max-width:100%}

/* jadual boleh-susun (dikongsi semua tab) */
.topscroll{overflow-x:auto;overflow-y:hidden;height:12px;margin-bottom:4px;border-radius:6px;background:var(--sunk)}
.topscroll>div{height:1px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);min-width:0}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:6px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:.68rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--sunk);position:sticky;top:0;user-select:none}
th[data-k]{cursor:pointer}
th[data-k]:hover{color:var(--fg-2)}
th.l,td.l{text-align:left}
td{font-variant-numeric:tabular-nums lining-nums;color:var(--fg-2)}
th[data-k] span::after{content:" ↕";opacity:.3}
th[aria-sort="descending"] span::after{content:" ↓";opacity:1;color:var(--accent)}
th[aria-sort="ascending"] span::after{content:" ↑";opacity:1;color:var(--accent)}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--surface) 92%,#fff 1.5%)}
tbody tr:nth-child(even) td.frz{background:color-mix(in srgb,var(--surface) 92%,#fff 1.5%)}
tbody tr:hover td{background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
tbody tr.click{cursor:pointer}
tbody tr.exit td{background:var(--neg-soft);color:#fecaca}
tbody tr.exit td.frz,tbody tr.exit:nth-child(even) td.frz{background:color-mix(in srgb,var(--neg) 14%,var(--surface))}
tbody tr.exit:nth-child(even) td{background:var(--neg-soft)}
tbody tr.exit td:first-child{box-shadow:inset 3px 0 0 var(--neg)}
tbody tr.exit:hover td{background:color-mix(in srgb,var(--neg) 20%,var(--surface))}
tbody tr.void td{opacity:.5}
tbody tr.void td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
td.name{text-align:left;white-space:normal;min-width:200px;max-width:320px}
td.name b{font-weight:700;color:var(--fg);margin-right:6px}
td .vv{display:block;color:var(--muted);font-size:.76rem;line-height:1.3;white-space:nowrap}
td.name .vv,td.wrap .vv{white-space:normal}
td.wrap{white-space:normal;min-width:220px;max-width:380px;text-align:left}
td.tk b{color:var(--fg);font-weight:700}
.frz{position:sticky;left:0;z-index:2;background:var(--surface);box-shadow:1px 0 0 var(--line)}
th.frz{z-index:3;background:var(--sunk)}
.rkn{display:inline-block;min-width:1.7em;color:var(--muted);font-size:.78rem}
.tablefoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:.82rem;margin-top:8px}
.more{border:1px solid var(--line);background:var(--card);color:var(--fg);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:.85rem}
.empty{padding:26px 14px;text-align:center;color:var(--muted)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:96px 1fr 48px;gap:8px;align-items:center;font-size:.86rem}
.bar .t{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:5px}
.strip{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:10px 14px;font-size:.9rem;color:var(--fg-2)}
.strip b.t{color:var(--warn);letter-spacing:.06em;font-size:.74rem;text-transform:uppercase}
.strip.next b.t{color:var(--accent)}
.strip span{flex:1 1 300px;min-width:0}
.ph{border:1px dashed var(--line-2);border-radius:var(--r);padding:22px 18px;color:var(--muted);background:var(--sunk)}
.ph h3{color:var(--fg-2);margin-bottom:6px}
.ph ul{margin:8px 0 0;padding-left:18px}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:.78rem;border-top:1px solid var(--line);padding-top:8px}

/* Prestasi */
.grid2.eq{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:860px){.grid2.eq{grid-template-columns:1fr}}
.chartbox.scrolly{max-height:520px;overflow-y:auto}
svg .hit{cursor:pointer}
svg .hit:hover path,svg .hit:hover circle,svg .hit:hover rect:not([fill=transparent]){filter:brightness(1.25)}
.panel.danger{border-color:color-mix(in srgb,var(--neg) 35%,var(--line));background:linear-gradient(180deg,rgba(239,68,68,.05),transparent 120px),var(--card)}
.panel.danger h2::before{background:var(--neg)}
.worstgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.worst{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.wrow{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:.86rem;flex-wrap:wrap}
.wrow:last-child{border-bottom:0}
.wrow b{color:var(--fg)}
.wsub{font-size:.76rem}
.skbar{display:inline-flex;align-items:center;gap:6px}
.skbar>span{width:52px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;display:inline-block}
.skbar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--violet),var(--accent))}

/* helaian butiran */
.scrim{position:fixed;inset:0;background:rgba(2,6,15,.6);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88vh;overflow:auto;background:var(--card);border-radius:16px 16px 0 0;border-top:1px solid var(--line-2);padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));max-width:780px;margin:0 auto}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto 12px}
.sheet h3{font-size:1.25rem;font-weight:700;text-wrap:balance}
.close{float:right;border:0;background:var(--sunk);color:var(--fg);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1.1rem}
.gates{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.gate{font-size:.8rem;padding:4px 8px;border-radius:6px}
.gate.ok{color:var(--guna);background:var(--guna-bg)} .gate.no{color:var(--tolak);background:var(--tolak-bg)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 14px;margin:12px 0}
.m .k{font-size:.78rem;color:var(--muted)} .m .v{font-size:1.02rem;font-variant-numeric:tabular-nums}
.note{font-size:.84rem;color:var(--muted);background:var(--sunk);border-radius:8px;padding:10px;margin-top:10px;white-space:pre-wrap;overflow-wrap:anywhere}
.btn{border:0;background:var(--accent);color:#04201c;font-weight:600;font-size:.88rem;padding:9px 14px;border-radius:8px;cursor:pointer}
.btn.ghost{background:var(--sunk);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.cmpsel{display:flex;flex-wrap:wrap;gap:8px}
.cmpsel .chip{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:.86rem;z-index:60}

/* tooltip istilah */
.tip{position:fixed;z-index:80;max-width:min(340px,calc(100vw - 16px));background:var(--surface);color:var(--fg);border:1px solid var(--line-2);border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.45);font-size:.86rem;line-height:1.5;pointer-events:none;overflow:hidden;text-transform:none;letter-spacing:0;font-weight:400}
.tip-h{background:var(--sunk);color:var(--accent);font-weight:700;padding:7px 10px;border-bottom:1px solid var(--line)}
.tip-b{padding:8px 10px 4px;color:var(--fg-2)}
.tip-e{padding:4px 10px 9px;color:var(--muted)}
.tip-e b{color:var(--fg-2)}
.has-tip{text-decoration:underline dotted color-mix(in srgb,currentColor 50%,transparent);text-underline-offset:3px;cursor:help}
th.has-tip[data-k]{cursor:pointer}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
@media (max-width:520px){.fold-btn{display:none} .kpi .v{font-size:1.5rem} th,td{padding:7px 10px} table{font-size:.86rem}}

/* muat-lebar: tiada skrol mendatar — sel dibalut; telefon jadi kad */
.topscroll{display:none!important}
.tablewrap{overflow-x:visible}
table{width:100%;table-layout:auto}
th,td{white-space:normal;overflow-wrap:anywhere;word-break:normal;padding:5px 6px}
th{letter-spacing:.02em;position:static}
td.name,td.wrap{min-width:0;max-width:none}
td .vv{white-space:normal}
.frz,th.frz{position:static;box-shadow:none}
@media (max-width:760px){
  .tablewrap table,.tablewrap tbody,.tablewrap tr,.tablewrap td{display:block;width:100%}
  .tablewrap thead tr{display:flex;flex-wrap:wrap;gap:4px;padding:6px;background:var(--sunk)}
  .tablewrap thead th{border:1px solid var(--line);border-radius:6px;padding:4px 7px;background:var(--card)}
  .tablewrap thead th:not([data-k]){display:none}
  .tablewrap tbody tr{border-bottom:1px solid var(--line-2);padding:6px 4px}
  .tablewrap tbody td{display:flex;justify-content:space-between;gap:12px;text-align:right;border:0;padding:3px 8px}
  .tablewrap tbody td::before{content:attr(data-label);color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;text-align:left;flex:none;max-width:45%}
  .tablewrap tbody td[data-label=""]::before{display:none}
  .tablewrap tbody td.name,.tablewrap tbody td.wrap{display:block;text-align:left}
  .tablewrap tbody td.name::before,.tablewrap tbody td.wrap::before{display:block;max-width:none}
}
</style>

<div class="wrap">
  <header class="top">
    <div class="titlerow">
      <div class="brand"><span class="mk" aria-hidden="true"></span><h1>Papan Backtest Shariah</h1></div>
      <span class="live"><span class="dot" id="dot"></span><span id="liveTxt">Menyambung…</span><span id="dataTxt" data-tip="data_kini"></span></span>
    </div>
    <nav class="tabs" role="tablist" id="mainTabs">
      <button role="tab" data-tab="backtest" aria-selected="true">Backtest</button>
      <button role="tab" data-tab="sektor" aria-selected="false">Sector</button>
      <button role="tab" data-tab="watch" aria-selected="false">Watchlist</button>
      <button role="tab" data-tab="ptm" aria-selected="false">Paper Trade M</button>
      <button role="tab" data-tab="ptc" aria-selected="false">Papertrade C</button>

<script>
(function(){
const SETS=['431','S1','S2','S3','S4'];

const S={set:'431',tab:'backtest',sub:{backtest:'ringkasan',prestasi:'m'},docs:{},meta:null,live:false,
  f:{jenis:'semua',kep:new Set(),q:'',best:true,gaya:false,shown:40},cmp:[],cmpTouched:false,
  ptm:null,ptmPeta:null,ptc:null,ptc2:null,ptc3:null,ptc4:null,ptc5:null,ptc6:null,mae:null,prf:null,watch:null,beli:null,sektor:null,hst:null,sf:null,wf:{k:'',sk:'',ind:'',q:'',shown:60}};
try{const t=localStorage.getItem('pbs2_tab');if(MAIN.includes(t))S.tab=t;const s=localStorage.getItem('pbs_set');if(SETS.includes(s))S.set=s;
  const sb=JSON.parse(localStorage.getItem('pbs2_sub')||'null');if(sb){if(SUBS.backtest.some(x=>x[0]===sb.backtest))S.sub.backtest=sb.backtest;if(SUBS.prestasi.some(x=>x[0]===sb.prestasi))S.sub.prestasi=sb.prestasi;}}catch(e){}
{const h=(location.hash||'').slice(1);const map={ringkasan:['backtest','ringkasan'],papan:['backtest','papan'],banding:['backtest','banding'],sektor:['sektor'],watchlist:['watch'],ptm:['ptm'],ptc:['ptc'],prestasi:['prestasi']};if(map[h]){S.tab=map[h][0];if(map[h][1])S.sub.backtest=map[h][1];}}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=(x,d=1)=>x==null||isNaN(x)?'–':(x*100).toFixed(d)+'%';
const sgn=(x,d=1)=>x==null||isNaN(x)?'–':((x>0?'+':'')+(x*100).toFixed(d)+'%');
const sg2=v=>v==null||isNaN(v)?'–':(v>0?'+':'')+Number(v).toFixed(2)+'%';

const cls=v=>v==null||isNaN(v)?'':v>0?'pos':v<0?'neg':'';

const key=r=>r.id+'|'+r.varian;
const TEMPOH=(Date.UTC(2026,9,2)-Date.UTC(2019,10,1))/86400000/365.25;
const jumlahDari=c=>c==null||isNaN(c)?null:Math.pow(1+c,TEMPOH)-1;
const avgOf=a=>{const v=a.filter(x=>x!=null&&!isNaN(x));return v.length?v.reduce((s,x)=>s+x,0)/v.length:null;};

function allRows(){const out=[];for(const d of Object.values(S.docs)){for(const r of (d.rows||[]))out.push(r);}return out;}
function rowsForSet(set){return allRows().filter(r=>r.set===set);}
function bench(set){const m=S.meta||{};return{ew:m.ew?.[set],spy:m.spy?.[set],qqq:m.qqq?.[set],ewmdd:m.ew_mdd?.[set]};}
function bestBy(rows,k){const by={};for(const r of rows){const b=by[r.id];if(!b||(r[k]??-1e9)>(b[k]??-1e9))by[r.id]=r;}return Object.values(by);}
function bestPerMethod(rows){const by={};for(const r of rows){const b=by[r.id];
  if(!b)by[r.id]=r;else{const rs=r.skor??-1,bs=b.skor??-1;if(rs>bs||(rs===bs&&(r.cagr??-9)>(b.cagr??-9)))by[r.id]=r;}}return Object.values(by);}

/* ================= komponen jadual boleh-susun (dikongsi) =================
   col: {k, t, tip, v(r)=nilai susun, f(r,i)=html sel, l=kiri, frz, ns=tak boleh susun, c(r)=kelas sel} */
const SORT={},ST_R={};
function isNil(x){return x==null||x===''||(typeof x==='number'&&isNaN(x));}
function sortRows(rows,cols,st){const c=cols.find(c=>c.k===st.k);if(!c)return rows;const g=c.v||(r=>r[c.k]);
  return [...rows].sort((a,b)=>{const x=g(a),y=g(b),xn=isNil(x),yn=isNil(y);if(xn&&yn)return 0;if(xn)return 1;if(yn)return -1;
    if(typeof x==='string'||typeof y==='string')return String(x).localeCompare(String(y),undefined,{numeric:true})*st.dir;return (x-y)*st.dir;});}
function sortTable(o){
  const st=SORT[o.id]||(SORT[o.id]={k:o.def?o.def.k:null,dir:o.def?o.def.dir:-1});
  ST_R[o.id]=o.rerender||renderAll;
  let rows=st.k?sortRows(o.rows,o.cols,st):[...o.rows];const total=rows.length;
  if(o.limit)rows=rows.slice(0,o.limit);
  const th=o.cols.map(c=>`<th class="${c.l?'l':''} ${c.frz?'frz':''}"${c.ns?'':` data-k="${c.k}" data-d="${c.l?'asc':'desc'}" aria-sort="${st.k===c.k?(st.dir<0?'descending':'ascending'):'none'}"`}${c.tip?` data-tip="${c.tip}"`:''}><span>${c.t}</span></th>`).join('');
  const tb=rows.map((r,i)=>`<tr${o.attr?' '+o.attr(r):''} class="${o.rcls?o.rcls(r):''}">${o.cols.map(c=>`<td class="${c.l?'l':''} ${c.frz?'frz':''} ${c.c?c.c(r):''}">${c.f?c.f(r,i):esc(isNil(r[c.k])?'–':r[c.k])}</td>`).join('')}</tr>`).join('');
  return `<div class="tablewrap"><table data-st="${o.id}"><thead><tr>${th}</tr></thead><tbody>${tb}</tbody></table>${total?'':`<p class="empty">${o.empty||'Tiada data.'}</p>`}</div>`+(o.foot?o.foot(Math.min(total,rows.length),total):'');
}
document.addEventListener('click',e=>{const th=e.target.closest&&e.target.closest('table[data-st] th[data-k]');if(!th)return;
  const id=th.closest('table').dataset.st;const st=SORT[id];if(!st)return;const k=th.dataset.k;
  if(st.k===k)st.dir*=-1;else{st.k=k;st.dir=th.dataset.d==='asc'?1:-1;}(ST_R[id]||renderAll)();});

/* ================= navigasi ================= */
function viewId(){if(S.tab==='backtest')return 'v-'+S.sub.backtest;if(S.tab==='prestasi')return 'v-pr-'+S.sub.prestasi;return 'v-'+S.tab;}
function renderNav(){
  document.querySelectorAll('#mainTabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===S.tab));
  const subs=SUBS[S.tab];const seg=$('#subSeg');
  seg.hidden=!subs;seg.innerHTML=subs?subs.map(([v,t])=>`<button type="button" role="tab" data-sub="${v}" aria-selected="${S.sub[S.tab]===v}">${t}</button>`).join(''):'';
  const showSet=S.tab==='backtest';$('#setSeg').hidden=!showSet;$('#setLbl').hidden=!showSet;
  $('#setSeg').innerHTML=SETS.map(s=>`<button type="button" data-set="${s}" aria-pressed="${s===S.set}">${s}</button>`).join('');
  const vid=viewId();document.querySelectorAll('section.view').forEach(v=>v.hidden=v.id!==vid);
}
function save(){try{localStorage.setItem('pbs2_tab',S.tab);localStorage.setItem('pbs2_sub',JSON.stringify(S.sub));localStorage.setItem('pbs_set',S.set);}catch(e){}}
$('#mainTabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;save();renderNav();renderAll();window.scrollTo({top:0});};

$('#setSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.set=b.dataset.set;S.f.shown=40;save();renderNav();renderAll();};
function setLive(on,txt){S.live=on;$('#dot').classList.toggle('on',on);$('#liveTxt').textContent=txt;}
/* larian 6:02 MYT (Sel–Sab) terkini yang sepatutnya sudah siap (tenggang 45 minit) */
function jangkaPagi(){const t=new Date(Date.now()+8*3600e3);for(let i=0;i<8;i++){const d=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth(),t.getUTCDate()-i,6,47));const w=d.getUTCDay();if(w>=2&&w<=6&&d<=t)return d;}return null;}
function renderData(){const el=$('#dataTxt');if(!el)return;const h=S.hst;if(!h){el.textContent='';return;}
  const m=/^(\d{4})-(\d\d)-(\d\d) (\d\d):(\d\d)/.exec(h.kemaskini_pagi||'');const kp=m?new Date(Date.UTC(+m[1],m[2]-1,+m[3],+m[4],+m[5])):null;const jk=jangkaPagi();
  const basi=!kp||(jk&&kp<new Date(jk.getTime()-45*60e3));
  el.innerHTML=` · data tutup <b>${esc(h.harga_tutup_pada||h.tarikh_data_pagi||'–')}</b> · kemas kini <b class="${basi?'neg':''}">${esc(h.kemaskini_pagi||'–')}</b>${basi?' <span class="pill p-exit">belum dikemas kini</span>':''}`;}

/* ================= Backtest · Ringkasan ================= */
function renderRingkasan(){
  const el=$('#v-ringkasan');const rows=rowsForSet(S.set);
  if(!rows.length){el.innerHTML=emptyState();return;}
  const b=bench(S.set);const ids=new Set(rows.map(r=>r.id));
  const nM=[...ids].filter(i=>i[0]==='M').length,nI=[...ids].filter(i=>i[0]==='I').length;
  const cnt={};KEP.forEach(k=>cnt[k]=0);rows.forEach(r=>cnt[r.keputusan]=(cnt[r.keputusan]||0)+1);
  const best=bestPerMethod(rows);const beatEw=best.filter(r=>r.menang_ew).length;
  const lulus=rows.filter(r=>!r.gate_gagal).length;
  const gaya=bestBy(rows.filter(r=>(r.n||0)>=100&&r.days!=null&&r.days<=40),'avg').sort((a,c)=>(c.avg??-9)-(a.avg??-9));
  const g5=gaya.slice(0,8);
  const ts=Object.values(S.docs).map(x=>x.tarikh||'').sort().pop()||'–';
  const nameCol={k:'id',t:'Kaedah',tip:'kaedah',l:1,f:(r,i)=>`<span class="rkn">${i+1}</span><b>${esc(r.id)}</b>${esc(r.kaedah)}<span class="vv">${esc(r.varian)}</span>`,c:()=>'name'};
  const t5=[...rows].filter(r=>r.skor!=null).sort((a,c)=>c.skor-a.skor).slice(0,5);
  el.innerHTML=`
  <p class="headline"><b>${ids.size}</b> kaedah dan indikator diuji di set <b>${S.set}</b> (${rows.length} varian). <b>${cnt['GUNA']}</b> GUNA dan <b>${cnt['UJI KERTAS']}</b> UJI KERTAS; hanya <b>${lulus}</b> varian lulus semua gate. Bagi gaya anda (pegang ≤ 40 hari, ≥ 100 entry), <b>${gaya.filter(r=>r.avg>=0.05).length}</b> kaedah memberi untung purata <b>≥ +5%</b> setiap entry.</p>
  <div class="kpis">
    <div class="kpi"><div class="lbl">Kaedah diuji</div><div class="v">${ids.size}</div><div class="s">${nM} kaedah M · ${nI} indikator I · ${rows.length} varian</div></div>
    <div class="kpi"><div class="lbl">GUNA + UJI KERTAS</div><div class="v pos">${cnt['GUNA']+cnt['UJI KERTAS']}</div><div class="s">${cnt['GUNA']} GUNA · ${cnt['UJI KERTAS']} uji kertas (lulus semua gate)</div></div>
    <div class="kpi"><div class="lbl">Terbaik gaya anda</div><div class="v" style="color:var(--accent)">${g5[0]?sgn(g5[0].avg):'–'}</div><div class="s">${g5[0]?esc(g5[0].id)+' · untung purata setiap entry, pegang '+fx(g5[0].days,0)+' hari':'Tiada kaedah ≤ 40 hari'}</div></div>
    <div class="kpi"><div class="lbl">Atasi beli semua</div><div class="v">${beatEw}/${best.length}</div><div class="s">Beli semua sama rata: ${pct(b.ew)} setahun · SPY ${pct(b.spy)} · QQQ ${pct(b.qqq)}</div></div>
  </div>
  <div class="grid2">
    <div class="panel"><div class="panel-h"><h2>Gaya anda: untung setiap entry</h2><span class="sub">Pegang ≤ 40 hari · ≥ 100 entry · varian terbaik</span></div>
      ${g5.length?sortTable({id:'gaya',rows:g5,attr:r=>`data-dk="${esc(key(r))}" tabindex="0"`,rcls:()=>'click',cols:[nameCol,
        {k:'avg',t:'Untung/entry',tip:'avg',f:r=>sgn(r.avg)},{k:'win',t:'Menang',tip:'win',f:r=>pct(r.win,0)},{k:'avgloss',t:'Purata kalah',tip:'avgloss',f:r=>sgn(r.avgloss)},
        {k:'nisbah',t:'Menang:kalah',tip:'nisbah',f:r=>r.nisbah==null?'–':r.nisbah.toFixed(1)+'×'},{k:'days',t:'Hari',tip:'days',f:r=>fx(r.days,0)},{k:'n',t:'Entry',tip:'n',f:r=>fx(r.n,0)}]}):'<p class="empty">Tiada kaedah memenuhi syarat di set ini.</p>'}
    </div>
    <div class="panel"><div class="panel-h"><h2>Taburan keputusan</h2><span class="sub">${rows.length} varian</span></div>
      <div class="bars">${KEP.map(k=>{const n=cnt[k]||0;const w=rows.length?n/rows.length*100:0;return `<div class="bar"><span>${k}</span><span class="t"><i style="width:${w}%;background:var(${KVAR[k]})"></i></span><span class="num" style="text-align:right">${n}</span></div>`}).join('')}</div>
      <p class="sub" style="margin:12px 0 8px">Skor tertinggi</p>
      ${t5.length?sortTable({id:'top5',rows:t5,attr:r=>`data-dk="${esc(key(r))}" tabindex="0"`,rcls:()=>'click',cols:[nameCol,{k:'skor',t:'Skor',tip:'skor',f:r=>fx(r.skor)},{k:'avg',t:'Untung/entry',tip:'avg',f:r=>sgn(r.avg)},{k:'win',t:'Menang',tip:'win',f:r=>pct(r.win,0)}]}):'<p class="empty">Tiada varian yang lulus gate di set ini.</p>'}
    </div>
  </div>
  <div class="panel"><div class="panel-h"><h2>Pulangan lawan kejatuhan</h2><span class="sub">Setiap titik satu varian · kiri atas lebih baik · ketik untuk butiran</span></div>
    <div class="chartbox" id="scatter"></div>
    <div class="legend">${KEP.map(k=>`<span><i style="background:var(${KVAR[k]})"></i>${k}</span>`).join('')}<span><i style="background:var(--ref);border-radius:0;height:2px;width:14px;vertical-align:3px"></i>CAGR beli semua (${pct(b.ew)})</span></div>
  </div>
  <div class="strip"><b class="t">Ingat</b><span>Cara jual-cepat-bila-rugi biasanya memberi kadar menang <b>30–40%</b>: kira-kira 6 daripada 10 entry rugi kecil, dan untung datang daripada 3–4 entry yang naik besar. Nilai sesuatu teknik selepas <b>20–30 entry</b>, bukan selepas beberapa kali rugi.</span></div>
  <div class="strip next"><b class="t">Tindakan seterusnya</b><span>${g5.length?`Pantau dalam papertrade: <b>${g5.slice(0,3).map(r=>esc(r.id)).join(', ')}</b>, iaitu tiga kaedah dengan untung/entry tertinggi bagi pegangan ≤ 40 hari. Semak purata kalah dan nisbah menang:kalah sebelum memilih.`:'Tiada kaedah memenuhi gaya anda di set ini.'}</span></div>
  <div class="foot"><span>Peribadi · Backtest Shariah · enjin v1.2</span><span>Dikemas kini setakat ujian ${esc(ts)}</span></div>`;
  drawScatter($('#scatter'),rows,b);
}
function drawScatter(box,rows,b){
  const W=Math.max(300,box.clientWidth||600),H=Math.round(Math.min(360,W*0.62));
  const P={l:44,r:12,t:12,b:30};const pts=rows.filter(r=>r.cagr!=null&&r.mdd!=null);
  const xmin=Math.min(-0.8,...pts.map(r=>r.mdd)),xmax=0;
  let ymin=Math.min(-0.1,...pts.map(r=>r.cagr)),ymax=Math.max(0.3,...pts.map(r=>r.cagr));
  ymin=Math.floor(ymin*10)/10;ymax=Math.ceil(ymax*10)/10;const x0=Math.floor(xmin*10)/10;
  const X=v=>P.l+(v-x0)/(xmax-x0)*(W-P.l-P.r),Y=v=>P.t+(ymax-v)/(ymax-ymin)*(H-P.t-P.b);
  let g='<g class="grid">';const yt=[],xt=[];
  for(let v=ymin;v<=ymax+1e-9;v+=0.1)yt.push(+v.toFixed(2));for(let v=x0;v<=0.0001;v+=0.1)xt.push(+v.toFixed(2));
  const ys=yt.length>9?yt.filter((_,i)=>i%2===0):yt, xs=xt.length>6?xt.filter((_,i)=>i%2===0):xt;
  ys.forEach(v=>{g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}"/>`});g+='</g>';
  let t='';ys.forEach(v=>t+=`<text x="${P.l-6}" y="${Y(v)+4}" text-anchor="end">${Math.round(v*100)}%</text>`);
  xs.forEach(v=>t+=`<text x="${X(v)}" y="${H-12}" text-anchor="middle">${Math.round(v*100)}%</text>`);
  t+=`<text x="${W-P.r}" y="${H-1}" text-anchor="end">Kejatuhan maksimum (MDD) →</text>`;
  let ref='';
  if(b.ew!=null&&b.ew>=ymin&&b.ew<=ymax)ref+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(b.ew)}" y2="${Y(b.ew)}" stroke="var(--ref)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  ref+=`<line x1="${X(-0.45)}" x2="${X(-0.45)}" y1="${P.t}" y2="${H-P.b}" stroke="var(--tolak)" stroke-width="1" stroke-dasharray="2 3" opacity=".7"/><text x="${X(-0.45)+4}" y="${P.t+10}" style="fill:var(--tolak)">had G4 −45%</text>`;
  ref+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line-2)" stroke-width="1"/>`;
  const sorted=[...pts].sort((a,c)=>(3-(KORD[a.keputusan]??3))-(3-(KORD[c.keputusan]??3)));
  let d='';sorted.forEach(r=>{const strong=r.keputusan!=='DITOLAK';d+=`<circle cx="${X(r.mdd).toFixed(1)}" cy="${Y(r.cagr).toFixed(1)}" r="${strong?4.4:3}" fill="var(${KVAR[r.keputusan]||'--muted'})" fill-opacity="${strong?.95:.3}" stroke="var(--card)" stroke-width="${strong?1:0}" data-dk="${esc(key(r))}" style="cursor:pointer"><title>${esc(r.id+' '+r.varian)} · CAGR ${pct(r.cagr)} · MDD ${pct(r.mdd)}</title></circle>`});
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="Carta serakan CAGR lawan MDD">${g}${ref}${d}${t}<text x="${P.l}" y="${P.t-2}" style="font-size:10px">↑ CAGR</text></svg>`;
}

/* ================= Backtest · Papan kedudukan ================= */
const COLS=[
  {k:'skor',t:'Skor',f:r=>fx(r.skor)},{k:'jumlah',t:'Jumlah untung',f:r=>sgn(r.jumlah,0)},{k:'cagr',t:'CAGR',f:r=>pct(r.cagr)},
  {k:'win',t:'Kadar menang',f:r=>pct(r.win,0)},{k:'n',t:'Jumlah entry',f:r=>fx(r.n,0)},{k:'avg',t:'Untung/dagangan',f:r=>sgn(r.avg)},
  {k:'avgwin',t:'Purata menang',f:r=>sgn(r.avgwin)},{k:'avgloss',t:'Purata kalah',f:r=>sgn(r.avgloss)},{k:'nisbah',t:'Menang:kalah',f:r=>r.nisbah==null?'–':r.nisbah.toFixed(1)+'×'},

const SKP={1:['prestasi_1d','1H',3],w:['prestasi_1w','1W',5],m:['prestasi_1m','1M',10],q:['prestasi_3m','3M',20]};
const FASA={Leading:{c:'--pos',bm:'Memimpin'},Improving:{c:'--accent',bm:'Membaik'},Weakening:{c:'--warn',bm:'Melemah'},Lagging:{c:'--neg',bm:'Ketinggalan'}};
const fasaPill=f=>f?`<span class="pill" style="background:color-mix(in srgb,var(${FASA[f].c}) 16%,transparent);color:var(${FASA[f].c})">${f}</span>`:'<span class="mut">–</span>';
function heatCol(v,lim){if(v==null||isNaN(v))return 'var(--sunk)';const t=Math.max(-1,Math.min(1,v/lim));const a=(0.18+0.72*Math.abs(t)).toFixed(2);
  return t>=0?`color-mix(in srgb,#22c55e ${Math.round(a*100)}%,#0f172a)`:`color-mix(in srgb,#ef4444 ${Math.round(a*100)}%,#0f172a)`;}
function squarify(items,x,y,w,h){const out=[];let rest=items.filter(d=>d.v>0).sort((a,b)=>b.v-a.v);const tot=rest.reduce((s,d)=>s+d.v,0);if(!tot)return out;
  const sc=w*h/tot;rest=rest.map(d=>Object.assign({},d,{a:d.v*sc}));
  const worst=(row,len)=>{const s=row.reduce((t,d)=>t+d.a,0),mx=Math.max(...row.map(d=>d.a)),mn=Math.min(...row.map(d=>d.a));return Math.max(len*len*mx/(s*s),(s*s)/(len*len*mn));};
  while(rest.length){const len=Math.min(w,h);let row=[rest[0]],i=1;
    while(i<rest.length&&worst(row.concat(rest[i]),len)<=worst(row,len)){row.push(rest[i]);i++;}
    rest=rest.slice(i);const s=row.reduce((t,d)=>t+d.a,0);
    if(w>=h){const cw=s/h;let cy=y;row.forEach(d=>{const ch=d.a/cw;out.push(Object.assign(d,{x,y:cy,w:cw,h:ch}));cy+=ch;});x+=cw;w-=cw;}
    else{const ch=s/w;let cx=x;row.forEach(d=>{const cw=d.a/ch;out.push(Object.assign(d,{x:cx,y,w:cw,h:ch}));cx+=cw;});y+=ch;h-=ch;}}
  return out;}

/* ================= lajur papertrade diselaraskan (M, C, Prestasi) ================= */
function hariDari(t){if(!t)return null;const d=Date.parse(t+'T00:00:00Z');if(isNaN(d))return null;let n=0;const now=new Date();for(let x=new Date(d);x<now;x.setUTCDate(x.getUTCDate()+1)){const w=x.getUTCDay();if(w&&w<6)n++;}return Math.max(0,n-1);}
function normPT(r){const keluar=!!(r.keluar||r.tarikh_keluar);const kk=r.kaedah_kongsi;return Object.assign({},r,{
  kaedah_kongsi:Array.isArray(kk)?kk:typeof kk==='string'&&kk.trim()?kk.split(/[,;]\s*/).filter(Boolean):null,
  kaedah:r.kaedah||r.id_kaedah||'–',hari:r.tidak_dibeli?null:(r.hari??hariDari(r.tarikh_beli)),keluar,
  isyarat_keluar:r.isyarat_keluar||(keluar?'Keluar':'Pegang'),
  untung_akhir_pct:keluar?(r.untung_akhir_pct??r.untung_pct):null,
  harga_terkini:keluar&&r.harga_keluar!=null?r.harga_keluar:r.harga_terkini,tidak_sah:!!r.tidak_sah});}

/* gred pada hari isyarat (standard/gred.py) */

const GORD={A:0,B:1,C:2,D:3,E:4};

const adaGred=r=>GDIM.some(([k])=>GORD[r[k]]!=null);
/* satu lajur bagi setiap dimensi S I R P Q (nilai pada hari isyarat), kemudian gred keseluruhan */

function skPerf(jenis,nama){const sk=S.sektor;if(!nama||!sk||!Array.isArray(sk.rows))return null;
  if(!sk._peta||sk._peta.src!==sk.rows){const m={};sk.rows.forEach(x=>{m[x.jenis+'|'+x.nama]=x;});sk._peta={src:sk.rows,m};}
  return sk._peta.m[jenis+'|'+nama]||null;}
function grKump(r,jenis){const g=r[jenis==='Sektor'?'gred_sektor':'gred_industri'],sk=grNil(r[jenis==='Sektor'?'skor_sektor':'skor_industri']);
  const asal=jenis==='Sektor'?r.sektor:r.industri,us=jenis==='Sektor'?r.sektor_us:r.industri_us;const x=skPerf(jenis,us||asal);
  if(GORD[g]==null)return asal?`<span class="grt">${esc(asal)}</span>`:'<span class="mut">belum</span>';
  return grSel1(g,`<span class="nw"><b>${sk==null?'–':fx(sk,0)}</b><span class="mut">/100</span></span><span class="vv nm1" title="${esc(asal||us||'')}">${esc(asal||us||'')}</span>${x&&x.prestasi_1m!=null?`<span class="vv">1B kini <span class="${cls(x.prestasi_1m)}">${sg2(x.prestasi_1m)}</span></span>`:''}`);}
function grRS(r){const v=grNil(r.rs_rating);
  return grSel1(r.gred_rs,v==null?'<span class="mut">tiada data</span>':`<b class="nw">RS ${fx(v,0)}</b><span class="vv nw">atasi ${fx(v,0)}%</span>`);}
function grPem(r){if(GORD[r.gred_pemangkin]==null)return `<span class="mut">${r.pemangkin&&r.pemangkin!=='belum dikumpul'?esc(r.pemangkin):'Belum dikumpul'}</span>`;

  const ln=(Array.isArray(u)?u:[]).filter(x=>x&&/^https:\/\//.test(x.url||'')).slice(0,2).map(x=>`<a class="vv berita" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">↗ ${esc(x.tajuk||'Berita')}</a>`).join('');

const KPT_ORD={TERUSKAN:0,PERHATI:1,HENTIKAN:2,'BELUM CUKUP DATA':3};
const PR_MIN_N=5,PR_MIN_TUTUP=20,USD_POSISI=1000;
const clamp01=x=>Math.max(0,Math.min(1,x));
const median=a=>{const v=a.filter(x=>x!=null&&!isNaN(x)).sort((x,y)=>x-y);if(!v.length)return null;const m=v.length>>1;return v.length%2?v[m]:(v[m-1]+v[m])/2;};
const minOf=a=>{const v=a.filter(x=>x!=null&&!isNaN(x));return v.length?Math.min(...v):null;};
const kptPill=k=>`<span class="pill ${KPT[k].cls}" data-tip="keputusan_pr"><span aria-hidden="true">${KPT[k].ik}</span> ${k}</span>`;
function maeOf(r){const m=S.mae&&S.mae.rows;if(!m)return null;const v=m[`${r.akaun}|${r.saham}|${r.kaedah}|${r.tarikh_beli}`];return v==null?null:v;}
function prSrc(which){const M=ptmRows(),C=ptcRows();const tag=(p,a)=>p?sahSahaja(p.rows).map(r=>Object.assign({},r,{akaun:a})):[];
  const rows=which==='m'?tag(M,'M'):which==='c'?tag(C,'C'):[...tag(M,'M'),...tag(C,'C')];
  rows.forEach(r=>{r.hasil=r.keluar?r.untung_akhir_pct:r.untung_pct;r.mae=maeOf(r);if(r.mae==null&&r.hasil!=null)r.mae=Math.min(0,r.hasil);});return rows;}
/* statistik setiap kaedah + skor Untung×Selamat + keputusan */
function prStats(rows){const by={};rows.forEach(r=>{(by[r.kaedah]=by[r.kaedah]||[]).push(r);});
  return Object.entries(by).map(([k,a])=>{const v=a.map(r=>r.hasil).filter(x=>x!=null);const rugi=v.filter(x=>x<0);const ex=a.filter(r=>r.keluar);
    const exr=ex.filter(r=>(r.untung_akhir_pct??0)<0);
    const o={kaedah:k,n:a.length,win:v.length?v.filter(x=>x>0).length/v.length*100:null,avg:avgOf(v),med:median(v),worst:minOf(v),
      worstSaham:(a.find(r=>r.hasil===minOf(v))||{}).saham,gagal:v.length?rugi.length/v.length*100:null,avgRugi:rugi.length?avgOf(rugi):0,
      ex:ex.length,exrugi:exr.length,exrugiAvg:exr.length?avgOf(exr.map(r=>r.untung_akhir_pct)):null,hari:avgOf(a.map(r=>r.hari)),
      maeAvg:avgOf(a.map(r=>r.mae)),maeMin:minOf(a.map(r=>r.mae)),akaun:[...new Set(a.map(r=>r.akaun))].join('+'),luar:a.some(r=>r.sumber==='luar')};
    const U=0.6*clamp01(((o.avg??0)+5)/15)+0.4*((o.win??0)/100);
    const Sf=0.6*clamp01(1+(o.maeAvg??0)/10)+0.4*clamp01(1+(o.worst??0)/20);
    o.U=U;o.Sf=Sf;o.yakin=Math.min(1,o.n/PR_MIN_N);o.skor=Math.round(100*U*Sf*o.yakin);
    if(o.ex<PR_MIN_TUTUP)o.kep='BELUM CUKUP DATA';
    else if((o.avg??0)<=-3||(o.gagal??0)>=75||o.skor<25)o.kep='HENTIKAN';
    else if(o.skor>=55&&(o.avg??0)>0)o.kep='TERUSKAN';else o.kep='PERHATI';
    o.amaran=[];if(o.n>=3&&o.gagal>=60)o.amaran.push('Kadar gagal '+fx(o.gagal,0)+'%');if(o.worst!=null&&o.worst<=-8)o.amaran.push('Rugi '+sg2(o.worst)+' ('+(o.worstSaham||'')+')');
    if(o.exrugi>=3)o.amaran.push(o.exrugi+' keluar rugi');if(o.maeMin!=null&&o.maeMin<=-10)o.amaran.push('Turun '+sg2(o.maeMin));
    return o;});}
function prKpis(rows){const v=rows.map(r=>r.hasil).filter(x=>x!=null);const w=minOf(v);const wr=rows.find(r=>r.hasil===w)||{};
  const win=v.length?v.filter(x=>x>0).length/v.length*100:null;const a=avgOf(v),m=median(v);
  const ex=rows.filter(r=>r.keluar).length;const usd=v.length?v.reduce((t,x)=>t+x,0)/100*USD_POSISI:null;
  return `<div class="kpis kpis6">
    <div class="kpi"><div class="lbl" data-tip="jumlah_dag">Jumlah dagangan</div><div class="v">${rows.length}</div><div class="s">${ex} sudah keluar · ${rows.length-ex} dipegang</div></div>
    <div class="kpi"><div class="lbl" data-tip="win_p">Kadar menang</div><div class="v ${win>=50?'pos':'neg'}">${fx(win,0)}%</div><div class="s">${v.filter(x=>x>0).length} untung · ${v.filter(x=>x<0).length} rugi</div></div>
    <div class="kpi"><div class="lbl" data-tip="untung_purata">Untung purata</div><div class="v ${cls(a)}">${sg2(a)}</div><div class="s">Akhir bagi yang keluar, semasa bagi yang dipegang</div></div>
    <div class="kpi"><div class="lbl" data-tip="untung_median">Untung median</div><div class="v ${cls(m)}">${sg2(m)}</div><div class="s">Dagangan di tengah-tengah taburan</div></div>
    <div class="kpi"><div class="lbl" data-tip="kerugian_terbesar">Kerugian terbesar</div><div class="v neg">${sg2(w)}</div><div class="s">${esc(wr.saham||'–')} · ${esc(wr.kaedah||'')}${wr.akaun?' · '+wr.akaun:''}</div></div>
    <div class="kpi"><div class="lbl" data-tip="hari_purata">Purata hari dipegang</div><div class="v">${fx(avgOf(rows.map(r=>r.hari)),1)}</div><div class="s">hari dagangan</div></div>
    <div class="kpi"><div class="lbl" data-tip="usd_sama">Jika USD1,000 setiap posisi</div><div class="v ${cls(usd)}">${usd==null?'–':(usd<0?'−':'+')+'USD'+Math.abs(usd).toLocaleString('en-US',{maximumFractionDigits:0})}</div><div class="s">modal USD${(v.length*USD_POSISI).toLocaleString('en-US')} · ${sg2(a)} setiap posisi</div></div>
  </div>`;}
/* prestasi setiap gred: adakah gred A benar-benar lebih untung? */
function prGred(rows){const ada=rows.filter(adaGred);
  if(!ada.length)return `<div class="panel"><div class="panel-h"><h2 data-tip="gred">Prestasi ikut gred</h2><span class="sub">Gred direkod mulai belian 14 Okt 2026</span></div><p class="empty">Belum ada posisi bergred. Imbasan 8:02 malam mengira gred Sektor, Industri, RS, Pemangkin dan QR; belian 9:35 menyalinnya ke setiap posisi.</p></div>`;
  const out=[];GDIM.forEach(([k,,nama])=>{['A','B','C','D','E'].forEach(g=>{const a=ada.filter(r=>r[k]===g);if(!a.length)return;const v=a.map(r=>r.hasil).filter(x=>x!=null);const t=a.filter(r=>r.keluar);const vt=t.map(r=>r.untung_akhir_pct).filter(x=>x!=null);
    out.push({dim:nama,g,n:a.length,tutup:t.length,win:v.length?v.filter(x=>x>0).length/v.length*100:null,avg:avgOf(v),avgT:avgOf(vt),cukup:t.length>=PR_MIN_TUTUP});});});
  return `<div class="panel"><div class="panel-h"><h2 data-tip="gred">Prestasi ikut gred</h2><span class="sub">${ada.length} posisi bergred · gred pada hari isyarat · dinilai selepas ≥ ${PR_MIN_TUTUP} dagangan tertutup setiap gred</span></div>
    ${sortTable({id:'prg-'+S.tab+S.sub.prestasi,rows:out,cols:[
      {k:'dim',t:'Dimensi',l:1,v:o=>GDIM.findIndex(d=>d[2]===o.dim)*10+GORD[o.g],f:o=>`<b>${esc(o.dim)}</b>`},
      {k:'g',t:'Gred',l:1,v:o=>GORD[o.g],f:o=>grB(o.g)},
      {k:'n',t:'Posisi',f:o=>o.n},{k:'tutup',t:'Tertutup',f:o=>`${o.tutup}${o.cukup?'':'<span class="vv">belum cukup</span>'}`},
      {k:'win',t:'Kadar menang',tip:'win_p',f:o=>fx(o.win,0)+'%'},
      {k:'avg',t:'Untung purata',tip:'untung_purata',f:o=>`<b class="${cls(o.avg)}">${sg2(o.avg)}</b>`},
      {k:'avgT',t:'Untung akhir purata',tip:'untung_akhir',f:o=>o.avgT==null?'–':`<span class="${cls(o.avgT)}">${sg2(o.avgT)}</span>`}],def:{k:'dim',dir:1}})}
    <p class="sub" style="margin-top:8px">Bandingkan baris A dengan E dalam dimensi yang sama. Jika A tidak lebih untung selepas cukup data, gred itu tidak berguna untuk memilih saham. Bukti backtest 2019–2026: RS ≥ 90 mendahului setiap tahun; kekuatan sektor/industri tidak meramal.</p></div>`;}
/* carta bar mendatar: untung purata setiap kaedah, disusun */
function drawPrBars(box,st){
  const rows=[...st].filter(o=>o.avg!=null).sort((a,b)=>b.avg-a.avg);if(!rows.length){box.innerHTML='<p class="empty">Tiada data.</p>';return;}
  const W=Math.max(300,box.clientWidth||600),RH=22,bar=14,P={l:62,r:58,t:22,b:8},H=P.t+P.b+rows.length*RH;
  const lo=Math.min(0,...rows.map(o=>o.avg)),hi=Math.max(0,...rows.map(o=>o.avg));const span=(hi-lo)||1;
  const X=v=>P.l+(v-lo)/span*(W-P.l-P.r);const x0=X(0);
  const step=span>12?4:span>6?2:span>3?1:0.5;let g='<g class="grid">',t='';
  for(let v=Math.ceil(lo/step)*step;v<=hi+1e-9;v+=step){g+=`<line x1="${X(v)}" x2="${X(v)}" y1="${P.t-4}" y2="${H-P.b}"/>`;t+=`<text x="${X(v)}" y="${P.t-9}" text-anchor="middle">${v>0?'+':''}${+v.toFixed(1)}%</text>`;}g+='</g>';
  let m='';rows.forEach((o,i)=>{const y=P.t+i*RH+(RH-bar)/2,xa=X(o.avg),pos=o.avg>=0,w=Math.max(1.5,Math.abs(xa-x0));const x=pos?x0:x0-w;const r=Math.min(4,w/2);
    const f2=n=>(+n).toFixed(2),s=pos?1:-1,xs=pos?x0:x0;
    const path=`M${f2(xs)},${f2(y)}h${f2(s*(w-r))}a${f2(r)},${f2(r)} 0 0 ${pos?1:0} ${f2(s*r)},${f2(r)}v${f2(bar-2*r)}a${f2(r)},${f2(r)} 0 0 ${pos?1:0} ${f2(-s*r)},${f2(r)}h${f2(-s*(w-r))}Z`;
    m+=`<g class="hit" data-hk="${esc(o.kaedah)}"><rect x="0" y="${P.t+i*RH}" width="${W}" height="${RH}" fill="transparent"/><path d="${path}" fill="var(${pos?'--pos':'--neg'})"/>
      <text x="${P.l-8}" y="${y+bar-3}" text-anchor="end" style="fill:var(--fg-2);font-weight:600">${esc(o.kaedah)}</text>
      <text x="${pos?xa+6:xa-6}" y="${y+bar-3}" text-anchor="${pos?'start':'end'}" class="num" style="fill:var(--fg-2)">${sg2(o.avg)}</text>
      <title>${esc(o.kaedah)} · untung purata ${sg2(o.avg)} · ${o.n} dagangan · menang ${fx(o.win,0)}% · ${o.kep}</title></g>`;});
  m+=`<line x1="${x0}" x2="${x0}" y1="${P.t-4}" y2="${H-P.b}" stroke="var(--line-2)"/>`;
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="Untung purata setiap kaedah, disusun">${g}${m}${t}</svg>`;
}
/* kadar menang: donut keseluruhan + bar setiap kaedah (garis rujukan 50%) */
function drawPrDonut(box,rows){
  const v=rows.map(r=>r.hasil).filter(x=>x!=null);const w=v.filter(x=>x>0).length,l=v.filter(x=>x<0).length,z=v.length-w-l;
  if(!v.length){box.innerHTML='<p class="empty">Tiada data.</p>';return;}
  const R=62,r0=42,C=80,parts=[[w,'--pos','Untung'],[l,'--neg','Rugi'],[z,'--muted','Rata']].filter(p=>p[0]>0);let a=-Math.PI/2,arcs='';
  parts.forEach(([n,c,t])=>{const da=n/v.length*Math.PI*2;const a2=a+da-(parts.length>1?0.012:0);const lg=da>Math.PI?1:0;
    const p=(ang,rad)=>[(C+rad*Math.cos(ang)).toFixed(2),(C+rad*Math.sin(ang)).toFixed(2)];
    if(parts.length===1){arcs+=`<circle cx="${C}" cy="${C}" r="${(R+r0)/2}" fill="none" stroke="var(${c})" stroke-width="${R-r0}"><title>${t}: ${n}</title></circle>`;}
    else{const [x1,y1]=p(a,R),[x2,y2]=p(a2,R),[x3,y3]=p(a2,r0),[x4,y4]=p(a,r0);
    arcs+=`<path d="M${x1},${y1}A${R},${R} 0 ${lg} 1 ${x2},${y2}L${x3},${y3}A${r0},${r0} 0 ${lg} 0 ${x4},${y4}Z" fill="var(${c})"><title>${t}: ${n} (${(n/v.length*100).toFixed(0)}%)</title></path>`;}a+=da;});
  box.innerHTML=`<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 160 160" width="150" height="150" role="img" aria-label="Kadar menang keseluruhan ${(w/v.length*100).toFixed(0)}%">${arcs}<text x="80" y="80" text-anchor="middle" style="fill:var(--fg);font-size:24px;font-weight:700" class="num">${(w/v.length*100).toFixed(0)}%</text><text x="80" y="99" text-anchor="middle" style="font-size:11px">menang</text></svg>
    <div class="legend" style="display:grid;gap:6px;margin:0"><span><i style="background:var(--pos)"></i>Untung <b class="num" style="color:var(--fg)">${w}</b></span><span><i style="background:var(--neg)"></i>Rugi <b class="num" style="color:var(--fg)">${l}</b></span>${z?`<span><i style="background:var(--muted)"></i>Rata <b class="num" style="color:var(--fg)">${z}</b></span>`:''}<span>${v.length} dagangan</span></div></div>`;
}

/* scatter untung vs penurunan maksimum, kuadran Untung & Selamat */

const legendKpt=()=>`<div class="legend">${Object.keys(KPT).map(k=>`<span><svg width="12" height="12" viewBox="0 0 12 12" style="vertical-align:-1px;margin-right:5px" fill="var(${KPT[k].c})">${shapeAt(k,6,6,4.5)}</svg>${k}</span>`).join('')}<span>saiz = bilangan dagangan</span></div>`;
function teruk(list,title,tip,val,fmt,bad,sub){
  return `<div class="worst"><div class="lbl" data-tip="${tip}" style="margin-bottom:8px">${title}</div>${list.length?list.map((o,i)=>`<div class="wrow"><span class="rkn">${i+1}</span><b>${esc(o.kaedah)}</b><span class="mut wsub">${sub(o)}</span><span class="num ${bad(o)?'neg':''}" style="margin-left:auto;font-weight:600">${fmt(val(o))}</span>${bad(o)?'<span class="pill p-exit" title="Amaran">⚠ AMARAN</span>':''}</div>`).join(''):'<p class="mut" style="margin:0">Tiada</p>'}</div>`;}
function renderPrestasi(which){
  const el=$('#v-pr-'+which);const src=prSrc(which);
  const nama=which==='m'?'Papertrade M':which==='c'?'Papertrade C':'Combine (M + C)';
  if(!src.length){el.innerHTML=`<div class="panel empty">${S.live?nama+': belum ada posisi dalam pangkalan data.':'Memuatkan posisi…'}</div>`;return;}
  const pf=S.prf||(S.prf={minN:1});
  const all=prStats(src);const st=all.filter(o=>o.n>=pf.minN);
  const cnt={TERUSKAN:0,PERHATI:0,HENTIKAN:0,'BELUM CUKUP DATA':0};all.forEach(o=>cnt[o.kep]++);
  const best=[...all].filter(o=>o.kep==='TERUSKAN').sort((a,b)=>b.skor-a.skor);
  const top=best[0]||[...all].filter(o=>o.ex>=PR_MIN_TUTUP).sort((a,b)=>b.skor-a.skor)[0];
  const elig=all.filter(o=>o.n>=3);
  const W1=[...elig].sort((a,b)=>b.gagal-a.gagal||a.avg-b.avg).slice(0,5);
  const W2=[...elig].filter(o=>o.avgRugi<0).sort((a,b)=>a.avgRugi-b.avgRugi).slice(0,5);
  const W3=[...all].filter(o=>o.worst<0).sort((a,b)=>a.worst-b.worst).slice(0,5);
  const W4=[...all].filter(o=>o.exrugi>0).sort((a,b)=>b.exrugi-a.exrugi||a.exrugiAvg-b.exrugiAvg).slice(0,5);
  const nAm=all.filter(o=>o.amaran.length).length;
  const maeAda=!!(S.mae&&S.mae.rows);
  const fb=ptFilterBar('pr'+which,src);const trows=fb.apply(src);
  el.innerHTML=`
  <p class="headline">${nama}: <b>${src.length}</b> dagangan dalam <b>${all.length}</b> kaedah. ${top?`Calon terbaik setakat ini: <b>${esc(top.kaedah)}</b> (skor ${top.skor}, untung purata ${sg2(top.avg)}, penurunan maks purata ${sg2(top.maeAvg)}). `:''}<b class="pos">${cnt.TERUSKAN}</b> TERUSKAN · <b style="color:var(--warn)">${cnt.PERHATI}</b> PERHATI · <b class="neg">${cnt.HENTIKAN}</b> HENTIKAN · <b class="mut">${cnt['BELUM CUKUP DATA']}</b> belum cukup data (label hanya diberi selepas ≥ ${PR_MIN_TUTUP} dagangan tertutup setiap kaedah).</p>
  ${prKpis(src)}
  ${prGred(src)}
  <div class="filters"><span class="lbl" data-tip="min_n">Minimum dagangan setiap kaedah</span>
    <div class="seg" id="prMin${which}">${[1,3,5,10].map(n=>`<button type="button" data-v="${n}" aria-pressed="${pf.minN===n}">${n===1?'Semua':'≥ '+n}</button>`).join('')}</div>
    <span class="mut" style="font-size:.82rem">${st.length} daripada ${all.length} kaedah dipapar dalam carta & jadual kaedah</span></div>
  <div class="grid2 eq">
    <div class="panel"><div class="panel-h"><h2>Untung purata setiap kaedah</h2><span class="sub">Disusun · hijau untung, merah rugi</span></div><div class="chartbox scrolly" id="prBar${which}"></div></div>
    <div class="panel"><div class="panel-h"><h2>Untung lawan risiko</h2><span class="sub">Kanan atas = untung & selamat · ketik titik</span></div><div class="chartbox" id="prSc${which}"></div>${legendKpt()}
      <p class="sub" style="margin-top:6px">Risiko = purata penurunan maksimum setiap dagangan (harga rendah terendah sejak beli ÷ harga beli − 1)${maeAda?' · '+esc(S.mae.harga_hingga||''):' · anggaran daripada untung semasa (data harga rendah belum dimuat)'}.</p></div>
  </div>
  <div class="grid2">
    <div class="panel"><div class="panel-h"><h2>Kadar menang setiap kaedah</h2><span class="sub">Teal ≥ 50% · ungu &lt; 50% · garis kuning = 50% · angka kecil = dagangan</span></div><div class="chartbox scrolly" id="prWin${which}"></div></div>
    <div class="panel"><div class="panel-h"><h2 data-tip="win_p">Kadar menang keseluruhan</h2><span class="sub">Semua dagangan dalam tab ini</span></div><div id="prDn${which}"></div></div>
  </div>
  <div class="panel danger"><div class="panel-h"><h2>Paling Teruk · pantau kegagalan</h2><span class="sub">${nAm?`<span class="pill p-exit">⚠ ${nAm} kaedah beramaran</span>`:'Tiada amaran'} · kadar gagal & kerugian purata perlukan ≥ 3 dagangan</span></div>
    <div class="worstgrid">
      ${teruk(W1,'Kadar gagal tertinggi','kadar_gagal',o=>o.gagal,v=>fx(v,0)+'%',o=>o.gagal>=60,o=>o.n+' dag')}
      ${teruk(W2,'Kerugian purata terburuk','kerugian_purata',o=>o.avgRugi,sg2,o=>o.avgRugi<=-5,o=>fx(o.gagal,0)+'% gagal')}
      ${teruk(W3,'Kerugian terbesar','kerugian_terbesar',o=>o.worst,sg2,o=>o.worst<=-8,o=>esc(o.worstSaham||''))}
      ${teruk(W4,'Isyarat keluar rugi','keluar_rugi',o=>o.exrugi,v=>v+'×',o=>o.exrugi>=3,o=>'purata '+sg2(o.exrugiAvg))}
    </div></div>
  <div class="panel"><div class="panel-h"><h2>Kedudukan kaedah · Skor Untung×Selamat</h2><span class="sub">Ketik tajuk lajur untuk susun · hover Keputusan untuk peraturan</span></div>
    ${sortTable({id:'prk-'+which,rows:st,def:{k:'skor',dir:-1},attr:o=>`data-hk="${esc(o.kaedah)}"`,cols:[
      {k:'kaedah',t:'Kaedah',tip:'kaedah_pt',l:1,frz:1,f:(o,i)=>`<span class="rkn">${i+1}</span><b>${esc(o.kaedah)}</b>${o.amaran.length?` <span class="pill p-exit" title="${esc(o.amaran.join(' · '))}">⚠</span>`:''}<span class="vv">${o.akaun}${o.luar?' · luar 87 M':''}</span>`,c:()=>'tk'},
      {k:'kep',t:'Keputusan',tip:'keputusan_pr',l:1,v:o=>KPT_ORD[o.kep],f:o=>kptPill(o.kep)},
      {k:'skor',t:'Skor U×S',tip:'skor_us',f:o=>`<span class="skbar"><span><i style="width:${o.skor}%"></i></span><b>${o.skor}</b></span><span class="vv">U ${fx(o.U*100,0)} · S ${fx(o.Sf*100,0)}${o.yakin<1?' · ×'+fx(o.yakin,1):''}</span>`},
      {k:'n',t:'Dagangan',tip:'jumlah_dag',f:o=>o.n},
      {k:'win',t:'Kadar menang',tip:'win_p',f:o=>fx(o.win,0)+'%'},
      {k:'avg',t:'Untung purata',tip:'untung_purata',f:o=>`<b class="${cls(o.avg)}">${sg2(o.avg)}</b>`},
      {k:'med',t:'Median',tip:'untung_median',f:o=>`<span class="${cls(o.med)}">${sg2(o.med)}</span>`},
      {k:'worst',t:'Kerugian terbesar',tip:'kerugian_terbesar',f:o=>`<span class="${cls(o.worst)}">${sg2(o.worst)}</span><span class="vv">${esc(o.worstSaham||'')}</span>`},
      {k:'maeAvg',t:'Penurunan maks purata',tip:'penurunan_maks',f:o=>`<span class="${cls(o.maeAvg)}">${sg2(o.maeAvg)}</span><span class="vv">terburuk ${sg2(o.maeMin)}</span>`},
      {k:'gagal',t:'Kadar gagal',tip:'kadar_gagal',f:o=>`<span class="${o.gagal>=60?'neg':''}">${fx(o.gagal,0)}%</span>`},
      {k:'exrugi',t:'Keluar rugi',tip:'keluar_rugi',f:o=>o.exrugi?`<span class="${o.exrugi>=3?'neg':''}">${o.exrugi}</span><span class="vv">daripada ${o.ex} keluar</span>`:'–'},
      {k:'hari',t:'Hari purata',tip:'hari_purata',f:o=>fx(o.hari,1)}]})}
  </div>
  <div class="panel"><div class="panel-h"><h2>Semua dagangan</h2><span class="sub">${trows.length} dagangan · lajur sama seperti Paper Trade M / Papertrade C${which==='gab'?' · M/C di bawah simbol':''}</span></div>
    ${fb.html}${sortTable({id:'prall-'+which,rows:trows,cols:ptCols(which==='gab'),def:{k:'untung_pct',dir:-1},limit:pf['shown'+which]||100,rcls:r=>r.keluar?'exit':'',
      foot:(n,t)=>`<div class="tablefoot"><span>${n} daripada ${t} dagangan</span>${t>n?`<button type="button" class="more" id="prMore${which}">Papar 100 lagi</button>`:''}</div>`})}</div>
  <div class="strip"><b class="t">Cara baca</b><span>Pilih kaedah yang <b>TERUSKAN</b> dan berada dalam kuadran <b>Untung & Selamat</b>. Kaedah berlencana <b class="neg">⚠ AMARAN</b> perlu disemak: kadar gagal tinggi, satu kerugian besar, atau banyak isyarat keluar rugi. Label diberi hanya selepas ≥ 20 dagangan tertutup setiap kaedah; sebelum itu BELUM CUKUP DATA.</span></div>
  <div class="foot"><span>Kiraan langsung daripada papertrade/moomoo + papertrade/claude${maeAda?' · penurunan maks: prestasi/mae ('+esc(S.mae.dibina||'')+')':''}</span><span>Tiada order · tiada wang sebenar</span></div>`;
  drawPrBars($('#prBar'+which),st);drawPrScatter($('#prSc'+which),st);drawPrWin($('#prWin'+which),st);drawPrDonut($('#prDn'+which),src);
  const sg=$('#prMin'+which);sg.onclick=e=>{const b=e.target.closest('button');if(!b)return;pf.minN=+b.dataset.v;renderAll();};
  fb.bind();const mb=$('#prMore'+which);if(mb)mb.onclick=()=>{pf['shown'+which]=(pf['shown'+which]||100)+100;renderAll();};
  el.querySelectorAll('[data-hk]').forEach(n=>n.addEventListener('click',e=>{if(e.target.closest('th'))return;const k=n.dataset.hk;const s=S['pf_pr'+which];s.k=k;s.q='';renderAll();
    requestAnimationFrame(()=>{const t=document.querySelector(`#v-pr-${which} table[data-st="prall-${which}"]`);if(t)t.closest('.panel').scrollIntoView({behavior:'smooth',block:'start'});});toast('Jadual dagangan ditapis: '+k);}));

function emptyState(){return `<div class="panel empty">${S.live?'Belum ada keputusan backtest dalam pangkalan data.':'Memuatkan keputusan backtest…'}</div>`;}
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,1800);}
function topScrolls(root){
  root.querySelectorAll('.tablewrap').forEach(w=>{
    const prev=w.previousElementSibling;if(prev&&prev.classList.contains('topscroll'))prev.remove();
    const hs=[...w.querySelectorAll('thead th')].map(h=>(h.textContent||'').replace(/[↕↓↑]/g,'').trim());
    w.querySelectorAll('tbody tr').forEach(tr=>{let c=0;[...tr.children].forEach(td=>{td.setAttribute('data-label',hs[c]||'');c+=td.colSpan||1;});});
  });
}
const R={ringkasan:renderRingkasan,papan:renderPapan,banding:renderBanding,sektor:renderSektor,watch:renderWatch,ptm:renderPtm,ptc:renderPtc,'pr-m':()=>renderPrestasi('m'),'pr-c':()=>renderPrestasi('c'),'pr-gab':()=>renderPrestasi('gab')};
function renderAll(){const vid=viewId();const el=document.getElementById(vid);
  const sx={};el.querySelectorAll('table[data-st]').forEach(t=>{sx[t.dataset.st]=t.parentElement.scrollLeft;});
  R[vid.slice(2)]();applyFold(el);applyTips(el);
  requestAnimationFrame(()=>{topScrolls(el);el.querySelectorAll('table[data-st]').forEach(t=>{if(sx[t.dataset.st])t.parentElement.scrollLeft=sx[t.dataset.st];});});}
let rz,lw=window.innerWidth;window.addEventListener('resize',()=>{if(Math.abs(window.innerWidth-lw)<40)return;lw=window.innerWidth;clearTimeout(rz);rz=setTimeout(renderAll,200);});

  kadar_gagal:{t:'Kadar gagal',d:'Peratus dagangan kaedah itu yang sedang rugi atau keluar dengan rugi.',e:'4 rugi daripada 5 = 80%. Amaran jika ≥ 60% (≥ 3 dagangan).'},

  keluar_rugi:{t:'Isyarat keluar rugi',d:'Bilangan posisi yang kena isyarat keluar kaedah (henti rugi, isyarat jual) dengan untung akhir negatif. Amaran jika ≥ 3.',e:''},
  penurunan_maks:{t:'Penurunan maksimum',d:'Bagi setiap dagangan: harga rendah terendah sejak hari beli (hingga hari ini atau hingga keluar) ÷ harga beli − 1. Purata = risiko biasa yang ditanggung; terburuk = satu kejatuhan paling dalam. Lebih hampir 0 = lebih selamat.',e:'Beli 100, pernah jatuh ke 94 = −6%, walaupun kini untung.'},
  skor_us:{t:'Skor Untung×Selamat (0–100)',d:'Skor = 100 × U × S. U (untung) = 0.6 × untung purata dipetakan −5%→0 hingga +10%→1, + 0.4 × kadar menang. S (selamat) = 0.6 × penurunan maks purata dipetakan −10%→0 hingga 0%→1, + 0.4 × kerugian terbesar dipetakan −20%→0 hingga 0%→1. Tinggi hanya jika KEDUA-DUANYA baik. Kaedah dengan kurang daripada 5 dagangan didarab n/5 (keyakinan rendah).',e:'U 0.8 × S 0.9 = 72; jika hanya 2 dagangan: 72 × 0.4 = 29.'},
  keputusan_pr:{t:'Keputusan (TERUSKAN / PERHATI / HENTIKAN)',d:'BELUM CUKUP DATA: kurang daripada 20 dagangan tertutup (sudah keluar). Selepas ≥ 20: HENTIKAN jika untung purata ≤ −3% ATAU kadar gagal ≥ 75% ATAU skor < 25; TERUSKAN jika skor ≥ 55 dan untung purata positif; selainnya PERHATI. Keputusan papertrade sahaja, bukan isyarat wang sebenar.',e:'▲ TERUSKAN · ● PERHATI · ✕ HENTIKAN · ○ BELUM CUKUP DATA (bentuk berbeza dalam carta).'},
  g_s:{t:'S · Sektor',d:'Kekuatan sektor saham itu berbanding seluruh pasaran AS pada hari isyarat: skor 0–100 daripada prestasi 1 minggu, 1 bulan dan 3 bulan, breadth dan kekuatan relatif. A ≥ 80, B ≥ 60, C ≥ 40, D ≥ 20, E < 20. Skor ialah kedudukan kekuatan, bukan peratus untung. Baris "1B kini" ialah prestasi median sektor sebulan menurut tab Sector hari ini.',e:'A 88/100 · Technology · 1B kini +4.1% = sektor antara terkuat semasa isyarat.'},
  g_i:{t:'I · Industri',d:'Kekuatan industri saham itu (lebih sempit daripada sektor) berbanding seluruh pasaran AS pada hari isyarat, skor 0–100 dengan sempadan sama seperti Sektor: A ≥ 80, B ≥ 60, C ≥ 40, D ≥ 20, E < 20.',e:'B 73/100 · Semiconductors = industri kuat, tetapi bukan teratas.'},
  g_r:{t:'R · RS rating',d:'Kekuatan relatif harga saham (gaya IBD, 1–99) berbanding semua saham dalam stor harga: 40% pulangan 3 bulan terkini + 20% setiap satu daripada tiga suku sebelumnya. RS 92 ("atasi 92%") bermaksud saham ini lebih kuat daripada 92% saham lain. A ≥ 90, B ≥ 80, C ≥ 60, D ≥ 40, E < 40. Ujian 2019–2026: RS ≥ 90 purata +4.2% dalam 21 hari, lawan +1.6–2.2% bagi gred lain.',e:'RS 92 = lebih kuat daripada 92% saham.'},
  g_p:{t:'P · Pemangkin',d:'Ada atau tidak sebab baharu saham bergerak, dalam 10 hari terakhir: berita (naik taraf/turun taraf analisis, sasaran harga, kontrak, kelulusan), reaksi harga selepas earnings terakhir, volum luar biasa dan aliran institusi. Mata: A ≥ 4, B 3, C 1–2, D 0, E negatif. Ketik tajuk berita untuk membuka artikel.',e:'"2 berita positif; earnings 5 hari lalu +6.0%" dengan pautan berita = pemangkin kuat (A).'},
  g_q:{t:'Q · Laporan suku (QR)',d:'Bilangan hari dagangan sebelum laporan suku (earnings) seterusnya. Harga boleh melonjak atau jatuh mendadak pada hari laporan, dan pegangan biasa ±20 hari. Selamat: lebih 15 hari atau tiada laporan dalam 30 hari (A, B). Berhati-hati: 11–15 hari (C). Elak: 10 hari atau kurang (D, E). Label ini maklumat sahaja, bukan penapis belian.',e:'E · 4 hari lagi · 20 Okt · Elak = laporan jatuh dalam tempoh pegangan.'},
  gred:{t:'Gred keseluruhan',d:'Purata mata lima dimensi pada hari isyarat (A=4, B=3, C=2, D=1, E=0): Sektor, Industri, RS, Pemangkin dan QR. Dimensi tanpa data tidak dikira. Direkod untuk diuji, belum terbukti meramal dan bukan penapis belian. Panel Prestasi ikut gred menilai setiap gred selepas ≥ 20 dagangan tertutup.',e:'Sektor B, Industri A, RS A, Pemangkin C, QR A = purata 3.4 → gred B.'},
  usd_sama:{t:'Nilai sama USD1,000',d:'Untung bersih jika setiap posisi bernilai USD1,000 (sama berat), tanpa mengira harga saham. Rekod tetap 1 unit; ini cara kiraan sahaja supaya saham mahal tidak mendominasi.',e:'3 posisi +10%, −5%, +2% = +USD70 atas modal USD3,000.'},
  data_kini:{t:'Kesegaran data',d:'Tarikh tutup sesi AS yang dipakai dan masa kemas kini 6:02 pagi terakhir (harian/status). Merah jika larian 6:02 pagi terkini belum berjaya.',e:''},
  slot_c:{t:'Slot Claude',d:'Posisi maya Claude bagi kaedah itu: dipegang (belum keluar) dan jumlah semua (termasuk yang sudah keluar). Tiada had.',e:''}
};
const TIPLBL={'kaedah / varian':'kaedah','keputusan':'keputusan','skor':'skor','jumlah untung':'jumlah','cagr':'cagr','kadar menang':'win','jumlah entry':'n','untung/dagangan':'avg','purata menang':'avgwin','purata untung':'avgwin','purata kalah':'avgloss','purata rugi':'avgloss','menang:kalah':'nisbah','hari pegang':'days','purata hari pegang':'days','untung/hari':'harian','mdd':'mdd','mar':'mar','tutup ≥ +10%':'ret10','sentuh +10%':'hit10','bulan ≥ +10%':'bulan10','bulan untung':'bulan_untung','faktor untung':'pf','dagangan setahun':'dagangan_setahun','separuh 1 (2019–22)':'h1','separuh 2 (2023–)':'h2','tahun atasi spy':'thn_kalah_spy','dagangan terburuk':'terburuk','atasi beli semua':'menang_ew','profil pegangan':'pegang','set saham':'set'};
const tipEl=document.createElement('div');tipEl.className='tip';tipEl.hidden=true;tipEl.setAttribute('role','tooltip');document.body.appendChild(tipEl);
function applyTips(root){if(!root)return;
  root.querySelectorAll('[data-tip]').forEach(el=>el.classList.add('has-tip'));
  root.querySelectorAll('.m .k, h2').forEach(el=>{if(el.dataset.tip)return;const k=TIPLBL[(el.textContent||'').trim().toLowerCase()];if(k&&TIPS[k]){el.dataset.tip=k;el.classList.add('has-tip');}});}
function showTip(el){const T=TIPS[el.dataset.tip];if(!T)return;
  tipEl.innerHTML=`<div class="tip-h">${esc(T.t)}</div><div class="tip-b">${esc(T.d)}</div>${T.e?`<div class="tip-e"><b>Contoh:</b> ${esc(T.e)}</div>`:'<div style="height:6px"></div>'}`;
  tipEl.hidden=false;const r=el.getBoundingClientRect(),W=tipEl.offsetWidth,H=tipEl.offsetHeight,vw=document.documentElement.clientWidth,vh=window.innerHeight;
  let x=Math.min(Math.max(8,r.left+r.width/2-W/2),vw-W-8),y=r.bottom+8;if(y+H>vh-8)y=Math.max(8,r.top-H-8);
  tipEl.style.left=x+'px';tipEl.style.top=y+'px';}
function hideTip(){tipEl.hidden=true;}
let tipTimer=null,tipSuppress=false;
document.addEventListener('mouseover',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el)showTip(el);});
document.addEventListener('mouseout',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el&&!el.contains(e.relatedTarget))hideTip();});
document.addEventListener('focusin',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el)showTip(el);});
document.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')return;const el=e.target.closest&&e.target.closest('[data-tip]');hideTip();if(!el)return;tipTimer=setTimeout(()=>{tipSuppress=true;showTip(el);},450);},true);
['pointerup','pointercancel','pointermove'].forEach(ev=>document.addEventListener(ev,e=>{if(ev==='pointermove'&&e.pointerType==='touch'&&tipTimer&&(Math.abs(e.movementX)+Math.abs(e.movementY))<3)return;clearTimeout(tipTimer);tipTimer=null;},true));
document.addEventListener('click',e=>{if(tipSuppress){tipSuppress=false;e.preventDefault();e.stopPropagation();}},true);
window.addEventListener('scroll',hideTip,{passive:true});
$('#setLbl').dataset.tip='set';$('#setLbl').classList.add('has-tip');

/* ================= lipat / buka panel ================= */
let foldState={};try{foldState=JSON.parse(localStorage.getItem('pbs2_fold')||'{}');}catch(e){}
const foldKey=p=>{const h=p.querySelector(':scope>.panel-h h2');return (viewId()+'|'+(h?h.textContent:'')).toLowerCase();};
function saveFold(){try{localStorage.setItem('pbs2_fold',JSON.stringify(foldState));}catch(e){}}
function applyFold(root){root.querySelectorAll('.panel').forEach(p=>{const h=p.querySelector(':scope>.panel-h');if(!h||p.closest('.sheet'))return;
  h.classList.add('foldable');h.setAttribute('role','button');h.setAttribute('tabindex','0');const shut=!!foldState[foldKey(p)];p.classList.toggle('lipat',shut);h.setAttribute('aria-expanded',String(!shut));});}
function toggleFold(p){const k=foldKey(p);const shut=!p.classList.contains('lipat');foldState[k]=shut;saveFold();p.classList.toggle('lipat',shut);p.querySelector(':scope>.panel-h').setAttribute('aria-expanded',String(!shut));if(!shut)requestAnimationFrame(()=>topScrolls(p));}
document.addEventListener('click',e=>{const h=e.target.closest&&e.target.closest('.panel-h.foldable');if(!h)return;if(e.target.closest('button,a,input,select'))return;toggleFold(h.parentElement);});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('foldable')){e.preventDefault();toggleFold(e.target.parentElement);}});
function foldAllNow(shut){const v=document.getElementById(viewId());v.querySelectorAll('.panel').forEach(p=>{if(!p.querySelector(':scope>.panel-h'))return;foldState[foldKey(p)]=shut;p.classList.toggle('lipat',shut);});saveFold();if(!shut)requestAnimationFrame(()=>topScrolls(v));}
$('#foldAll').onclick=()=>foldAllNow(true);$('#openAll').onclick=()=>foldAllNow(false);

renderNav();renderAll();

/* ================= data langsung ================= */
(async function connect(){
  const db=window.claude?.use?await window.claude.use('db'):null;
  if(!db){setLive(false,'Data langsung tidak tersedia di paparan ini');S.live=true;renderAll();return;}
  const re=(...tabs)=>{if(!tabs.length||tabs.includes(S.tab))renderAll();};
  db.collection('registry').limit(1000).onSnapshot(snap=>{
    const d={};snap.docs.forEach(x=>{if(!x.exists)return;const v=x.data();d[x.id]=Object.assign({},v,{rows:(v.rows||[]).map(r=>Object.assign({},r,{jumlah:jumlahDari(r.cagr),nisbah:(r.avgwin!=null&&r.avgloss<0)?r.avgwin/-r.avgloss:null,harian:(r.avg!=null&&r.days>0)?r.avg/r.days:null}))});});S.docs=d;
    const ts=Object.values(d).map(x=>x.tarikh||'').sort().pop()||'';S.live=true;
    setLive(true,`Langsung · ${snap.size} kaedah · ujian terkini ${ts}`);re('backtest');
  },()=>setLive(false,'Sambungan terputus. Muat semula halaman.'));
  db.doc('meta/info').onSnapshot(s=>{S.meta=s.exists?s.data():null;re('backtest');},()=>{});
  const sub=(path,keyName,tabs)=>db.doc(path).onSnapshot(s=>{S[keyName]=s.exists?s.data():null;S.live=true;re(...tabs);},()=>{});
  sub('papertrade/moomoo','ptm',['ptm','prestasi']);
  sub('papertrade/moomoo_peta','ptmPeta',['ptm','prestasi']);
  sub('papertrade/claude','ptc',['ptc','prestasi']);
  sub('papertrade/claude_2','ptc2',['ptc','prestasi']);
  sub('papertrade/claude_3','ptc3',['ptc','prestasi']);
  sub('papertrade/claude_4','ptc4',['ptc','prestasi']);
  sub('papertrade/claude_5','ptc5',['ptc','prestasi']);
  sub('papertrade/claude_6','ptc6',['ptc','prestasi']);
  sub('papertrade/watchlist','watch',['watch','sektor']);
  sub('papertrade/senarai_beli','beli',['ptc']);
  sub('sektor/snapshot','sektor',['sektor']);
  db.doc('harian/status').onSnapshot(s=>{S.hst=s.exists?s.data():null;renderData();},()=>{});
  sub('prestasi/mae','mae',['prestasi']);
})();
})();
