<style>
/* Susun atur: konsol terminal satu lajur; pengepala melekit (tab utama + sub-tab), paparan bertab, helaian bawah untuk butiran.
   Gaya SST Terminal: navy gelap sahaja (pilihan sengaja, satu tema). */
:root{
  color-scheme:dark;
  --bg:#0b1220; --surface:#0f172a; --card:#111a2e; --sunk:#0c1526; --line:#1f2a40; --line-2:#2a3852;
  --fg:#e2e8f0; --fg-2:#cbd5e1; --muted:#8a9ab3;
  --accent:#2dd4bf; --accent-soft:rgba(45,212,191,.12); --violet:#8b5cf6; --violet-soft:rgba(139,92,246,.16);
  --pos:#22c55e; --pos-soft:rgba(34,197,94,.14); --neg:#ef4444; --neg-soft:rgba(239,68,68,.13); --neg-tx:#f87171; --warn:#f59e0b; --warn-soft:rgba(245,158,11,.14);
  --guna:#22c55e; --guna-bg:rgba(34,197,94,.15); --uji:#f59e0b; --uji-bg:rgba(245,158,11,.15); --simpan:#60a5fa; --simpan-bg:rgba(96,165,250,.15); --tolak:#ef4444; --tolak-bg:rgba(239,68,68,.14);
  --ref:#eab308;
  /* sebab keluar: slot kategori 1–4 (disahkan validator dataviz pada permukaan kad) */
  --k1:#3987e5; --k2:#d95926; --k3:#199e70; --k4:#c98500;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:8px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:16px}
body{margin:0;background:radial-gradient(1200px 500px at 80% -10%,rgba(45,212,191,.06),transparent 60%),var(--bg);background-color:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:'cv11','ss01'}
div.wrap{max-width:none;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
/* jalur di atas pengepala melekit (kawasan selamat telefon) */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.num{font-variant-numeric:tabular-nums lining-nums}
a{color:var(--accent)}
button{font-family:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,tr:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* pengepala */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));padding:12px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mk{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--violet));flex:none}
h1{font-size:1.2rem;font-weight:800;letter-spacing:-.01em;margin:0;text-wrap:balance}
.live{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted)}
.live{flex-wrap:wrap;row-gap:2px}
.gr{display:inline-block;min-width:1.45em;text-align:center;border-radius:4px;font-weight:700;font-size:.7rem;line-height:1.5;padding:0 3px;margin:0 2px 2px 0}
.gr small{font-weight:500;opacity:.75;margin-right:1px}
.nw{white-space:nowrap}
/* jadual bergred: angka dan perkataan tidak dipecah; tiada skrol mendatar (lajur kurang penting disembunyi oleh muatLajur) */
.tablewrap.tw-grd{overflow-x:visible}.tablewrap.tw-grd td,.tablewrap.tw-grd th{overflow-wrap:break-word;padding-inline:4px}
/* Syarat belum cukup (watchlist penuh, .syr) 250px. Pemangkin (.grp) dan Kewangan (.grk) sama lebar 230px di desktop:
   teks pemangkin maksimum 3 baris, pautan berita 1 baris (teks penuh dalam title) */
td.grd{min-width:0}.tablewrap.tw-grd td.wrap{min-width:150px}.tablewrap.tw-grd td.syr{min-width:250px}td.grd .vv{font-size:.72rem}.tablewrap td .nw{white-space:nowrap}
@media (min-width:761px){.tablewrap.tw-grd td.grp,.tablewrap.tw-grd td.grk{width:230px;min-width:230px;max-width:230px}}
td.grp .grc,td.grk .grc{display:flex;width:100%}td.grp .grt,td.grk .grt{flex:1 1 auto}
td.grp .pmt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}td.grp a.berita{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grc{display:inline-flex;gap:8px;align-items:center;text-align:left;vertical-align:middle}
.grc>.gr{flex:none;display:flex;align-items:center;justify-content:center;min-width:2em;height:2.1em;margin:0;padding:0 6px;font-size:1.05rem;border-radius:6px}
.lrk{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px}.lrb{flex:none;display:flex;align-items:center;justify-content:center;height:1.8em;padding:0 7px;border-radius:6px;font-weight:700;font-size:.72rem;letter-spacing:.02em}.lrp{font-size:1.05rem;line-height:1.2;white-space:nowrap}.lrk b.lrp.pos{color:var(--pos)}.lrk b.lrp.neg{color:var(--neg)}.lrk b.lrp.mut{color:var(--muted)}
.grt{min-width:0;display:flex;flex-direction:column;justify-content:center}.grt b{color:var(--fg)}.grt .pill{align-self:flex-start}
/* sub-gred kewangan: label K U T S di atas cip */
.kskor{display:flex;gap:4px;align-self:flex-start;margin-bottom:3px}.kskor>span{display:flex;flex-direction:column;align-items:center;gap:1px}.kskor small{font-size:.6rem;line-height:1.1;font-weight:600;color:var(--muted)}.kskor .gr{margin:0}
td.grd{text-align:center;vertical-align:middle}
@media (min-width:761px){td.kdh{width:1%;max-width:76px;white-space:normal}td.kdh .vv{white-space:normal;overflow-wrap:normal}}
td.ctr,th.ctr,th[data-tip="hari_watch"],th[data-tip="hari_pt"]{text-align:center}
.tablewrap.tw-grd td{vertical-align:middle}
.tablewrap.tw-grd th[data-tip^="g_"],.tablewrap.tw-grd th[data-tip="gred"]{text-align:center}
/* 28 Okt 2026 (permintaan pengguna "align betul betul"): di desktop sel gred dijajar KIRI supaya cip A–E setiap baris
   bermula pada x yang sama; sel bertengah membuat cip bergoyang ikut panjang teks */
@media (min-width:761px){
  .tablewrap td.grd,.tablewrap td.gks,.tablewrap.tw-grd th[data-tip^="g_"],.tablewrap.tw-grd th[data-tip="gred"]{text-align:left}
  .tablewrap td.grd .grc,.tablewrap td.gks .grc{width:100%}
  .tablewrap td.tk{white-space:nowrap}   /* simbol + lencana akaun/earnings kekal satu baris */
}
td.grd .vv.nm1{white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;max-width:110px;overflow-wrap:normal}
a.berita{color:var(--accent);text-decoration:none;margin-top:2px}a.berita:hover{text-decoration:underline}
.g-A{background:var(--pos-soft);color:var(--pos)}.g-B{background:var(--accent-soft);color:var(--accent)}.g-C{background:var(--sunk);color:var(--fg-2);box-shadow:inset 0 0 0 1px var(--line)}.g-D{background:var(--warn-soft);color:var(--warn)}.g-E{background:var(--neg-soft);color:var(--neg-tx)}.g-x{background:var(--sunk);color:var(--muted)}
/* kemas kini terakhir (atas kanan) */
.titlerow{flex-wrap:nowrap;align-items:flex-start}
.brand{flex:1 1 auto;padding-top:2px}
.kanan{display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right;flex:none;max-width:62%}
.kini{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25;cursor:help}
.kini .kl{font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kini b{font-size:.92rem;font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums;white-space:nowrap}
.kini b.neg{color:var(--neg)}
.kini .kd{font-size:.74rem;color:var(--muted)}
.kanan .live{justify-content:flex-end}
@media (max-width:520px){h1{font-size:1.02rem}#liveTxt{display:none}.kini b{font-size:.84rem}}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--pos);box-shadow:0 0 0 3px var(--pos-soft)}
nav.tabs{display:flex;gap:2px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;color:var(--muted);font-weight:600;font-size:.92rem;padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{color:var(--fg-2)}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);background:linear-gradient(0deg,var(--accent-soft),transparent 70%)}
.subbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0}
.subbar[hidden]{display:none}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:500;font-size:.85rem;padding:6px 11px;border-radius:6px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--card);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.lbl{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.spacer{flex:1}
.fold-btn{border:1px solid var(--line);background:var(--card);color:var(--fg-2);font-size:.82rem;padding:6px 10px;border-radius:6px;cursor:pointer}
.fold-btn:hover{border-color:var(--line-2)}

/* paparan */
section.view{padding-top:18px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
h2{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2);margin:0;text-wrap:balance;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:3px;height:12px;border-radius:2px;background:linear-gradient(var(--accent),var(--violet));flex:none}
h3{font-size:1rem;margin:0}
.sub{color:var(--muted);font-size:.86rem;margin:2px 0 0;max-width:80ch}
.headline{font-size:1rem;line-height:1.55;margin:0;max-width:120ch;color:var(--fg-2)}
.headline b{color:var(--fg)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:-14px -14px 12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.panel-h .sub{margin:0}
.panel-h.foldable{cursor:pointer;user-select:none}
.panel-h.foldable::after{content:"▾";color:var(--muted);font-size:.9rem;margin-left:4px}
.panel.lipat>:not(.panel-h){display:none!important}
.panel.lipat>.panel-h{margin-bottom:-14px;border-bottom:0}
.panel.lipat>.panel-h::after{content:"▸"}
/* tab sisi panel (v93, 21 Okt 2026): tab dengan >= 3 panel = rel kiri (telefon: jalur cip melekit); satu bahagian dipapar */
section.view.pnav .grid2,section.view.pnav .grid2.eq{grid-template-columns:minmax(0,1fr)}
section.view.pnav .pn-x{display:none!important}section.view.pnav .pn-j{display:block!important}section.view.pnav .pn-j>*+*{margin-top:16px}
section.view.pnav .panel.pn-a>.panel-h{cursor:default}section.view.pnav .panel-h.foldable::after{display:none}
.pnav-in{display:flex;flex-direction:column;gap:2px}
.pnav-in button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid transparent;background:none;color:var(--fg-2);font-size:.84rem;line-height:1.3;padding:8px 10px;border-radius:7px;cursor:pointer}
.pnav-in button:hover{background:var(--card);color:var(--fg)}
.pnav-in button[aria-current="true"]{background:var(--card);border-color:var(--line-2);color:var(--fg);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.pnav-in button.pn-dg{color:var(--neg-tx,#f87171)}
.pnav-in .pill{font-size:.66rem;padding:1px 6px;margin-left:auto;flex:none}
.pnav-in .pn-n{margin-left:auto;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pnav-in hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.pnav-in .pn-k{font-size:.66rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
@media (min-width:761px){
  section.view.pnav{padding-left:232px;position:relative}
  .pnav-rail{position:absolute;left:0;top:18px;bottom:0;width:216px}
  .pnav-in{position:sticky;top:calc(var(--hdr,0px) + 12px);max-height:calc(100vh - var(--hdr,0px) - 24px);overflow-y:auto;padding:2px 4px 2px 0;scrollbar-width:thin}
}
@media (max-width:760px){
  .pnav-rail{position:sticky;top:var(--hdr,0px);z-index:6;margin:-6px calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .pnav-in{flex-direction:row;overflow-x:auto;gap:6px;padding:8px 16px;scrollbar-width:none}.pnav-in::-webkit-scrollbar{display:none}
  .pnav-in button{width:auto;flex:none;white-space:nowrap;border-color:var(--line);padding:6px 11px;border-radius:999px;font-size:.8rem}
  .pnav-in button[aria-current="true"]{box-shadow:none;border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--card))}
  .pnav-in .pn-n,.pnav-in hr,.pnav-in .pn-k{display:none}
}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}

.kpi .lbl{font-size:.72rem}

.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.pill{display:inline-block;font-weight:600;font-size:.72rem;letter-spacing:.03em;padding:2px 8px;border-radius:999px;white-space:nowrap;vertical-align:1px}
.k-GUNA{background:var(--guna-bg);color:var(--guna)} .k-UJI{background:var(--uji-bg);color:var(--uji)}
.k-SIMPAN{background:var(--simpan-bg);color:var(--simpan)} .k-DITOLAK{background:var(--tolak-bg);color:var(--neg-tx)}
.p-buy{background:var(--pos-soft);color:var(--pos)} .p-hold{background:var(--simpan-bg);color:var(--simpan)} .p-exit{background:var(--neg-soft);color:var(--neg-tx)} .p-near{background:var(--violet-soft);color:#c4b5fd} .p-mute{background:var(--sunk);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}

.pos{color:var(--pos)} .neg{color:var(--neg-tx)} .mut{color:var(--muted)}

@media (min-width:761px){table[data-st^="skw-"] th{overflow-wrap:normal}table[data-st^="skw-"] td:not(.tk){overflow-wrap:normal;white-space:nowrap}table[data-st^="skw-"] td .vv{font-size:.72rem}table[data-st^="skw-"] td.tk{min-width:160px}}

     satu baris) — ia hanya meninggalkan ruang kosong */
  body.padat .tablewrap td.name,body.padat .tablewrap td.wrap,body.padat .tablewrap td.syr,
  body.padat .tablewrap.tw-grd td.wrap,body.padat .tablewrap.tw-grd td.syr{min-width:0}

  body.padat .tablewrap td .sbk{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}

  body.padat .tablewrap td .l2bar{vertical-align:middle}
  /* 28 Okt 2026 (permintaan pengguna "saya takmau scroll ke kanan … boleh jadikan 2 line sahaja"): sel dibenarkan
     membalut sehingga 2 baris supaya lajur jadi sempit dan semua lajur muat tanpa skrol mendatar */
  body.padat .tablewrap tbody td{white-space:nowrap}

  body.padat .tablewrap tbody td.grd,body.padat .tablewrap tbody td.grp,body.padat .tablewrap tbody td.grk{white-space:normal;overflow-wrap:break-word}
  /* nama panjang (kaedah, industri) dipotong satu baris dalam mod Padat: tanpa ini baris jadi 28px lawan 45px */

  body.padat .tablewrap tbody td .nw{white-space:nowrap}
  body.padat .tablewrap thead th{white-space:normal}
  /* 28 Okt 2026 (permintaan pengguna): lencana Pegang/Keluar/Tunggu kekal DI BAWAH peratus untung walaupun mod Padat */
  /* 28 Okt 2026 (permintaan pengguna): sel lorong jadi grid 2x2 supaya BARIS 1 = peratus + bar lorong 2 dan

     gred tanpa trik grid — lebar sel dikira biasa, tiada lajur bertindih */
  body.padat td.grd .grt{flex-direction:column;align-items:flex-start;gap:1px}
  /* 28 Okt 2026 (permintaan pengguna): pil status (Selamat/Berhati-hati/Elak, Syariah …) tidak dipapar dalam
     mod Padat — cip gred sudah membawa maksud yang sama; teks penuh kekal dalam tooltip dan helaian butiran */
  body.padat td.grd>.pill{display:none}
  /* huruf gred dan nombor berkongsi GARIS DASAR yang sama supaya betul-betul sebaris (28 Okt 2026) */
  body.padat .tablewrap tbody td.grd .grc{align-items:baseline}

function drawScatter(box,rows,b){
  const W=Math.max(300,box.clientWidth||600),H=Math.round(Math.min(360,W*0.62));
  const P={l:44,r:12,t:12,b:30};const pts=rows.filter(r=>r.cagr!=null&&r.mdd!=null);

  let ymin=Math.min(-0.1,...pts.map(r=>r.cagr)),ymax=Math.max(0.3,...pts.map(r=>r.cagr));
  ymin=Math.floor(ymin*10)/10;ymax=Math.ceil(ymax*10)/10;const x0=Math.floor(xmin*10)/10;
  const X=v=>P.l+(v-x0)/(xmax-x0)*(W-P.l-P.r),Y=v=>P.t+(ymax-v)/(ymax-ymin)*(H-P.t-P.b);
  let g='<g class="grid">';const yt=[],xt=[];
  for(let v=ymin;v<=ymax+1e-9;v+=0.1)yt.push(+v.toFixed(2));for(let v=x0;v<=0.0001;v+=0.1)xt.push(+v.toFixed(2));
  const ys=yt.length>9?yt.filter((_,i)=>i%2===0):yt, xs=xt.length>6?xt.filter((_,i)=>i%2===0):xt;
  ys.forEach(v=>{g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}"/>`});g+='</g>';
  let t='';ys.forEach(v=>t+=`<text x="${P.l-6}" y="${Y(v)+4}" text-anchor="end">${Math.round(v*100)}%</text>`);
  xs.forEach(v=>t+=`<text x="${X(v)}" y="${H-12}" text-anchor="middle">${Math.round(v*100)}%</text>`);
  t+=`<text x="${W-P.r}" y="${H-1}" text-anchor="end">Kejatuhan maksimum (MDD) →</text>`;
  let ref='';
  if(b.ew!=null&&b.ew>=ymin&&b.ew<=ymax)ref+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(b.ew)}" y2="${Y(b.ew)}" stroke="var(--ref)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  ref+=`<line x1="${X(-0.45)}" x2="${X(-0.45)}" y1="${P.t}" y2="${H-P.b}" stroke="var(--tolak)" stroke-width="1" stroke-dasharray="2 3" opacity=".7"/><text x="${X(-0.45)+4}" y="${P.t+10}" style="fill:var(--tolak)">had G4 −45%</text>`;
  ref+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line-2)" stroke-width="1"/>`;
  const sorted=[...pts].sort((a,c)=>(3-(KORD[a.keputusan]??3))-(3-(KORD[c.keputusan]??3)));
  let d='';sorted.forEach(r=>{const strong=r.keputusan!=='DITOLAK';d+=`<circle cx="${X(r.mdd).toFixed(1)}" cy="${Y(r.cagr).toFixed(1)}" r="${strong?4.4:3}" fill="var(${KVAR[r.keputusan]||'--muted'})" fill-opacity="${strong?.95:.3}" stroke="var(--card)" stroke-width="${strong?1:0}" data-dk="${esc(key(r))}" style="cursor:pointer"><title>${esc(r.id+' '+r.varian)} · CAGR ${pct(r.cagr)} · MDD ${pct(r.mdd)}</title></circle>`});

}

const SKP={1:['prestasi_1d','1H',3],w:['prestasi_1w','1W',5],m:['prestasi_1m','1M',10],q:['prestasi_3m','3M',20]};
const FASA={Leading:{c:'--pos',bm:'Memimpin'},Improving:{c:'--accent',bm:'Membaik'},Weakening:{c:'--warn',bm:'Melemah'},Lagging:{c:'--neg-tx',bm:'Ketinggalan'}};
const fasaPill=f=>f?`<span class="pill" style="background:color-mix(in srgb,var(${FASA[f].c}) 16%,transparent);color:var(${FASA[f].c})">${f}</span>`:'<span class="mut">–</span>';
function heatCol(v,lim){if(v==null||isNaN(v))return 'var(--sunk)';const t=Math.max(-1,Math.min(1,v/lim));const a=(0.18+0.72*Math.abs(t)).toFixed(2);
  return t>=0?`color-mix(in srgb,#22c55e ${Math.round(a*100)}%,#0f172a)`:`color-mix(in srgb,#ef4444 ${Math.round(a*100)}%,#0f172a)`;}
function squarify(items,x,y,w,h){const out=[];let rest=items.filter(d=>d.v>0).sort((a,b)=>b.v-a.v);const tot=rest.reduce((s,d)=>s+d.v,0);if(!tot)return out;
  const sc=w*h/tot;rest=rest.map(d=>Object.assign({},d,{a:d.v*sc}));

  while(rest.length){const len=Math.min(w,h);let row=[rest[0]],i=1;
    while(i<rest.length&&worst(row.concat(rest[i]),len)<=worst(row,len)){row.push(rest[i]);i++;}
    rest=rest.slice(i);const s=row.reduce((t,d)=>t+d.a,0);

  return out;}

function katPecah(s){const o=[];let d=0,b='';s=String(s||'').trim().replace(/\.$/,'');

/* diagnostik (item 10): wajaran berkesan wᵢ·sdᵢ ÷ Σ w·sd, kadar tepu 0/100, pasangan sub-skor berkorelasi |ρ| > 0.8 (Spearman) */
function skwDiag(A){if(A.length<5)return '';const WT={};SKW_M.forEach(([id,g,w])=>{WT[id]=SKW_W[g]*w/SKW_M.filter(m=>m[1]===g).reduce((t,m)=>t+m[2],0);});
  const rk=v=>{const r=[];v.map((x,i)=>[x,i]).sort((p,q)=>p[0]-q[0]).forEach(([,i],j)=>{r[i]=j+1;});return r;};
  const sp=(a,b)=>{const ra=rk(a),rb=rk(b);return korelasiK(ra.map((x,i)=>[x,rb[i]]));};
  const M=SKW_M.map(([id,,,lb])=>{const v=A.map(x=>x.s[id]).filter(y=>y!=null),sd=sdOf(v)||0;return {id,lb,w:WT[id],sd,t0:v.filter(y=>y<=0).length/v.length,t100:v.filter(y=>y>=100).length/v.length,imp:A.filter(x=>x.imput&&x.imput.includes(id)).length};});
  const jum=M.reduce((t,m)=>t+m.w*m.sd,0),kor=[];
  SKW_M.forEach(([a],i)=>SKW_M.slice(i+1).forEach(([b])=>{const p=A.filter(x=>x.s[a]!=null&&x.s[b]!=null);if(p.length>5){const r=sp(p.map(x=>x.s[a]),p.map(x=>x.s[b]));if(r!=null&&Math.abs(r)>0.8)kor.push(`${a}–${b} ${fx(r,2)}`);}}));
  return `<details class="kasal"><summary>Diagnostik skor · ${A.length} kaedah</summary><div class="tablewrap" style="margin-top:8px"><table><thead><tr><th class="l">Metrik</th><th>Wajaran</th><th>Wajaran berkesan</th><th>Tepu 0</th><th>Tepu 100</th><th>Dianggar p25</th><th>Julat beku</th></tr></thead><tbody>
    ${M.map(m=>`<tr><td class="l">${esc(m.lb)}</td><td>${fx(m.w,1)}%</td><td>${jum?fx(m.w*m.sd/jum*100,1)+'%':'–'}</td><td>${fx(m.t0*100,0)}%</td><td>${fx(m.t100*100,0)}%</td><td>${m.imp}</td><td class="nw">${TIANG_V2[m.id].map(v=>fx(v,2)).join(' → ')}</td></tr>`).join('')}</tbody></table></div>
    <p class="sub" style="margin-top:6px">Wajaran berkesan = wajaran × sisihan piawai sub-skor ÷ jumlah: metrik yang hampir sama bagi semua kaedah tidak membezakan walaupun wajarannya besar. Tepu = peratus kaedah pada 0 atau 100 (julat terlalu sempit). ${kor.length?`Sub-skor berkorelasi |ρ| &gt; 0.8 (kiraan berganda): ${esc(kor.join(' · '))}.`:'Tiada pasangan sub-skor berkorelasi |ρ| &gt; 0.8.'} Julat ${esc(TIANG_VERSI)} daripada standard/kalibrasi_skor.py.</p></details>`;}

function prPilih(which){const src=prSrc(which);return src.length?prSkor(src,which):'';}

function petaData(rows){const by={};rows.forEach(r=>{const s=r.sektor||'Tiada sektor',i=r.industri||'Tiada industri';const S1=by[s]||(by[s]={k:s,v:0,ind:{}});S1.v++;(S1.ind[i]=S1.ind[i]||[]).push(r);});

function drawPeta(box,rows,st){if(!box)return;if(!rows.length){box.innerHTML='<p class="empty">Tiada posisi dipegang.</p>';return;}
  const W=Math.max(280,box.clientWidth||800),H=Math.round(Math.max(240,Math.min(400,W*0.42))),lim=10;
  const pot=(s,n)=>n*6.4>s?n:0,ptg=(t,w,f)=>{const m=Math.floor((w-10)/(f*0.58));return t.length>m?t.slice(0,Math.max(2,m-1))+'…':t;};
  let o='';squarify(petaData(rows),0,0,W,H).forEach(s=>{const hd=s.w>70&&s.h>48?16:0;
    o+=`<g data-pmk="${esc(s.k)}" tabindex="0" role="button" aria-label="Tapis sektor ${esc(s.k)}"><rect x="${s.x.toFixed(1)}" y="${s.y.toFixed(1)}" width="${Math.max(0,s.w-1).toFixed(1)}" height="${Math.max(0,s.h-1).toFixed(1)}" fill="var(--sunk)" stroke="var(--bg)" stroke-width="2"/>${hd?`<text x="${(s.x+5).toFixed(1)}" y="${(s.y+12).toFixed(1)}" class="pm-s">${esc(ptg(s.k.toUpperCase(),s.w,10))}</text>`:''}<title>${esc(s.k)}: ${s.v} posisi · purata ${sg2(s.u)}</title></g>`;
    squarify(Object.entries(s.ind).map(([k,a])=>({k,v:a.length,rs:a,u:avgOf(a.map(r=>r.untung_pct))})),s.x+1,s.y+hd+1,s.w-3,s.h-hd-3).forEach(t=>{
      const pil=st&&st.sk===s.k&&st.ind===t.k,f=t.w>90&&t.h>40?12:10.5,vt=`${t.v} · ${sg2(t.u)}`,dua=t.w>vt.length*6.3+10&&t.h>34,satu=t.w>34&&t.h>16;
      const sh=[...t.rs].sort((x,y)=>(y.untung_pct??-1e9)-(x.untung_pct??-1e9)).map(r=>`${r.saham} ${sg2(r.untung_pct)}`);

        ${satu?`<text x="${(t.x+5).toFixed(1)}" y="${(t.y+(dua?15:Math.min(13,t.h-3))).toFixed(1)}" class="pm-n" style="font-size:${f}px">${esc(ptg(t.k,t.w,f))}</text>`:''}
        ${dua?`<text x="${(t.x+5).toFixed(1)}" y="${(t.y+29).toFixed(1)}" class="pm-v">${vt}</text>`:''}
        <title>${esc(t.k)} · ${esc(s.k)}&#10;${t.v} posisi · purata ${sg2(t.u)}&#10;${esc(sh.slice(0,12).join(', '))}${sh.length>12?' …':''}</title></g>`;});});

const bolehSkrol=w=>!skrinKecil()&&/\btw-grd\b/.test(w.className);
function muatLajur(){
  document.querySelectorAll('.tablewrap').forEach(w=>{
    const t=w.querySelector(':scope>table');if(!t)return;
    w.querySelectorAll('.sbn').forEach(x=>x.classList.remove('sbn'));
    const nt=w.nextElementSibling;if(nt&&nt.classList.contains('sbn-nota'))nt.remove();
    if(!w.offsetParent||(skrinKecil()&&/\btw-(lp|grd)\b/.test(w.className)))return;
    w.classList.toggle('skrolx',bolehSkrol(w));
    /* mod "Semua lajur": lebar tetap dilonggarkan dan sel membalut dahulu (CSS .skrolx); lajur hanya disembunyi
       jika jadual MASIH terkeluar selepas itu, supaya tiada kandungan terpotong di skrin sempit */
    const hr=t.tHead&&t.tHead.rows.length===1?t.tHead.rows[0]:null;if(!hr)return;
    const ths=[...hr.cells];if(ths.some(h=>h.colSpan>1))return;
    const lebih=()=>t.offsetWidth>w.clientWidth+1;if(!lebih())return;
    const r1=t.tBodies[0]&&t.tBodies[0].rows[0],td1=r1?[...r1.cells]:[];
    const utama=i=>i===0||ths[i].classList.contains('frz')||ths[i].offsetWidth===0||/\b(m0|tk|utg|name|mline|mkad|mbtn)\b/.test((td1[i]&&td1[i].className)||ths[i].className);
    const rows=[...t.querySelectorAll('tbody tr')].filter(tr=>tr.cells.length===ths.length),sor=[];
    const urut=ths.map((_,i)=>i).slice(1);if(!t.classList.contains('hmt'))urut.reverse();
    /* keutamaan lajur (28 Okt 2026, permintaan pengguna): kp-lo disembunyi dahulu, kp-hi paling akhir; susunan
       kiri/kanan dikekalkan dalam setiap peringkat (Array.sort stabil) */
    const kp=i=>ths[i].classList.contains('kp-lo')?0:ths[i].classList.contains('kp-hi')?2:1;
    urut.sort((a,b)=>kp(a)-kp(b));
    for(const i of urut){if(!lebih())break;if(utama(i))continue;
      ths[i].classList.add('sbn');rows.forEach(tr=>tr.cells[i].classList.add('sbn'));const nm=(ths[i].textContent||'').replace(/[↕↓↑]/g,'').trim();if(nm)sor.push(nm);}
    if(!t.classList.contains('hmt'))sor.reverse();
    if(sor.length)w.insertAdjacentHTML('afterend',`<p class="sbn-nota">Lajur disembunyi kerana skrin tidak cukup lebar: ${esc(sor.join(', '))}. ${t.querySelector('tbody tr[tabindex]')?'Ketik baris untuk butiran penuh, atau besarkan tetingkap.':'Besarkan tetingkap untuk melihatnya.'}</p>`);
  });
}
