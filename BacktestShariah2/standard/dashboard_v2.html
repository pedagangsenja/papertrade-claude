<title>Papan Backtest Shariah</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
/* Susun atur: konsol terminal satu lajur; pengepala melekit (tab utama + sub-tab), paparan bertab, helaian bawah untuk butiran.
   Gaya SST Terminal: navy gelap sahaja (pilihan sengaja, satu tema). */
:root{
  color-scheme:dark;
  --bg:#0b1220; --surface:#0f172a; --card:#111a2e; --sunk:#0c1526; --line:#1f2a40; --line-2:#2a3852;
  --fg:#e2e8f0; --fg-2:#cbd5e1; --muted:#8a9ab3;
  --accent:#2dd4bf; --accent-soft:rgba(45,212,191,.12); --violet:#8b5cf6; --violet-soft:rgba(139,92,246,.16);
  --pos:#22c55e; --pos-soft:rgba(34,197,94,.14); --neg:#ef4444; --neg-soft:rgba(239,68,68,.13); --neg-tx:#f87171; --warn:#f59e0b; --warn-soft:rgba(245,158,11,.14);
  --guna:#22c55e; --guna-bg:rgba(34,197,94,.15); --uji:#f59e0b; --uji-bg:rgba(245,158,11,.15); --simpan:#60a5fa; --simpan-bg:rgba(96,165,250,.15); --tolak:#ef4444; --tolak-bg:rgba(239,68,68,.14);
  --ref:#eab308;
  /* sebab keluar: slot kategori 1–4 (disahkan validator dataviz pada permukaan kad) */
  --k1:#3987e5; --k2:#d95926; --k3:#199e70; --k4:#c98500;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:8px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:16px}
body{margin:0;background:radial-gradient(1200px 500px at 80% -10%,rgba(45,212,191,.06),transparent 60%),var(--bg);background-color:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:'cv11','ss01'}
div.wrap{max-width:none;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
/* jalur di atas pengepala melekit (kawasan selamat telefon) */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.num{font-variant-numeric:tabular-nums lining-nums}
a{color:var(--accent)}
button{font-family:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,tr:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* pengepala */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));padding:12px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mk{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--violet));flex:none}
h1{font-size:1.2rem;font-weight:800;letter-spacing:-.01em;margin:0;text-wrap:balance}
.live{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted)}
.live{flex-wrap:wrap;row-gap:2px}
.gr{display:inline-block;min-width:1.45em;text-align:center;border-radius:4px;font-weight:700;font-size:.7rem;line-height:1.5;padding:0 3px;margin:0 2px 2px 0}
.gr small{font-weight:500;opacity:.75;margin-right:1px}
.nw{white-space:nowrap}
/* jadual bergred: angka dan perkataan tidak dipecah; tiada skrol mendatar (lajur kurang penting disembunyi oleh muatLajur) */
.tablewrap.tw-grd{overflow-x:visible}.tablewrap.tw-grd td,.tablewrap.tw-grd th{overflow-wrap:break-word;padding-inline:4px}
/* Syarat belum cukup (watchlist penuh, .syr) 250px. Pemangkin (.grp) dan Kewangan (.grk) sama lebar 230px di desktop:
   teks pemangkin maksimum 3 baris, pautan berita 1 baris (teks penuh dalam title) */
td.grd{min-width:0}.tablewrap.tw-grd td.wrap{min-width:150px}.tablewrap.tw-grd td.syr{min-width:250px}td.grd .vv{font-size:.72rem}.tablewrap td .nw{white-space:nowrap}
.grc{display:inline-flex;gap:8px;align-items:center;text-align:left;vertical-align:middle}
.grc>.gr{flex:none;display:flex;align-items:center;justify-content:center;min-width:2em;height:2.1em;margin:0;padding:0 6px;font-size:1.05rem;border-radius:6px}
.lrk{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px}.lrb{flex:none;display:flex;align-items:center;justify-content:center;height:1.8em;padding:0 7px;border-radius:6px;font-weight:700;font-size:.72rem;letter-spacing:.02em}.lrp{font-size:1.05rem;line-height:1.2;white-space:nowrap}.lrk b.lrp.pos{color:var(--pos)}.lrk b.lrp.neg{color:var(--neg)}.lrk b.lrp.mut{color:var(--muted)}
.grt{min-width:0;display:flex;flex-direction:column;justify-content:center}.grt b{color:var(--fg)}.grt .pill{align-self:flex-start}
/* sub-gred kewangan: label K U T S di atas cip */
.kskor{display:flex;gap:4px;align-self:flex-start;margin-bottom:3px}.kskor>span{display:flex;flex-direction:column;align-items:center;gap:1px}.kskor small{font-size:.6rem;line-height:1.1;font-weight:600;color:var(--muted)}.kskor .gr{margin:0}
td.grd{text-align:center;vertical-align:middle}
@media (min-width:761px){td.kdh{width:1%;max-width:76px;white-space:normal}td.kdh .vv{white-space:normal;overflow-wrap:normal}}
td.ctr,th.ctr,th[data-tip="hari_watch"],th[data-tip="hari_pt"]{text-align:center}
.tablewrap.tw-grd td{vertical-align:middle}
.tablewrap.tw-grd th[data-tip^="g_"],.tablewrap.tw-grd th[data-tip="gred"]{text-align:center}
/* 28 Okt 2026 (permintaan pengguna "align betul betul"): di desktop sel gred dijajar KIRI supaya cip A–E setiap baris
   bermula pada x yang sama; sel bertengah membuat cip bergoyang ikut panjang teks */
@media (min-width:761px){
  .tablewrap td.grd,.tablewrap td.gks,.tablewrap.tw-grd th[data-tip^="g_"],.tablewrap.tw-grd th[data-tip="gred"]{text-align:left}
  .tablewrap td.grd .grc,.tablewrap td.gks .grc{width:100%}
  .tablewrap td.tk{white-space:nowrap}   /* simbol + lencana akaun/earnings kekal satu baris */
}
td.grd .vv.nm1{white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;max-width:110px;overflow-wrap:normal}
a.berita{color:var(--accent);text-decoration:none;margin-top:2px}a.berita:hover{text-decoration:underline}
.g-A{background:var(--pos-soft);color:var(--pos)}.g-B{background:var(--accent-soft);color:var(--accent)}.g-C{background:var(--sunk);color:var(--fg-2);box-shadow:inset 0 0 0 1px var(--line)}.g-D{background:var(--warn-soft);color:var(--warn)}.g-E{background:var(--neg-soft);color:var(--neg-tx)}.g-x{background:var(--sunk);color:var(--muted)}
/* kemas kini terakhir (atas kanan) */
.titlerow{flex-wrap:nowrap;align-items:flex-start}
.brand{flex:1 1 auto;padding-top:2px}
.kanan{display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right;flex:none;max-width:62%}
.kini{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25;cursor:help}
.kini .kl{font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kini b{font-size:.92rem;font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums;white-space:nowrap}
.kini b.neg{color:var(--neg)}
.kini .kd{font-size:.74rem;color:var(--muted)}
.kanan .live{justify-content:flex-end}
@media (max-width:520px){h1{font-size:1.02rem}#liveTxt{display:none}.kini b{font-size:.84rem}}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--pos);box-shadow:0 0 0 3px var(--pos-soft)}
nav.tabs{display:flex;gap:2px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;color:var(--muted);font-weight:600;font-size:.92rem;padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{color:var(--fg-2)}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);background:linear-gradient(0deg,var(--accent-soft),transparent 70%)}
/* v142 (2 Nov 2026, permintaan pengguna): tab utama jadi REL KIRI tetap di desktop (>= 1100px).
   Nod #mainTabs yang sama dipindah oleh JS (pengendali klik kekal); telefon/tablet tidak berubah. */
aside.rail{display:none}
@media (min-width:1100px){
  :root{--rel:204px}
  aside.rail{display:block;position:fixed;left:0;top:0;bottom:0;width:var(--rel);z-index:30;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;scrollbar-width:thin;padding:14px 10px calc(16px + env(safe-area-inset-bottom,0px))}
  aside.rail .rh{font-size:.64rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:2px 10px 9px}
  div.wrap{padding-left:calc(var(--rel) + 20px)}
  header.top{margin-left:calc(-1*(var(--rel) + 20px));padding-left:calc(var(--rel) + 20px)}
  aside.rail nav.tabs{flex-direction:column;gap:3px;margin-top:0;overflow:visible}
  aside.rail nav.tabs>button{width:100%;text-align:left;border-bottom:0;border-radius:8px;padding:9px 12px;font-size:.9rem}
  aside.rail nav.tabs>button:hover{background:var(--card);color:var(--fg)}
  aside.rail nav.tabs>button[aria-selected="true"]{background:linear-gradient(90deg,var(--accent-soft),transparent),var(--card);color:var(--fg);box-shadow:inset 3px 0 0 var(--accent)}
  /* v143 (2 Nov 2026, permintaan pengguna): rel bahagian panel (pnav, v93) BERSARANG di bawah tab yang
     diklik, bukan rel kedua dalam kawasan kandungan — jadi satu rel sahaja, dan kandungan dapat balik
     232px yang dahulu dimakan oleh rel kedua itu. */
  aside.rail .pnav-rail{position:static;width:auto;top:auto;bottom:auto;margin:3px 0 7px;padding-left:11px;border-left:1px solid var(--line-2)}
  aside.rail .pnav-in{position:static;max-height:none;overflow:visible;padding:0;gap:1px}
  aside.rail .pnav-in button{font-size:.79rem;padding:6px 9px;border-radius:6px;white-space:normal;overflow-wrap:anywhere;align-items:flex-start;line-height:1.32}
  aside.rail .pnav-in button>span:first-child{min-width:0}
  aside.rail .pnav-in button[aria-current="true"]{box-shadow:inset 2px 0 0 var(--accent)}
  aside.rail .pnav-in .pn-k{padding:8px 2px 4px;margin-top:8px}
  aside.rail .pnav-in hr{margin:5px 3px}
  section.view.pnav.pn-luar{padding-left:0}
  section.view.pnav.pn-luar .pnav-rail{display:none}
  /* v151 (5 Nov 2026, permintaan pengguna): blok status kanan atas (kemas kini, cip saluran, Padat, ?,
     Langsung) dipindah ke KAKI rel kiri, di bawah tab terakhir. Nod .kanan yang sama dipindah oleh JS. */
  /* v152 (5 Nov 2026): susunan SATU LAJUR yang tetap. Setiap baris bermula pada x yang sama dengan
     label tab (12px), dan cip saluran mengambil lebar penuh — jadi tiada baris yang pecah bergantung
     kepada lebar fon (v151 cuba memuatkan cip + Padat + ? pada satu baris dan "?" jatuh sendirian). */
  aside.rail{display:flex;flex-direction:column}
  aside.rail nav.tabs{flex:0 0 auto}
  aside.rail .kanan{max-width:none;align-items:stretch;text-align:left;gap:0;margin:14px 0 0;padding:11px 12px 2px;border-top:1px solid var(--line)}
  aside.rail .kini{align-items:flex-start;gap:1px}
  aside.rail .kini b{font-size:.85rem}
  aside.rail .kini .kd{display:block;line-height:1.35}
  aside.rail .kini .kd .pill{display:inline-block;margin-top:4px}
  aside.rail .kbar{display:flex;flex-wrap:wrap;justify-content:flex-start;align-items:center;gap:6px;margin-top:9px}
  aside.rail .salh{flex:1 0 100%;text-align:left;border-radius:7px;padding:3px 9px;font-size:.73rem}
  aside.rail .padbtn{width:auto;height:23px;border-radius:999px;padding:0 10px;font-size:.73rem;font-weight:600}
  aside.rail .bantu{width:23px;height:23px;font-size:.85rem}
  aside.rail .kanan .live{width:100%;margin-top:9px;font-size:.74rem;justify-content:flex-start;flex-wrap:nowrap;align-items:flex-start;gap:6px}
  aside.rail .live .dot{flex:none;margin-top:5px}
  aside.rail .live #liveTxt{min-width:0}
}
.subbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0}
.subbar[hidden]{display:none}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:500;font-size:.85rem;padding:6px 11px;border-radius:6px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--card);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.lbl{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.spacer{flex:1}
.fold-btn{border:1px solid var(--line);background:var(--card);color:var(--fg-2);font-size:.82rem;padding:6px 10px;border-radius:6px;cursor:pointer}
.fold-btn:hover{border-color:var(--line-2)}

/* paparan */
section.view{padding-top:18px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
h2{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2);margin:0;text-wrap:balance;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:3px;height:12px;border-radius:2px;background:linear-gradient(var(--accent),var(--violet));flex:none}
h3{font-size:1rem;margin:0}
.sub{color:var(--muted);font-size:.86rem;margin:2px 0 0;max-width:80ch}
.headline{font-size:1rem;line-height:1.55;margin:0;max-width:120ch;color:var(--fg-2)}
.headline b{color:var(--fg)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:-14px -14px 12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.panel-h .sub{margin:0}
.panel-h.foldable{cursor:pointer;user-select:none}
.panel-h.foldable::after{content:"▾";color:var(--muted);font-size:.9rem;margin-left:4px}
.panel.lipat>:not(.panel-h){display:none!important}
.panel.lipat>.panel-h{margin-bottom:-14px;border-bottom:0}
.panel.lipat>.panel-h::after{content:"▸"}
/* tab sisi panel (v93, 21 Okt 2026): tab dengan >= 3 panel = rel kiri (telefon: jalur cip melekit); satu bahagian dipapar */
section.view.pnav .grid2,section.view.pnav .grid2.eq{grid-template-columns:minmax(0,1fr)}
section.view.pnav .pn-x{display:none!important}section.view.pnav .pn-j{display:block!important}section.view.pnav .pn-j>*+*{margin-top:16px}
section.view.pnav .panel.pn-a>.panel-h{cursor:default}section.view.pnav .panel-h.foldable::after{display:none}
.pnav-in{display:flex;flex-direction:column;gap:2px}
.pnav-in button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid transparent;background:none;color:var(--fg-2);font-size:.84rem;line-height:1.3;padding:8px 10px;border-radius:7px;cursor:pointer}
.pnav-in button:hover{background:var(--card);color:var(--fg)}
.pnav-in button[aria-current="true"]{background:var(--card);border-color:var(--line-2);color:var(--fg);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.pnav-in button.pn-dg{color:var(--neg-tx,#f87171)}
.pnav-in .pill{font-size:.66rem;padding:1px 6px;margin-left:auto;flex:none}
.pnav-in hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
/* v144 (2 Nov 2026, permintaan pengguna): tajuk kumpulan nampak macam boleh ditekan padahal tidak.
   Ia kini dibaca sebagai PEMISAH, bukan baris: garis di atasnya, teks lebih kecil dan lebih pudar,
   dan inden tidak sejajar dengan teks butang supaya lajur butang kekal satu-satunya yang boleh diklik. */
/* Penanda warna setiap kumpulan guna slot kategori --k1..--k4 yang sudah ada (disahkan validator
   dataviz: julat kecerahan, lantai kroma, pemisahan CVD dan kontras semuanya LULUS pada permukaan
   gelap). Warna duduk pada penanda, BUKAN pada teks: teks kekal token pudar supaya hijau/merah/ambar
   kekal bermaksud untung/rugi/amaran dan tajuk tidak terbaca sebagai status. Teal tidak diguna
   kerana ia warna "sedang dipilih" dalam rel ini. */
.pnav-in .pn-k{display:flex;align-items:flex-start;gap:7px;font-size:.61rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);opacity:.78;padding:9px 2px 5px;margin-top:9px;border-top:1px solid var(--line);cursor:default;user-select:none}
.pnav-in .pn-k::before{content:"";flex:none;width:3px;height:9px;margin-top:2px;border-radius:2px;background:var(--kk,var(--line-2))}
.pnav-in div.pn-k:nth-of-type(1){--kk:var(--k1)}
.pnav-in div.pn-k:nth-of-type(2){--kk:var(--k2)}
.pnav-in div.pn-k:nth-of-type(3){--kk:var(--k3)}
.pnav-in div.pn-k:nth-of-type(4){--kk:var(--k4)}
.pnav-in .pn-k:first-child{border-top:0;margin-top:0;padding-top:2px}
/* v174 (audit tablet): rel bahagian kiri (232px) hanya dari 1100px; tablet 761–1099px guna jalur cip mendatar seperti
   telefon, supaya jadual posisi muat (di 768px rel itu memakan 30% lebar dan jadual terkeluar dari kad). */
@media (min-width:1100px){
  section.view.pnav{padding-left:232px;position:relative}
  .pnav-rail{position:absolute;left:0;top:18px;bottom:0;width:216px}
  .pnav-in{position:sticky;top:calc(var(--hdr,0px) + 12px);max-height:calc(100vh - var(--hdr,0px) - 24px);overflow-y:auto;padding:2px 4px 2px 0;scrollbar-width:thin}
}
@media (max-width:1099px){
  .pnav-rail{position:sticky;top:var(--hdr,0px);z-index:6;margin:-6px calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .pnav-in{flex-direction:row;overflow-x:auto;gap:6px;padding:8px 16px;scrollbar-width:none}.pnav-in::-webkit-scrollbar{display:none}
  .pnav-in button{width:auto;flex:none;white-space:nowrap;border-color:var(--line);padding:6px 11px;border-radius:999px;font-size:.8rem}
  .pnav-in button[aria-current="true"]{box-shadow:none;border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--card))}
  .pnav-in .pn-n,.pnav-in hr,.pnav-in .pn-k{display:none}
}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.kpi{background:linear-gradient(180deg,rgba(255,255,255,.02),transparent),var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0;display:grid;gap:3px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,var(--accent),var(--violet));opacity:.55}
.kpis6{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.kpi .lbl{font-size:.72rem}
.kpi .v{font-size:1.7rem;font-weight:700;line-height:1.15;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:.8rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
/* ================= v132 (29 Okt 2026): kad peluang gaya SST Terminal =================
   Permintaan pengguna selepas melihat kad "Top Opportunities by Market" SST: tiga elemen dibawa masuk —
   spark berisi kecerunan (arah dibaca sekali imbas), cip bulat 0–99 di sebelah simbol, dan kad + baris
   runner-up padat. Palet kekal palet dashboard (var(--pos)/(--neg)/(--accent)); kad adalah TAMBAHAN,
   jadual penuh di bawahnya tidak berubah. */
.kads{display:grid;grid-template-columns:repeat(auto-fit,minmax(218px,1fr));gap:12px}

function drawScatter(box,rows,b){
  const W=Math.max(300,box.clientWidth||600),H=Math.round(Math.min(360,W*0.62));
  const P={l:44,r:12,t:12,b:30};const pts=rows.filter(r=>r.cagr!=null&&r.mdd!=null);
  const xmin=Math.min(-0.8,...pts.map(r=>r.mdd)),xmax=0;
  let ymin=Math.min(-0.1,...pts.map(r=>r.cagr)),ymax=Math.max(0.3,...pts.map(r=>r.cagr));
  ymin=Math.floor(ymin*10)/10;ymax=Math.ceil(ymax*10)/10;const x0=Math.floor(xmin*10)/10;
  const X=v=>P.l+(v-x0)/(xmax-x0)*(W-P.l-P.r),Y=v=>P.t+(ymax-v)/(ymax-ymin)*(H-P.t-P.b);
  let g='<g class="grid">';const yt=[],xt=[];
  for(let v=ymin;v<=ymax+1e-9;v+=0.1)yt.push(+v.toFixed(2));for(let v=x0;v<=0.0001;v+=0.1)xt.push(+v.toFixed(2));
  const ys=yt.length>9?yt.filter((_,i)=>i%2===0):yt, xs=xt.length>6?xt.filter((_,i)=>i%2===0):xt;
  ys.forEach(v=>{g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}"/>`});g+='</g>';
  let t='';ys.forEach(v=>t+=`<text x="${P.l-6}" y="${Y(v)+4}" text-anchor="end">${Math.round(v*100)}%</text>`);
  xs.forEach(v=>t+=`<text x="${X(v)}" y="${H-12}" text-anchor="middle">${Math.round(v*100)}%</text>`);
  t+=`<text x="${W-P.r}" y="${H-1}" text-anchor="end">Kejatuhan maksimum (MDD) →</text>`;
  let ref='';
  if(b.ew!=null&&b.ew>=ymin&&b.ew<=ymax)ref+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(b.ew)}" y2="${Y(b.ew)}" stroke="var(--ref)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  ref+=`<line x1="${X(-0.45)}" x2="${X(-0.45)}" y1="${P.t}" y2="${H-P.b}" stroke="var(--tolak)" stroke-width="1" stroke-dasharray="2 3" opacity=".7"/><text x="${X(-0.45)+4}" y="${P.t+10}" style="fill:var(--tolak)">had G4 −45%</text>`;
  ref+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line-2)" stroke-width="1"/>`;
  const sorted=[...pts].sort((a,c)=>(3-(KORD[a.keputusan]??3))-(3-(KORD[c.keputusan]??3)));
  let d='';sorted.forEach(r=>{const strong=r.keputusan!=='DITOLAK';d+=`<circle cx="${X(r.mdd).toFixed(1)}" cy="${Y(r.cagr).toFixed(1)}" r="${strong?4.4:3}" fill="var(${KVAR[r.keputusan]||'--muted'})" fill-opacity="${strong?.95:.3}" stroke="var(--card)" stroke-width="${strong?1:0}" data-dk="${esc(key(r))}" style="cursor:pointer"><title>${esc(r.id+' '+r.varian)} · CAGR ${pct(r.cagr)} · MDD ${pct(r.mdd)}</title></circle>`});
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="Carta serakan CAGR lawan MDD">${g}${ref}${d}${t}<text x="${P.l}" y="${P.t-2}" style="font-size:10px">↑ CAGR</text></svg>`;
}

function filtered(){
  let rows=rowsForSet(S.set);const f=S.f;
  if(f.jenis!=='semua')rows=rows.filter(r=>r.id[0]===f.jenis);
  if(f.kep.size)rows=rows.filter(r=>f.kep.has(r.keputusan));
  if(f.gaya)rows=rows.filter(r=>(r.n||0)>=100&&r.days!=null&&r.days<=40);
  if(f.q){const q=f.q.toLowerCase();rows=rows.filter(r=>(r.id+' '+r.kaedah+' '+r.varian).toLowerCase().includes(q));}
  if(f.best)rows=f.gaya?bestBy(rows,'avg'):bestPerMethod(rows);
  return rows;
}

function drawPegang(box,series){

  const step=(ymax-ymin)>16?4:2;

  let g='<g class="grid">',t='';for(let v=ymin;v<=ymax;v+=step){g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(v)}" y2="${Y(v)}"/>`;t+=`<text x="${P.l-6}" y="${Y(v)+4}" text-anchor="end">${v}%</text>`;}g+='</g>';

  let ln='';series.forEach(s=>{const pts=HARI.map((h,i)=>s.r.pegang?.[h]!=null?[X(i),Y(s.r.pegang[h]),s.r.pegang[h]]:null).filter(Boolean);
    ln+=`<polyline points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="var(${s.col})" stroke-width="2.2" stroke-linejoin="round"/>`;
    pts.forEach(p=>ln+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="var(${s.col})"><title>${p[2].toFixed(1)}%</title></circle>`);

  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="Profil pegangan">${g}${ref}${ln}${t}</svg>`;

/* v174 (audit kontras): pada keamatan sederhana, teks putih DAN gelap kedua-duanya < 4.5:1 di atas petak (luminans
   ~0.16–0.20). heatA menggelapkan sedikit petak dalam jalur itu sehingga teks putih lulus; heatCol dan heatTeks berkongsi. */
function heatA(v,lim){const t=Math.max(-1,Math.min(1,v/lim)),c=t>=0?[34,197,94]:[239,68,68],b=[15,23,42];let a=0.18+0.72*Math.abs(t);
  const L=a=>{const m=c.map((x,i)=>x*a+b[i]*(1-a)),f=x=>{x/=255;return x<=0.03928?x/12.92:Math.pow((x+0.055)/1.055,2.4);};return 0.2126*f(m[0])+0.7152*f(m[1])+0.0722*f(m[2]);};

  return t>=0?`color-mix(in srgb,#22c55e ${Math.round(a*100)}%,#0f172a)`:`color-mix(in srgb,#ef4444 ${Math.round(a*100)}%,#0f172a)`;}
/* v174 (audit kontras): nama/nilai di atas petak heatCol diberi warna putih ATAU gelap, mana yang kontrasnya lebih tinggi.
   Dahulu `svg:not(.v5s) text` (kelabu pudar) mengatasi .pm-n, jadi nama industri kelabu di atas hijau terang (~2:1). */
function heatTeks(v,lim){if(v==null||isNaN(v))return '#F1F5F9';const {L}=heatA(v,lim);return 0.96/(L+0.05)>=(L+0.05)/0.055?'#F1F5F9':'#06120F';}
function squarify(items,x,y,w,h){const out=[];let rest=items.filter(d=>d.v>0).sort((a,b)=>b.v-a.v);const tot=rest.reduce((s,d)=>s+d.v,0);if(!tot)return out;
  const sc=w*h/tot;rest=rest.map(d=>Object.assign({},d,{a:d.v*sc}));
  const worst=(row,len)=>{const s=row.reduce((t,d)=>t+d.a,0),mx=Math.max(...row.map(d=>d.a)),mn=Math.min(...row.map(d=>d.a));return Math.max(len*len*mx/(s*s),(s*s)/(len*len*mn));};
  while(rest.length){const len=Math.min(w,h);let row=[rest[0]],i=1;
    while(i<rest.length&&worst(row.concat(rest[i]),len)<=worst(row,len)){row.push(rest[i]);i++;}
    rest=rest.slice(i);const s=row.reduce((t,d)=>t+d.a,0);
    if(w>=h){const cw=s/h;let cy=y;row.forEach(d=>{const ch=d.a/cw;out.push(Object.assign(d,{x,y:cy,w:cw,h:ch}));cy+=ch;});x+=cw;w-=cw;}
    else{const ch=s/w;let cx=x;row.forEach(d=>{const cw=d.a/ch;out.push(Object.assign(d,{x:cx,y,w:cw,h:ch}));cx+=cw;});y+=ch;h-=ch;}}
  return out;}

/* ================= lajur papertrade diselaraskan (M, C, Prestasi) ================= */
function hariDari(t){if(!t)return null;const d=Date.parse(t+'T00:00:00Z');if(isNaN(d))return null;let n=0;const now=new Date();for(let x=new Date(d);x<now;x.setUTCDate(x.getUTCDate()+1)){const w=x.getUTCDay();if(w&&w<6)n++;}return Math.max(0,n-1);}
function normPT(r){const keluar=!!(r.keluar||r.tarikh_keluar);const kk=r.kaedah_kongsi;return Object.assign({},r,{
  kaedah_kongsi:Array.isArray(kk)?kk:typeof kk==='string'&&kk.trim()?kk.split(/[,;]\s*/).filter(Boolean):null,
  kaedah:r.kaedah||r.id_kaedah||'–',hari:r.tidak_dibeli?null:(r.hari??hariDari(r.tarikh_beli)),keluar,
  isyarat_keluar:r.isyarat_keluar||(keluar?'Keluar':'Pegang'),
  untung_akhir_pct:keluar?(r.untung_akhir_pct??r.untung_pct):null,
  harga_terkini:keluar&&r.harga_keluar!=null?r.harga_keluar:r.harga_terkini,tidak_sah:!!r.tidak_sah,
  keluar_henti:benar(r.keluar_henti),
  /* tutup sepenuhnya hanya apabila kedua-dua lorong keluar; tanpa data lorong 2 (baris lama) ikut lorong kaedah */
  tutup_semua:r.tutup_semua!=null&&r.tutup_semua!==''?benar(r.tutup_semua):(r.status_henti||r.keluar_henti!=null&&r.keluar_henti!=='')?keluar&&benar(r.keluar_henti):keluar,
  untung_henti_pct:nomb(r.untung_henti_pct),harga_keluar_henti:nomb(r.harga_keluar_henti)});}
/* dua lorong keluar (sejak 17 Okt 2026): 1 kaedah, 2 pegang selagi naik (standard/keluar_lorong.py) */
const LORONG={kaedah:['keluar','tarikh_keluar','harga_keluar','untung_akhir_pct','isyarat_keluar'],henti:['keluar_henti','tarikh_keluar_henti','harga_keluar_henti','untung_henti_pct','status_henti']};
/* untung lorong: akhir jika lorong itu sudah keluar, semasa jika masih dipegang (lorong 2 selepas lorong kaedah keluar: tutup terakhir,
   kerana harga terkini baris itu dibekukan pada harga keluar lorong kaedah) */
const hasilL=(r,l)=>r[LORONG[l][0]]?r[LORONG[l][3]]:l==='henti'&&r.keluar?semasaL2(r):r.untung_pct;

function hariAntara(a,b){const x=Date.parse((a||'')+'T00:00:00Z'),y=Date.parse((b||'')+'T00:00:00Z');if(isNaN(x)||isNaN(y)||y<x)return null;let n=0;for(let d=new Date(x+864e5);d<=y;d.setUTCDate(d.getUTCDate()+1)){const w=d.getUTCDay();if(w&&w<6)n++;}return n;}
const tkO=t=>/^\d{4}-\d\d-\d\d/.test(t||'')?(+t.slice(8,10))+' '+BLN[+t.slice(5,7)-1]:'';
/* satu sel bagi setiap lorong, format seragam: status · tarikh @ harga · untung · sebab */
function selLorong(r,l){const [k,t,h,u,st]=LORONG[l];if(r.tidak_dibeli)return '<span class="mut">–</span>';

    return kotak('p-exit','Keluar',`${pct(r[u])}<span class="vv nw">${esc(tkO(r[t]))} @ ${fx(r[h],2)}${hr!=null?' · '+hr+' hari':''}</span>${sb?`<span class="vv">${esc(sb)}</span>`:''}`);}

const KEP_SEK=25,KEP_SAH=8,KEP_KAE=8;
function blokKepekatan(peg){
  if(!peg||peg.length<20)return '';
  const by=(f)=>{const m={};peg.forEach(r=>{const k=f(r);if(k)m[k]=(m[k]||0)+1;});return Object.entries(m).sort((a,b)=>b[1]-a[1]);};
  const tot=peg.length,sek=by(r=>r.sektor||'Tiada sektor'),sah=by(r=>r.saham),kae=by(r=>r.kaedah);
  const L=[];
  sek.slice(0,2).forEach(([k,n])=>L.push(['Sektor',k,`${nf(n)} posisi · ${fx(100*n/tot,0)}% portfolio`,100*n/tot>=KEP_SEK]));
  sah.slice(0,2).forEach(([k,n])=>L.push(['Saham',k,`${nf(n)} kaedah membeli saham sama`,n>=KEP_SAH]));
  kae.slice(0,1).forEach(([k,n])=>L.push(['Kaedah',k,`${nf(n)} posisi · ${fx(100*n/tot,0)}% portfolio`,100*n/tot>=KEP_KAE]));
  const amb=L.filter(x=>x[3]).length;
  return `<div class="kadblk"><p class="kbh"><b>Kepekatan</b> — ${amb?`<b class="neg">${amb}</b> melepasi ambang`:'tiada yang melepasi ambang'} · sektor ≥ ${KEP_SEK}% · saham dalam ≥ ${KEP_SAH} kaedah · kaedah ≥ ${KEP_KAE}% portfolio</p>

/* tangga harga: henti kaedah, paras lorong 2, harga beli, harga kini/keluar dan puncak pada SATU paksi.
   Label disusun ke baris kedua apabila dua penanda terlalu rapat supaya teks tidak bertindih. */
function pdTangga(r,W){
  const hb=nomb(r.harga_beli);if(!hb)return '';
  const kini=nomb(r.harga_terkini),hk=parasL(r,'kaedah'),a=l2Info(r);
  const M=[];
  if(a&&a.paras)M.push({v:a.paras,l:'Paras lorong 2',c:'var(--warn)',d:1});
  if(hk!=null)M.push({v:hk,l:'Henti kaedah',c:'var(--neg-tx)',d:1});
  if(kini)M.push({v:kini,l:r.keluar?'Harga keluar':'Harga kini',c:kini>=hb?'var(--pos)':'var(--neg-tx)',d:1,big:1,sub:sg2(hasilL(r,'kaedah'))});
  M.push({v:hb,l:'Harga beli',c:'var(--muted)',d:-1});
  if(a&&a.puncak)M.push({v:a.puncak,l:'Puncak',c:'var(--violet)',d:-1});
  if(M.length<2)return '';
  const vs=M.map(m=>m.v);let lo=Math.min(...vs),hi=Math.max(...vs);
  if(!(hi>lo)){lo*=0.95;hi*=1.05;}
  const pad=(hi-lo)*0.12;lo-=pad;hi+=pad;
  const L=34,R=W-34,x=v=>L+(v-lo)/(hi-lo)*(R-L),RW=78;
  [1,-1].forEach(d=>{const g=M.filter(m=>m.d===d).sort((p,q)=>p.v-q.v),lx=[];
    g.forEach(m=>{const X=x(m.v);let row=0;while(row<1&&lx[row]!=null&&X-lx[row]<RW)row++;m.row=row;lx[row]=X;});});
  const mxU=Math.max(0,...M.filter(m=>m.d===-1).map(m=>m.row||0)),mxD=Math.max(0,...M.filter(m=>m.d===1).map(m=>m.row||0));
  const h=16,topH=(mxU+1)*30+8,botH=(mxD+1)*34+16,y=topH,H=topH+h+botH;
  const stops=[hk,a&&a.paras].filter(v=>v!=null),sMax=stops.length?Math.max(...stops):null;
  let t=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="Kedudukan harga antara paras keluar dan puncak">`;
  t+=`<rect x="${L}" y="${y}" width="${R-L}" height="${h}" rx="8" fill="var(--line)"/>`;
  if(sMax!=null&&kini&&kini>sMax)t+=`<rect x="${x(sMax)}" y="${y}" width="${Math.max(0,x(kini)-x(sMax))}" height="${h}" rx="8" fill="var(--pos)" opacity=".32"/>`;
  if(sMax!=null)t+=`<rect x="${L}" y="${y}" width="${Math.max(0,x(sMax)-L)}" height="${h}" rx="8" fill="var(--neg)" opacity=".30"/>`;
  M.forEach(m=>{const X=x(m.v),ty=m.d===1?y+h+20+m.row*34:y-9-m.row*30;
    t+=`<line x1="${X.toFixed(1)}" y1="${m.d===1?y+h:ty-11}" x2="${X.toFixed(1)}" y2="${m.d===1?ty-11:y}" stroke="${m.c}" stroke-width="${m.big?2.2:1.2}"${m.big?'':' stroke-dasharray="3 3"'} opacity="${m.big?1:.72}"/>`;
    t+=`<circle cx="${X.toFixed(1)}" cy="${y+h/2}" r="${m.big?6:4.2}" fill="${m.c}" stroke="var(--sunk)" stroke-width="2"/>`;
    t+=`<text x="${X.toFixed(1)}" y="${ty}" text-anchor="middle" fill="${m.c}" font-size="${m.big?13.5:12}" font-weight="${m.big?800:700}">${fx(m.v,2)}</text>`;
    t+=`<text x="${X.toFixed(1)}" y="${m.d===1?ty+13:ty-13}" text-anchor="middle" fill="var(--muted)" font-size="10.5">${m.l}</text>`;
    if(m.sub)t+=`<text x="${X.toFixed(1)}" y="${ty+26}" text-anchor="middle" fill="${m.c}" font-size="10.5" font-weight="700">${m.sub}</text>`;});
  return t+'</svg>';}

/* satu ayat arahan di atas kad; sumber keadaan sama dengan titik status jadual (statusPos) */
function pdVerdikt(r){
  if(r.tidak_dibeli)return ['k','Tidak dibeli','Isyarat ini dilangkau ikut peraturan kaedah; tiada posisi dibuka.'];
  if(r.tutup_semua)return ['k','Sudah keluar kedua-dua lorong',`Keputusan akhir <b>${sg2(r.keluar?r.untung_akhir_pct:r.untung_pct)}</b>. Baris ini rekod sahaja.`];
  const st=statusPos(r)||['j'],hk=parasL(r,'kaedah'),a=l2Info(r),par=[];
  if(a&&a.paras)par.push(`<b>${fx(a.paras,2)}</b> (lorong 2)`);
  if(hk!=null)par.push(`<b>${fx(hk,2)}</b> (henti kaedah)`);
  if(st[0]==='m')return ['m','Jual pada buka sesi seterusnya',esc(st[1]||'Isyarat keluar sudah berlaku.')+'.'];
  if(st[0]==='h')return ['h','Hampir paras keluar',esc(st[1]||'Harga dekat dengan paras keluar.')+'.'];
  const j=l2Jarak(r);
  return ['j','Tiada tindakan hari ini',(par.length?`Jauh daripada paras keluar. Jual hanya jika tutup &lt; ${par.join(' atau &lt; ')}.`:'Jauh daripada paras keluar.')+(j?` Penimbal <b>${fx(j.j,1)} ATR</b>.`:'')];}

function pdKpi(r,hr){const u=r.keluar?r.untung_akhir_pct:r.untung_pct,rm=rOf(r),sp=spyPos(r),ra=riskAwal(r);

function pdJarak1(r){const j=jarakL(r,'kaedah'),p=parasL(r,'kaedah');if(j==null||p==null)return '';
  const tt=`Henti kaedah ${fx(p,2)} ialah ${fx(-j,1)}% di bawah harga kini. Bar penuh = 20% atau lebih.`;
  return pdBar((-j)/20*100,j>-3?'n':j>-8?'w':'',tt)+`<p class="pdnota">Henti <b>${fx(p,2)}</b> &middot; <b>${fx(-j,1)}%</b> di bawah harga kini</p>`;}

function pdKecekapan(r){const m=mfeOf(r),u=r.keluar?r.untung_akhir_pct:r.untung_pct,ma=maeOf(r);
  if(m==null||u==null||!(m>0.5))return '';
  const p=Math.max(0,Math.min(100,u/m*100));
  return `<div class="sec"><h4 data-tip="mfe">Kecekapan keluar</h4>
  <div class="pdcap"><div class="f" style="width:${p.toFixed(1)}%"></div><div class="g" style="left:${p.toFixed(1)}%"></div>

  <p class="pdnota">Menangkap <b>${fx(p,0)}%</b> daripada kenaikan maksimum ${sg2(m)}${ma==null?'':` &middot; penurunan maks ${sg2(ma)}`}. Jurang = untung yang terlepas sebelum keluar.</p></div>`;}

/* jadual gred: huruf + bar kedudukan + nilai ringkas. Bar guna skor berangka apabila ada
   (sektor/industri/RS), jika tidak lebarnya datang daripada huruf gred — dinyatakan dalam tooltip. */
const PDGL=[
  ['g_i','Industri',r=>r.gred_industri,r=>grNil(r.skor_industri),r=>esc(r.industri||r.industri_us||'\u2013'),'Skor industri daripada 100'],
  ['g_r','RS',r=>r.gred_rs,r=>grNil(r.rs_rating),r=>{const v=grNil(r.rs_rating);return v==null?'\u2013':'RS '+fx(v,0);},'RS rating daripada 100'],
  ['g_s','Sektor',r=>r.gred_sektor,r=>grNil(r.skor_sektor),r=>esc(r.sektor||r.sektor_us||'\u2013'),'Skor sektor daripada 100'],
  ['g_p','Pemangkin',r=>r.gred_pemangkin,null,r=>{const t=String(r.pemangkin||'').replace(/^\ud83d\udd25 PANAS \u00b7 /,'');
    return t&&t!=='tiada pemangkin dikesan'&&t!=='belum dikumpul'?esc(t.length>30?t.slice(0,28)+'\u2026':t):'<span class="mut">tiada</span>';},''],
  ['g_q','QR',r=>r.gred_qr,null,r=>{const h=grNil(r.hari_ke_earnings);return h==null?'<span class="mut">\u2013</span>':fx(h,0)+' hari';},''],
  ['g_k','Kewangan',r=>r.gred_kewangan,null,r=>{const m=/\u00b7 ([^\u00b7]+?) \u00b7 F:/.exec(String(r.kewangan_ringkas||''));return m?esc(m[1].trim()):'<span class="mut">\u2013</span>';},'']];
function pdGred(r){
  const body=PDGL.map(([tip,nama,fg,fs,fv,tt])=>{const g=fg(r),sk=fs?fs(r):null;
    if(GORD[g]==null&&sk==null)return '';
    const p=sk!=null?sk:(PDG_W[g]!=null?PDG_W[g]:null);
    const bt=sk!=null?`${tt}: ${fx(sk,0)}`:'Lebar bar daripada huruf gred; dimensi ini tiada skor berangka.';
    return `<tr><td><span class="mut" data-tip="${tip}">${nama}</span></td>
    <td class="gc">${GORD[g]!=null?`<span class="grc">${grB(g)}</span>`:'<span class="mut">\u2013</span>'}</td>
    <td>${p==null?'':pdBar(p,pdKls(g),bt)}</td><td class="n">${fv(r)}</td></tr>`;}).filter(Boolean).join('');
  if(!body)return '';
  const G=r.gred_keseluruhan;
  return `<div class="sec"><h4 data-tip="gred">Gred pada hari isyarat${GORD[G]!=null?` <span class="grc" style="margin-left:2px">${grB(G)}</span>`:''}</h4>
  <table class="pdg"><thead><tr><th>Dimensi</th><th class="gc">Gred</th><th class="kd">Kedudukan</th><th style="text-align:right">Nilai</th></tr></thead><tbody>${body}</tbody></table>
  <details class="pdd"><summary>Gred penuh &amp; sebab<span class="r">termasuk berita dan Syariah</span></summary><div class="pdb">${(()=>{const sn=snowGred(r);return sn?`<div class="snwr">${sn}<div class="snwl">Rajah enam paksi: makin besar dan makin sekata bentuknya, makin kukuh gred saham itu merentas semua dimensi. Bentuk sengét bermakna kuat pada satu dimensi sahaja.</div></div>`:'';})()}${gredList(r)}</div></details></div>`;}

function pdNombor(r,hr){const L=[['Tarikh isyarat',tkP(r.tarikh_isyarat)],['Tarikh beli',tkP(r.tarikh_beli)],
  ['Harga beli',fx(r.harga_beli,2)],[r.keluar?'Harga keluar':'Harga terkini',fx(r.harga_terkini,2)],
  ['Unit',fx(r.unit,0)],['Hari dipegang',fx(hr,0)],
  ['R (risiko awal)',rOf(r)==null?'\u2013':(q=>`<b class="${cls(rOf(r))}">${q.atr?'≈':''}${rTxt(rOf(r))}</b> <span class="mut">&middot; ${q.atr?'1R = ATR14 ':''}${fx(q.k,1)}%</span>`)(riskR(r))],
  ['Kenaikan maks',mfeOf(r)==null?'\u2013':`<span class="pos">${sg2(mfeOf(r))}</span>`],
  ['Penurunan maks',maeOf(r)==null?'\u2013':`<span class="${cls(maeOf(r))}">${sg2(maeOf(r))}</span>`],

/* ================= v162 (8 Nov 2026, keputusan pengguna): helaian Watchlist v2 =================
   Gaya sama dengan helaian posisi/kaedah: kepala melekit (jarak ke paras pencetus), kotak keputusan, syarat isyarat,
   tangga harga (pencetus · kini · SMA50 · tinggi 52 minggu, daripada harian/trend — tiada data baharu), jubin,
   kaedah (kad skor), gred, trend & stage; ‹ › dan leret ke calon seterusnya. */
function kwJarak(r){const h=nomb(r.harga_terkini),p=nomb(r.paras),tr=trendOf(r.saham),atr=tr&&tr.atr_pct!=null?+tr.atr_pct:null;
  const j=h&&p?(p/h-1)*100:null;return {h,p,j,atr,xa:j!=null&&atr?Math.abs(j)/atr:null,arah:j==null?'':j<0?'turun':'naik',tr};}
const kwX=v=>v==null?'–':v<0.1?'< 0.1':fx(v,1);
function kwVerdikt(r){const J=kwJarak(r);
  if(wLengkap(r)){const b=wBeli(r),C={beli:'t',pegang:'s',tunggu:'s',tiada:'c'};return [C[b.k]||'s',{beli:'Isyarat lengkap · sudah dibeli',pegang:'Isyarat lengkap · dilangkau',tunggu:'Isyarat lengkap · menunggu belian',tiada:'Isyarat lengkap · tidak dibeli'}[b.k],esc(b.t)];}
  if(wSentuh(r))return ['a','Paras pencetus sudah disentuh',`Isyarat lengkap jika syarat esok berlaku: <b>${esc(r.syarat_belum||'–')}</b>`];
  return ['s',`Hampir isyarat · ${fx(Math.min(99.9,r.pct_dipenuhi||0),1)}%`,`${J.j!=null?`Harga perlu <b>${J.arah} ${fx(Math.abs(J.j),2)}%</b> ke <b>${fx(J.p,2)}</b>${J.xa!=null?` (≈ ${kwX(J.xa)}× ATR harian)`:''}. `:''}Syarat: <b>${esc(r.syarat_belum||r.pencetus||'–')}</b>`];}
function kwTangga(el){if(!el)return;const g=k=>el.dataset[k]===''?null:+el.dataset[k],h=g('h'),p=g('p'),s50=g('s50'),t52=g('t52');
  const vs=[h,p,s50,t52].filter(v=>v!=null);if(vs.length<2){el.innerHTML='';return;}const lo=Math.min(...vs)*.985,hi=Math.max(...vs)*1.015;
  const W=Math.max(260,el.clientWidth||320),H=104,X=v=>18+(v-lo)/(hi-lo)*(W-36),y0=54;
  let s=`<svg class="v5s" width="${W}" height="${H}" role="img" aria-label="Harga berbanding paras pencetus"><rect x="${X(lo)}" y="${y0-5}" width="${X(hi)-X(lo)}" height="10" rx="5" fill="#2A3038"/>`;
  if(h!=null&&p!=null)s+=`<rect x="${Math.min(X(h),X(p))}" y="${y0-5}" width="${Math.abs(X(h)-X(p))}" height="10" fill="rgba(255,193,69,.5)"/>`;
  const M=[[t52,'tinggi 52m','#8A93A0',1],[s50,'SMA50','#B4BBC6',1],[p,'pencetus','#FFC145',0],[h,'kini','#1EE3B4',0]].filter(m=>m[0]!=null);
  const rap=h!=null&&p!=null&&Math.abs(X(h)-X(p))<60,cx=v=>Math.max(24,Math.min(W-24,X(v)));
  M.forEach(([v,t,c,dn0])=>{const dn=rap&&t==='pencetus'?1:dn0,ta='middle',tx=cx(v);s+=`<line x1="${X(v)}" x2="${X(v)}" y1="${y0-10}" y2="${y0+10}" stroke="${c}" stroke-width="2"/><text x="${tx}" y="${dn?y0+25:y0-15}" fill="${c}" font-size="10.5" font-weight="700" text-anchor="${ta}">${fx(v,2)}</text><text x="${tx}" y="${dn?y0+38:y0-28}" fill="#8A93A0" font-size="10" text-anchor="${ta}">${t}</text>`;});
  if(h!=null)s+=`<circle cx="${X(h)}" cy="${y0}" r="7" fill="#15181D" stroke="#1EE3B4" stroke-width="3"/>`;el.innerHTML=s+'</svg>';}
function openWatch(i){const L=watchRows(),r=L[i];if(!r)return;const J=kwJarak(r),V=kwVerdikt(r),VC={t:'pv2v-t',c:'pv2v-c',a:'pv2v-a',s:'pv2v-s'};
  const sd=String(r.syarat_dipenuhi||'').match(/(\d+)\s*\/\s*(\d+)/),a=sd?+sd[1]:null,b=sd?+sd[2]:null,eh=r.hari_ke_earnings!=null?+r.hari_ke_earnings:null,rs=grNil(r.rs_rating),tr=J.tr;
  const syarat=v5Card('c12','Syarat isyarat',a!=null?`${a} daripada ${b} dipenuhi`:'',`${a!=null?`<div class="v5bar" style="height:8px;margin-bottom:10px"><i style="width:${a/b*100}%;background:${V5G.pos}"></i></div>`:''}
    <div class="kd2st"><span class="ln"></span><span class="n" style="border-color:#1EE3B4;color:#1EE3B4">✓</span><div class="bx"><h4>Pencetus</h4><div class="v5sm">${esc(r.pencetus||'–')}</div></div></div>
    <div class="kd2st"><span class="ln"></span><span class="n" style="border-color:#6B7A99;color:#AFC0E0">≈</span><div class="bx"><h4>Sekarang</h4><div class="v5sm">${esc(r.sebab||'–')}</div></div></div>
    <div class="kd2st"><span class="n" style="border-color:#FFC145;color:#FFC145">!</span><div class="bx"><h4>Perlu berlaku</h4><div class="v5sm"><b>${esc(r.syarat_belum||'–')}</b></div></div></div>`);
  const jubin=`<div class="pv2k4"><div class="k5"><div class="l">Jarak ke pencetus</div><div class="v mo">${J.j==null?'–':v5sg(J.j)+'%'}</div><div class="v5xs">${J.xa!=null?`≈ ${kwX(J.xa)}× ATR14 (${fx(J.atr,1)}% sehari)`:'ATR tiada'}</div></div>
    <div class="k5"><div class="l">Dalam watchlist</div><div class="v mo">${fx(r.hari,0)} <span class="v5xs">hari</span></div><div class="v5xs">sejak ${esc(tkO(String(r.ditambah||'').slice(0,10)))}</div></div>
    <div class="k5"><div class="l">Earnings</div><div class="v mo ${eh!=null&&eh<=10?'amb':''}">${eh==null?'–':fx(eh,0)+' <span class="v5xs">hari</span>'}</div><div class="v5xs">${r.tarikh_earnings?esc(tkO(String(r.tarikh_earnings).slice(0,10))):'tiada tarikh'}${r.sumber_earnings?' · '+esc(String(r.sumber_earnings).split(';')[0]):''}</div></div>
    <div class="k5"><div class="l">RS lawan pasaran</div><div class="v mo">${rs==null?'–':fx(rs,0)}</div><div class="v5xs">${r.gred_rs?'gred '+esc(r.gred_rs):''}${r.rs_industri!=null?' · industri '+fx(r.rs_industri,0):''}</div></div></div>`;
  const ts=(()=>{const x=trSec(r.saham),y=stSec(r.saham);return x||y?v5Card('c12','Trend & Stage','',x+y):'';})();
  sheet(`<div class="pv2 kw2" data-kwh="${i}">
   <div class="pv2h"><button type="button" class="pv2x" data-tutup aria-label="Tutup">×</button><div class="pv2r1"><h3 id="shTitle">${esc(r.saham)} <span>· ${esc(r.kaedah)}</span></h3>${wPill(r)}</div>
    <div class="v5xs">${esc(r.industri_us||r.industri||'')}${r.nama?' · '+esc(r.nama):''} · Watchlist hampir isyarat</div>
    <div class="pv2r2"><div><div class="pv2big mo">${J.j==null?'–':v5sg(J.j)+'%'}</div><div class="v5xs">dari paras pencetus ${fx(J.p,2)} · harga ${fx(J.h,2)}</div></div>${J.xa!=null?`<div><span class="${J.xa<.5?'cp':J.xa<1.5?'ca':'cm'}" style="margin:0">≈ ${kwX(J.xa)}× ATR</span><div class="v5xs" style="margin-top:4px">${J.xa<.5?'boleh berlaku esok':J.xa<1.5?'satu hari biasa':'perlu gerakan besar'}</div></div>`:''}</div></div>
   <div class="pv2v ${VC[V[0]]}"><span class="ic">${V[0]==='t'?'✓':V[0]==='c'?'!':V[0]==='a'?'⚠':'i'}</span><div><b>${V[1]}</b><div class="v5sm" style="margin-top:2px">${V[2]}</div></div></div>
   ${syarat}
   ${v5Card('c12','Di mana harga sekarang',tr&&tr.tarikh_data?'tutup '+esc(tkO(String(tr.tarikh_data).replace(/^(\d{4})(\d\d)(\d\d)$/,'$1-$2-$3'))):'',`<div class="kw2tg" data-h="${J.h??''}" data-p="${J.p??''}" data-s50="${tr&&tr.sma50!=null?tr.sma50:''}" data-t52="${tr&&tr.t52!=null?tr.t52:''}"></div><div class="v5sm" style="margin-top:4px">${J.j!=null?`Kawasan kuning = jarak yang perlu dilalui harga. `:''}${tr&&tr.j52!=null?`<b>${v5sg(tr.j52,1)}%</b> dari tinggi 52 minggu.`:''}</div>`)}
   ${jubin}
   ${pvKaedah(r)}

  const L=[];src.forEach(r=>{if(r.tutup_semua||r.tidak_dibeli||!r.saham)return;const s=perhatianSebab(r);if(s)L.push({r,s});});
  if(!L.length)return '';
  /* satu kad setiap KATEGORI (bukan 5 kad kategori sama): kad = paling mendesak, baris bawah = 3 seterusnya */
  const KAT=[['Jual pada buka','p-exit'],['Hampir paras keluar','p-warn'],['Earnings hampir','p-near'],['Tidak sah','p-warn']];
  const by={};L.forEach(x=>{(by[x.s.t]=by[x.s.t]||[]).push(x);});
  Object.values(by).forEach(a=>{a.sort((p,q)=>p.s.u-q.s.u||(nomb(p.r.untung_pct)||0)-(nomb(q.r.untung_pct)||0));
    const t=new Set();for(let k=a.length-1;k>=0;k--){if(t.has(a[k].r.saham))a.splice(k,1);else t.add(a[k].r.saham);}});
  const mini=r=>{const si=siriPos(r);return si?sparkG(si.v,{W:60,H:18,p:2,ref:nomb(r.harga_beli)||null,lbl:`${r.saham} sejak beli`}):'';};
  const kad=KAT.filter(([t])=>by[t]&&by[t].length).map(([t])=>{const a=by[t],{r,s}=a[0];
    const si=siriPos(r),hb=nomb(r.harga_beli),u=nomb(r.untung_pct),rs=grNil(r.rs_rating);
    const k=kadPel({saham:r.saham,nama:r.industri_us||r.industri||'',attr:`data-pos="${esc(r._p)}"`,
      cip:cipN(rs,`RS rating ${rs==null?'tiada':fx(rs,0)} lawan seluruh pasaran AS`),
      spark:si?sparkG(si.v,{W:240,H:52,ref:hb||null,lbl:`${r.saham}: harga tutup sejak beli ${tkO(r.tarikh_beli)}`}):'',
      harga:'USD '+fx(r.harga_terkini,2),delta:sg2(u),dcls:cls(u),
      kaki:`${esc(r.kaedah)} · ${esc(s.b)}`});
    const br=a.slice(1,4).map(({r:x,s:sx})=>kadBaris({saham:x.saham,attr:`data-pos="${esc(x._p)}"`,
      tip:`${x.saham} · ${x.kaedah} · ${sx.b} · untung ${sg2(nomb(x.untung_pct))}`,
      spark:mini(x),delta:sg2(nomb(x.untung_pct)),dcls:cls(nomb(x.untung_pct)),
      cip:cipN(grNil(x.rs_rating),'RS rating',1)})).join('');
    const bila=t==='Jual pada buka'&&nx?esc(tkO(nx)):nf(a.length)+' saham';
    return kadKump(t,bila,k,br);}).join('');
  const jum=Object.values(by).reduce((n,a)=>n+a.length,0);
  return `<div class="kadblk"><p class="kbh"><b>Perlu perhatian</b> — ${nf(jum)} saham perlu diikuti: ${KAT.filter(([t])=>by[t]&&by[t].length).map(([t])=>`${t.toLowerCase()} <b>${nf(by[t].length)}</b>`).join(' · ')}. Satu kad setiap jenis; baris bawah = saham seterusnya dalam jenis yang sama.</p>
    <div class="kads">${kad}</div></div>`;}

/* carta kecil harga sejak beli: garis putus kelabu = harga beli, titik-titik kuning = paras keluar lorong 2 */
function sparkPos(r,W=84,H=24,besar){const s=siriPos(r);if(!s)return '<span class="mut">–</span>';const hb=nomb(r.harga_beli);
  const v=hb?[hb,...s.v]:s.v,a=l2Info(r),pr=a?a.paras:null,all=pr?[...v,pr]:v;
  const lo=Math.min(...all),hi=Math.max(...all),sp=hi-lo||1,n=v.length,pd=besar?6:2,pb=besar?16:2;
  const X=i=>pd+(n<2?(W-2*pd)/2:i/(n-1)*(W-2*pd)),Y=x=>pd+(hi-x)/sp*(H-pd-pb);
  const last=v[n-1],col=hb&&last<hb?'--neg':'--pos';
  const pts=v.map((x,i)=>X(i).toFixed(1)+','+Y(x).toFixed(1));
  const ln=`<polyline points="${pts.join(' ')}" fill="none" stroke="var(${col})" stroke-width="${besar?2:1.5}" stroke-linejoin="round"/>`;
  /* v132 (29 Okt 2026): isian kecerunan di bawah garis — arah posisi dibaca tanpa membandingkan dengan garis putus */
  const gid='sp'+(++KG),yB=(H-pb).toFixed(1);
  const isi=`<defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(${col})" stop-opacity=".30"/><stop offset="1" stop-color="var(${col})" stop-opacity="0"/></linearGradient></defs>`
    +`<path d="M${X(0).toFixed(1)},${yB} L${pts.join(' L')} L${X(n-1).toFixed(1)},${yB} Z" fill="url(#${gid})"/>`;
  const hl=(y,c,da)=>`<line x1="${pd}" x2="${W-pd}" y1="${Y(y).toFixed(1)}" y2="${Y(y).toFixed(1)}" stroke="var(${c})" stroke-dasharray="${da}"/>`;
  const lbl=`${r.saham}: ${s.v.length} harga tutup sejak beli ${tkO(r.tarikh_beli)}; garis putus kelabu = harga beli ${fx(hb,2)}${pr?`; titik-titik kuning = paras keluar lorong 2 ${fx(pr,2)}`:''}`;
  const ax=besar?`<text x="${W-pd}" y="${(Y(last)+(Y(last)<H/2?16:-8)).toFixed(1)}" text-anchor="end" class="skt">${fx(last,2)}</text><text x="${pd}" y="${H-3}" class="skt">${esc(tkO(r.tarikh_beli))} · beli ${fx(hb,2)}</text><text x="${W-pd}" y="${H-3}" text-anchor="end" class="skt">${esc(tkO(s.t[s.t.length-1]))}</text>`:'';
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" width="${besar?'100%':W}" height="${H}" role="img" aria-label="${esc(lbl)}"><title>${esc(lbl)}</title>${isi}${hb?hl(hb,'--muted','2 2'):''}${pr?hl(pr,'--warn','1 2'):''}${ln}<circle cx="${X(n-1).toFixed(1)}" cy="${Y(last).toFixed(1)}" r="${besar?3:2}" fill="var(${col})"/>${ax}</svg>`;}
/* hari dipegang lawan had masa kaedah (katalog "Maks N hari"), atau purata pegang backtest jika tiada had */
const hadMasaM=memo(kat=>{const m={};(kat&&kat.rows||[]).forEach(k=>{const p=String(k.pegang||'');if(/^tiada had masa/i.test(p))return;const x=/(\d+)\s*hari/.exec(p);if(x)m[k.id]=+x[1];});return m;});
/* hari dipegang ikut lorong (guna hariL sedia ada): satu lajur hari bagi setiap lorong keluar (28 Okt 2026) */
function hariSel2(r){const h=hariL(r,'henti');if(h==null)return '<span class="mut">–</span>';
  return `<span class="nw" title="Hari dagangan dalam lorong 2 (pegang selagi naik)${r.keluar_henti&&r.tarikh_keluar_henti?` hingga keluar ${esc(tkO(r.tarikh_keluar_henti))}`:' setakat ini'}">${fx(h,0)}</span>`;}
function hariSel(r){const h=hariL(r,'kaedah');if(h==null)return '–';if(r.tutup_semua||r.tidak_dibeli)return fx(h,0);
  const had=hadMasaM(S.kat)[r.kaedah],b=had?null:btOf(r.kaedah),ruj=had||(b&&b.r.days);if(!ruj)return fx(h,0);
  const hmp=had&&h/had>=0.8;
  /* 29 Okt 2026 (pengguna tidak faham label "bt 62"): label dieja penuh dan tooltip menyatakan sama ada bar itu
     HAD (kaedah menjual bila sampai) atau hanya RUJUKAN purata backtest (kaedah tiada had masa). */
  const tip=had?`${h} daripada ${had} hari. Kaedah ${r.kaedah} ada had masa ${had} hari dagangan: jika belum keluar, ia menjual pada hari ke-${had}. Bar = berapa banyak had masa sudah dipakai${hmp?'; kuning kerana sudah 80% atau lebih':''}.`
    :`${h} hari dipegang. Kaedah ${r.kaedah} tiada had masa — ia pegang sehingga isyarat keluar. Bar ungu hanya membanding dengan purata pegang dalam backtest (${fx(ruj,1)} hari); itu rujukan sahaja, bukan had, jadi bar penuh tidak bermakna perlu jual.`;
  return `${fx(h,0)}<span class="hbar${had?'':' bt'}${hmp?' hmp':''}" title="${esc(tip)}"><i style="width:${(Math.min(1,h/ruj)*100).toFixed(0)}%"></i></span><span class="vv" title="${esc(tip)}">${had?`had ${had} hari`:`purata backtest ${fx(ruj,0)} hari`}</span>`;}

/* keadaan pada tutup sesi sebelum (P): posisi yang dibeli ≤ P; keluar lorong kaedah ≤ P guna untung akhir, selainnya tutup P.
   Penurunan maks (MAE) guna nilai terkini, jadi skor label semalam ialah anggaran. */
const semalamM=memo((src,G)=>{if(!G||G.T.length<2)return null;const P=G.T[G.T.length-2],rows=[];let kurang=0;
  src.forEach(r=>{if(!r.tarikh_beli||r.tarikh_beli>P)return;const kel=!!(r.keluar&&r.tarikh_keluar&&r.tarikh_keluar<=P);let h=null;
    if(kel)h=r.untung_akhir_pct;else{const c=tutupPada(r.saham,P),hb=nomb(r.harga_beli);if(c!=null&&hb)h=(c/hb-1)*100;else kurang++;}
    rows.push(Object.assign({},r,{keluar:kel,tarikh_keluar:kel?r.tarikh_keluar:'',untung_akhir_pct:kel?r.untung_akhir_pct:null,untung_pct:kel?r.untung_pct:h,hasil:h}));});
  return {P,D:G.T[G.T.length-1],rows,kurang};});
const semalam=src=>semalamM(src,garis());
const delta=(a,b,amb=0.05)=>{if(a==null||b==null||isNaN(a)||isNaN(b))return '';const d=a-b;
  if(Math.abs(d)<amb)return '<span class="dlt mut" title="Hampir tiada perubahan sejak tutup sesi sebelum">–</span>';
  return `<span class="dlt ${d>0?'pos':'neg'}" title="Berbanding tutup sesi sebelum">${d>0?'▲':'▼'} ${d>0?'+':''}${fx(d,2)} mata</span>`;};

/* status saluran data: tarikh data setiap saluran lawan sesi yang dijangka (cuti NYSE tidak diambil kira) */
function jangkaSesi(jam){const now=Date.now(),d=new Date();d.setUTCHours(0,0,0,0);
  for(let i=0;i<10;i++){const w=d.getUTCDay();if(w&&w<6&&now>=d.getTime()+jam*3600e3)return d.toISOString().slice(0,10);d.setUTCDate(d.getUTCDate()-1);}return '';}
const hariKerjaSebelum=t=>{const d=new Date(t+'T00:00:00Z');do{d.setUTCDate(d.getUTCDate()-1);}while(d.getUTCDay()===0||d.getUTCDay()===6);return d.toISOString().slice(0,10);};
function saluran(){if(!S.live)return [];const h=S.hst||{},a=S.anl||{},iso=t=>(/^\d{4}-\d\d-\d\d/.exec(String(t||''))||[''])[0];
  /* v147 (4 Nov 2026): ambang = bila data BOLEH BERADA DALAM DB, bukan bila ia dikira.
     Halaman ini membaca db sahaja, dan db ditolak SEKALI sehari oleh sesi berjadual tolak_db
     (10:20 NY = 15:20 UTC, Isn–Sab). Jadi data sesi D baru muncul pada D+1 ~15:30 UTC = 39.5
     jam selepas tengah malam D — bukan 23 jam. Ambang 23 jam yang lama menyalakan "basi"
     selama ~16 jam setiap malam walaupun setiap saluran berjalan sempurna: disahkan 4 Nov 2026
     apabila pengguna melihat "Data 1/8" pada 00:42 UTC, dan larian tempatan terhadap db yang
     baru dijana menghasilkan 1/8 yang sama. Penunjuk yang merah setiap malam ialah penunjuk
     yang diabaikan, dan penunjuk yang diabaikan tidak melindungi apa-apa.
     Belian berlaku 9:40 NY (13:40/14:40 UTC) dan ditolak pada 15:20 UTC HARI SAMA, jadi 16 jam. */
  const js=jangkaSesi(39.5),jb=jangkaSesi(16);
  return [['Harga & posisi',iso(h.harga_tutup_pada),js,'harian.yml → harian/status'],['Belian 9:35 NY',iso(h.beli_pada),jb,'beli.yml → harian/status.beli_pada'],
    ['Watchlist',iso(S.watch&&S.watch.tarikh_data),js,'imbasan malam → papertrade/watchlist'],['Harga tinggi/rendah',iso(S.mae&&S.mae.harga_hingga),js,'prestasi/mae'],
    ['Lejar Penuh',iso(a.lejar_sesi),js,'lejar.yml → analisis/papan.lejar_sesi'],['Penganalisis',iso(a.harga_pada),js,'analisis.yml → analisis/papan'],
    ['Portfolio 10 slot',iso(S.pslot&&S.pslot.sesi_terakhir),js,'lejar.yml → prestasi/portfolio_slot']]
   .map(([n,v,j,src])=>{let st;if(!v)st='x';else if(j===null)st=(Date.now()-Date.parse(v+'T00:00:00Z'))/864e5<=8?'ok':'basi';else st=v>=j?'ok':v>=hariKerjaSebelum(j)?'lewat':'basi';return {n,v,j,src,st};});}

  let st=prStatsC.get(prSrc(which));if(!st){st=prStats(prSrc(which));prStatsC.set(prSrc(which),st);}const SO={};st.forEach(o=>{SO[o.kaedah]=o;});
  const semuaR=H.R.filter(r=>r.np>=min),R=[...semuaR].sort(su==='j'?(a,b)=>b.j-a.j:(a,b)=>(parseInt(a.k.slice(1))||9999)-(parseInt(b.k.slice(1))||9999)||a.k.localeCompare(b.k));
  const lbM=mod==='h'?'hari itu':'terkumpul',lbB=band==='s'?' lawan '+PA:'';
  const kotak=(r,v,i,nama,tanpa)=>{const n=r.n?r.n[i]:null,e=r.ev&&r.ev[i],raw=r.d[i];

    return `<td><i class="hb ${v==null?'h0':!v?'hz':''}" style="${hkBg(v,lim)}" title="${esc(t)}" aria-label="${esc(t)}">${tnd}</i></td>`;};
  const btTx=k=>{const b=btOf(k);return b&&b.r&&b.r.avg!=null?`; jangkaan backtest ${sg2(b.r.avg*100)}`:'';};
  const kanan=(o,j,np,tip)=>`<td class="jx"><span class="${o&&o.ex>=PR_MIN_TUTUP?'pos':''}">${o?o.ex:'–'}</span><span class="mut">/${PR_MIN_TUTUP}</span></td><td class="j" title="${esc(tip)}"><b class="${cls(j)}">${sg2(j)}</b> <span class="mut">${np??''}</span></td>`;
  const tipJ=(o,np,bt)=>`${np} posisi (untung akhir bagi yang keluar, semasa bagi yang dipegang)${o&&o.win!=null?`; menang (semua) ${fx(o.win,0)}%`:''}${bt}`;
  const spyV=hkNilai(H.spy,H.spy,mod,'a'),spyJ=(H.spy.reduce((c,x)=>c*(1+(x||0)/100),1)-1)*100;
  const semua=H.semua,srcAll=prSrc(which),hs=srcAll.map(r=>r.hasil).filter(x=>x!=null);

    <div class="filters" style="margin-bottom:8px"><span class="lbl">Nilai</span>${seg('hkMod',mod,[['k','Terkumpul'],['h','Harian']])}

/* ================= v91: grafik tambahan (peta portfolio, garis silang, plot kotak, kaedah terbaik ikut %, aliran isyarat, R, rangka) ================= */
/* garis silang: garis menegak + kotak nilai pada titik terdekat (tetikus atau sentuh); xs = koordinat x dalam viewBox lebar W */
function silang(box,W,xs,lbl){const svg=box&&box.querySelector('svg');if(!svg||!xs.length)return;box.classList.add('silang');
  const ln=document.createElement('div');ln.className='sl-g';const tp=document.createElement('div');tp.className='sl-t';tp.setAttribute('aria-hidden','true');box.append(ln,tp);
  const tunjuk=e=>{const r=svg.getBoundingClientRect(),br=box.getBoundingClientRect(),k=r.width/W,x=(e.clientX-r.left)/k;let i=0,b=1e9;
    xs.forEach((v,j)=>{const d=Math.abs(v-x);if(d<b){b=d;i=j;}});const px=r.left-br.left+xs[i]*k;
    ln.style.cssText=`left:${px.toFixed(1)}px;top:${(r.top-br.top).toFixed(1)}px;height:${r.height.toFixed(1)}px;display:block`;
    tp.innerHTML=lbl(i);tp.style.display='block';const tw=tp.offsetWidth;tp.style.left=Math.max(0,Math.min(br.width-tw,px+(px>br.width/2?-tw-10:10))).toFixed(1)+'px';tp.style.top=(r.top-br.top+4).toFixed(1)+'px';};
  svg.addEventListener('pointermove',tunjuk);svg.addEventListener('pointerdown',tunjuk);
  svg.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'){ln.style.display='none';tp.style.display='none';}});}
const slB=(a,b)=>`<div><span class="mut">${a}</span> <b>${b}</b></div>`;
/* garis silang carta harga dalam helaian posisi: koordinat sama seperti sparkPos(r,W,120,1) */
function silangSpark(bx,r,W){const s=siriPos(r);if(!s)return;const hb=nomb(r.harga_beli),v=hb?[hb,...s.v]:s.v,t=hb?['',...s.t]:s.t,n=v.length,pd=6;
  const X=i=>pd+(n<2?(W-2*pd)/2:i/(n-1)*(W-2*pd));
  silang(bx,W,v.map((x,i)=>X(i)),i=>!t[i]?slB('Harga beli',fx(hb,2)):`<div class="mut">${esc(tkO(t[i]))}</div>${slB('Tutup',fx(v[i],2))}${hb?slB('Sejak beli',`<span class="${cls(v[i]/hb-1)}">${sg2((v[i]/hb-1)*100)}</span>`):''}`);}

/* R = untung ÷ risiko awal; risiko awal = (harga beli − henti kaedah pada hari isyarat) ÷ harga beli. Risiko < 0.5% diabaikan (R melambung). */
const riskAwal=r=>{const b=nomb(r.harga_beli),h=nomb(r.henti);return b&&h&&h<b?(1-h/b)*100:null;};
/* v156 (audit v154 #24): kaedah tanpa henti (M01, M73, M82, semua Nxx dengan stop = NaN) dahulu tiada R langsung -
   tepat kaedah yang kajian cadangkan. 1R kini jatuh balik kepada ATR14% pada hari isyarat (prestasi/mae_atr) dan
   ditanda anggaran (≈). */
const atrIsyM=memo(d=>new Map((d&&d.rows)||[]));
const atrIsy=r=>{const m=atrIsyM(S.maeAtr),k=[r.saham,r.kaedah,r.tarikh_beli].join('|'),v=m.get('C|'+k)??m.get('M|'+k);return v==null?null:+v;};
const riskR=r=>{const k=riskAwal(r);if(k!=null)return {k,atr:false};const a=atrIsy(r);return a!=null&&a>0?{k:a,atr:true}:null;};
const rOf=r=>{const q=riskR(r),u=r.keluar?r.untung_akhir_pct:r.untung_pct;return q==null||q.k<0.5||u==null?null:u/q.k;};
const rTxt=v=>v==null||isNaN(v)?'–':(v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(2)+'R';
const katHenti=id=>((((S.kat&&S.kat.rows)||[]).find(x=>x.id===id))||{}).henti||'';
const tiadaHentiH=r=>{const t=katHenti(r.id_kaedah||r.kaedah);return nomb(r.henti)==null&&/^Tiada henti/i.test(t)?`<span class="mut" title="${esc(t)}">tiada henti (kaedah)</span>`:null;};
const rSel=r=>{const v=rOf(r),q=riskR(r);return v==null?(tiadaHentiH(r)||'<span class="mut">–</span>'):`<b class="${cls(v)}"${q.atr?' title="Anggaran: kaedah tanpa henti, 1R = ATR14% pada hari isyarat"':''}>${q.atr?'≈':''}${rTxt(v)}</b><span class="vv nw">${q.atr?'1R = ATR14 ':'risiko '}${fx(q.k,1)}%</span>`;};
const R_BIN=[-2,-1.5,-1,-0.5,0,0.5,1,1.5,2,2.5,3];
function drawR(box,vals){if(!box)return;const v=vals.filter(x=>x!=null&&!isNaN(x));if(!v.length){box.innerHTML='<p class="empty">Tiada dagangan dengan henti kaedah.</p>';return;}
  const nb=R_BIN.length+1,cnt=new Array(nb).fill(0);v.forEach(x=>{let i=0;while(i<R_BIN.length&&x>=R_BIN[i])i++;cnt[i]++;});
  const W=Math.max(280,box.clientWidth||520),H=200,P={l:40,r:12,t:18,b:30},st=Math.max(1,langkahBulat(Math.max(...cnt),3)),mx=Math.ceil(Math.max(...cnt)/st)*st,bw=(W-P.l-P.r)/nb;
  const X=i=>P.l+i*bw,Y=c=>P.t+(1-c/mx)*(H-P.t-P.b),y0=Y(0);
  let g='<g class="grid">',t='';for(let c=0;c<=mx;c+=st){const y=Y(c).toFixed(1);g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}"/>`;t+=`<text x="${P.l-6}" y="${(+y+4).toFixed(1)}" text-anchor="end">${c}</text>`;}g+='</g>';
  const jul=i=>i===0?'bawah −2R':i===nb-1?'+3R ke atas':`${rTxt(R_BIN[i-1])} hingga ${rTxt(R_BIN[i])}`;
  let b='';cnt.forEach((c,i)=>{const col=i<=2?'--neg':i<=4?'--warn':'--pos',y=Y(c);
    b+=`<g class="hit"><rect x="${X(i).toFixed(1)}" y="${P.t}" width="${bw.toFixed(1)}" height="${(H-P.t-P.b).toFixed(1)}" fill="transparent"/>${c?`<rect x="${(X(i)+1).toFixed(1)}" y="${y.toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${(y0-y).toFixed(1)}" rx="3" fill="var(${col})"/>`:''}<title>${jul(i)}: ${c} dagangan (${fx(c/v.length*100,0)}%)</title></g>`;});
  const sk=W<480?2:1;R_BIN.forEach((x,i)=>{if(sk>1&&i%sk)return;t+=`<text x="${X(i+1).toFixed(1)}" y="${H-12}" text-anchor="middle" style="font-size:10.5px">${x>0?'+':''}${x}</text>`;});
  t+=`<text x="${W-P.r}" y="${H-1}" text-anchor="end" style="font-size:10px">R →</text>`;
  const z=`<line x1="${X(5).toFixed(1)}" x2="${X(5).toFixed(1)}" y1="${P.t-6}" y2="${y0.toFixed(1)}" stroke="var(--fg-2)" stroke-dasharray="3 3" opacity=".6"/>`;
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="Taburan untung dalam unit R">${g}${b}${z}${t}</svg>`;}
/* isi (bukan panel): dipapar dalam panel Taburan untung apabila unit = R */
function prRIsi(src,which){const ex=src.filter(r=>r.keluar),vr=ex.map(rOf).filter(x=>x!=null),vo=src.filter(r=>!r.keluar).map(rOf).filter(x=>x!=null);if(!vr.length&&!vo.length)return '';
  const p=(f)=>vr.length?fx(vr.filter(f).length/vr.length*100,0)+'%':'–';
  const nA=src.filter(r=>rOf(r)!=null&&riskR(r).atr).length;
  return `<div class="kpis"><div class="kpi"><div class="lbl">Purata R (selesai)</div><div class="v ${cls(avgOf(vr))}">${rTxt(avgOf(vr))}</div><div class="s">median ${rTxt(median(vr))}${nA?` · ${nf(nA)} posisi tanpa henti: 1R ≈ ATR14`:''}</div></div>
      <div class="kpi"><div class="lbl">Capai ≥ +1R</div><div class="v">${p(x=>x>=1)}</div><div class="s">untung sekurang-kurangnya sama dengan risiko</div></div>
      <div class="kpi"><div class="lbl">Rugi ≤ −1R</div><div class="v">${p(x=>x<=-1)}</div><div class="s">rugi penuh risiko awal atau lebih (jurang)</div></div>
      <div class="kpi"><div class="lbl">Masih dipegang</div><div class="v ${cls(avgOf(vo))}">${rTxt(avgOf(vo))}</div><div class="s">${nf(vo.length)} posisi · purata R semasa</div></div></div>
    <div class="chartbox" id="prR${which}"></div>
    <p class="sub" style="margin-top:6px">${nf(vr.length)} dagangan selesai dengan henti kaedah. R = untung % ÷ risiko awal %, risiko awal = (harga beli − henti kaedah pada hari isyarat) ÷ harga beli. Bagi kaedah yang hentinya mengekor, R ialah anggaran (henti awal sahaja). Posisi dengan risiko awal &lt; 0.5% atau tanpa henti tidak dikira.</p>`;}

/* ================= Skor kaedah swing (22 Okt 2026, permintaan pengguna) =================
   Satu jadual kaedah × metrik dengan skor akhir 0–100%: Untung 40 · Konsisten 25 · Risiko 20 · Bukti 15. Untung dikira pada lorong
   terbaik setiap kaedah (kaedah atau selagi naik); purata dilaras ke arah purata semua dagangan lorong itu (+SKW_K dagangan setara)
   supaya sampel kecil tidak menang. Setiap metrik dipetakan ke 0–100 dengan julat tetap [a → 0, b → 100]; metrik tanpa data tidak
   dikira (wajaran dibahagi semula). Layak = ≥ PR_MIN_TUTUP dagangan selesai (lorong kaedah) dan purata pegang backtest 3–30 hari.
   Tambahan (22 Okt 2026): untung minimum 95%, tanpa 3 terbaik, trend sejak sesi lalu (dikira semula pada tutup sesi sebelum),
   isyarat seminggu, purata R, pertindihan saham antara kaedah, gabungan cadangan dan kedudukan dalam 3 set wajaran.

   GANTUNG/BERSARA mengatasi tahap (GANTUNG juga: purata 20 hari beli matang < p5 bergulir backtest); ujian ramalan skor mingguan (Spearman skor pada sesi terakhir minggu lawan pulangan posisi 5 sesi
   seterusnya); kad gabungan beku (prestasi/portfolio_slot.beku: GABUNGAN_10 lawan TOP1_10, RAWAK_KAEDAH_10 dan SPY). */

const nSaham=a=>new Set(a.map(r=>r.saham)).size;
function petaData(rows){const by={};rows.forEach(r=>{const s=r.sektor||'Tiada sektor',i=r.industri||'Tiada industri';const S1=by[s]||(by[s]={k:s,v:0,ind:{}});(S1.ind[i]=S1.ind[i]||[]).push(r);});
  return Object.values(by).map(s=>{const a=Object.values(s.ind).flat();return Object.assign(s,{v:nSaham(a),np:a.length,u:avgOf(a.map(r=>r.untung_pct))});});}

    squarify(Object.entries(s.ind).map(([k,a])=>({k,v:nSaham(a),np:a.length,rs:a,u:avgOf(a.map(r=>r.untung_pct))})),s.x+1,s.y+hd+1,s.w-3,s.h-hd-3).forEach(t=>{

        <title>${esc(t.k)} · ${esc(s.k)}&#10;${t.v} saham (${t.np} posisi) · purata ${sg2(t.u)}&#10;${esc(sh.slice(0,12).join(', '))}${sh.length>12?' …':''}</title></g>`;});});

const tkRp=md=>{const B=['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis'];const x=typeof md==='number'?md:+String(md).replace('-','');return `${x%100} ${B[Math.floor(x/100)-1]}`;};

/* v135 (30 Okt 2026, permintaan pengguna): paksi carta harga dibaca dalam % SEJAK BELI, bukan USD.
   (v/hb − 1) × 100 ialah penjelmaan affine harga, jadi bentuk lilin, paras lorong 2 dan garis putus TIDAK berubah
   sedikit pun — hanya tanda paksi yang berpindah ke titik % bulat, dan garis beli jatuh tepat pada 0%.
   tikPct: pilih langkah % bulat (1 … 100) supaya dapat ~n selang dalam julat, sentiasa termasuk 0. */
function tikPct(loP,hiP,n){
  const jul=hiP-loP;if(!(jul>0))return [0];
  const kasar=jul/Math.max(1,n),L=[1,2,2.5,5,10,20,25,50,100,200];
  const st=L.find(v=>v>=kasar)||Math.ceil(kasar/100)*100;
  const out=[];for(let v=Math.ceil(loP/st)*st;v<=hiP+1e-9;v+=st)out.push(Math.abs(v)<1e-9?0:v);
  if(!out.some(v=>Math.abs(v)<1e-9)&&loP<0&&hiP>0)out.push(0);
  return out.sort((a,b)=>a-b);}
const lblPct=v=>(v>0?'+':'')+(Math.abs(v)<10?v.toFixed(Math.abs(v)%1?1:0):v.toFixed(0))+'%';

/* v133 (29 Okt 2026, permintaan pengguna): isian kecerunan lembut di bawah garis tutup, DI BELAKANG candlestick —
   arah keseluruhan dibaca sekali imbas tanpa membandingkan setiap lilin dengan garis putus harga beli.
   pt: [[x, tutup], …]; yB: garis dasar; hb: harga beli (warna); akhir: tutup terakhir yang dipapar. */
function isiTutup(pt,y,yB,hb,akhir){
  const a=pt.filter(p=>p[1]!=null);if(a.length<2)return '';
  const col=hb&&akhir!=null&&akhir<hb?'--neg':'--pos',id='lp'+(++KG);
  const d=`M${a[0][0].toFixed(1)},${yB.toFixed(1)} L${a.map(p=>p[0].toFixed(1)+','+y(p[1]).toFixed(1)).join(' L')} L${a[a.length-1][0].toFixed(1)},${yB.toFixed(1)} Z`;
  return `<defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(${col})" stop-opacity=".15"/><stop offset="1" stop-color="var(${col})" stop-opacity="0"/></linearGradient></defs><path d="${d}" fill="url(#${id})"/>`;}
/* v133 (31 Okt 2026, permintaan pengguna): SATU carta sahaja dalam kad posisi — "Harga sejak beli" dan
   "Ulang tayang lorong 2" digabung. rpSvg sudah melukis segala yang lilinPos lukis (lilin, garis harga beli,
   paras lorong 2 oren), jadi carta statik itu dibuang sepenuhnya. Bar SELEPAS kursor kini dilukis sebagai
   hantu (opacity .17) dan bukan disembunyikan: gambar penuh kekal pada pandangan pertama, sambil mata masih
   dapat mengikut paras oren menaik semasa Main. `Ex` = bar selepas jual lorong 2 (status 'lepas'), juga
   hantu, supaya posisi yang sudah ditutup tidak kehilangan ekornya seperti dalam carta statik lama. */
const RP_W=520,RP_H=212,RP_ML=44,RP_MR=14;
function rpSvg(Sr,u,hb,Ex){const n=Sr.length,ib=Sr.findIndex(b=>b[4]==='beli'),W=RP_W,H=RP_H,ml=RP_ML,mr=RP_MR,mt=12,mb=26,ada=Sr.some(b=>b[6]!=null),E=Ex||[],nT=n+E.length;
  const vals=Sr.concat(E).flatMap(b=>[b[1],b[2],b[3],b[5],b[7],b[8]]).concat(hb?[hb]:[]).filter(v=>v!=null);let lo=Math.min(...vals),hi=Math.max(...vals);const pad=(hi-lo)*0.06||1;lo-=pad;hi+=pad;
  const x=i=>ml+(W-ml-mr)*i/Math.max(1,nT-1),y=v=>mt+(H-mt-mb)*(hi-v)/(hi-lo),dp=(hi-lo)<4?2:(hi-lo)<40?1:0,cw=Math.max(2,Math.min(11,(W-ml-mr)/Math.max(1,nT-1)*0.62));let g='';
  /* v135: paksi dalam % sejak beli, bukan USD */
  const tk2=hb?tikPct((lo/hb-1)*100,(hi/hb-1)*100,5).map(pc=>[hb*(1+pc/100),lblPct(pc)])
              :[0,1,2,3,4].map(k=>{const v=lo+pad+(hi-lo-2*pad)*k/4;return [v,v.toFixed(dp)];});
  g+=tk2.map(([v,t])=>`<line x1="${ml}" x2="${W-mr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${ml-5}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${t}</text>`).join('');
  [[0,'start'],[ib,'middle'],[nT-1,'end']].forEach(([i,a],j)=>{if(i>=0&&i!==u&&(j===0||i!==0)&&(j<2||i!==ib))g+=`<text x="${x(i)}" y="${H-7}" text-anchor="${a}" font-size="10" fill="var(--muted)">${tkRp((Sr[i]||E[i-n])[0])}</text>`;});
  {const ax=u<=0?'start':u>=nT-1?'end':'middle',xu=Math.max(ml,Math.min(W-mr,x(u)));
   g+=`<text x="${xu.toFixed(1)}" y="${H-7}" text-anchor="${ax}" font-size="10" font-weight="700" fill="var(--accent)">${tkRp(Sr[u][0])}</text>`;}
  {const a=Math.max(ml-3,x(u)-cw/2-5),b=Math.min(W-mr+3,x(u)+cw/2+5);
   g+=`<rect x="${a.toFixed(1)}" y="${mt}" width="${(b-a).toFixed(1)}" height="${H-mt-mb}" rx="5" fill="var(--accent-soft)"/>`;}
  if(hb)g+=`<line x1="${ml}" x2="${W-mr}" y1="${y(hb).toFixed(1)}" y2="${y(hb).toFixed(1)}" stroke="var(--muted)" stroke-dasharray="2 3"/>`;
  if(ada){g+=isiTutup(Sr.slice(0,u+1).map((b,i)=>[x(i),b[1]]),y,H-mb,hb,Sr[u][1]);
    for(let i=0;i<n;i++)g+=lilin(Sr[i],x(i),y,cw,i>u?.17:(i<ib?.4:1));
    E.forEach((b,i)=>{g+=lilin(b,x(n+i),y,cw,.17);});}
  else{const ln=(a,o)=>`<path d="${a.map((b,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(b[1]).toFixed(1)}`).join('')}" fill="none" stroke="var(--fg-2)" stroke-width="2" stroke-linejoin="round"${o?` opacity="${o}"`:''}/>`;
    g+=ln(Sr.concat(E),'.17')+ln(Sr.slice(0,u+1),'');}

   bagi jadual bergred (Posisi, Watchlist). Jadual lain kekal muat ikut lebar skrin. */
/* Lajur tidak disembunyi melainkan jadual benar-benar tidak muat; segmen togol dibuang 28 Okt 2026 (permintaan
   pengguna: selepas lajur Pemangkin/Kewangan dibuang semuanya muat, jadi togol itu tiada beza) */
const bolehSkrol=w=>!skrinKecil()&&/\btw-grd\b/.test(w.className);
function muatLajur(){
  document.querySelectorAll('.tablewrap').forEach(w=>{
    const t=w.querySelector(':scope>table');if(!t)return;
    w.querySelectorAll('.sbn').forEach(x=>x.classList.remove('sbn'));
    const nt=w.nextElementSibling;if(nt&&nt.classList.contains('sbn-nota'))nt.remove();
    if(!w.offsetParent||(skrinKecil()&&/\btw-(lp|grd)\b/.test(w.className)))return;
    w.classList.toggle('skrolx',bolehSkrol(w));
    /* mod "Semua lajur": lebar tetap dilonggarkan dan sel membalut dahulu (CSS .skrolx); lajur hanya disembunyi
       jika jadual MASIH terkeluar selepas itu, supaya tiada kandungan terpotong di skrin sempit */
    const hr=t.tHead&&t.tHead.rows.length===1?t.tHead.rows[0]:null;if(!hr)return;
    const ths=[...hr.cells];if(ths.some(h=>h.colSpan>1))return;
    const lebih=()=>t.offsetWidth>w.clientWidth+1;if(!lebih())return;
    const r1=t.tBodies[0]&&t.tBodies[0].rows[0],td1=r1?[...r1.cells]:[];
    const utama=i=>i===0||ths[i].classList.contains('frz')||ths[i].offsetWidth===0||/\b(m0|tk|utg|name|mline|mkad|mbtn)\b/.test((td1[i]&&td1[i].className)||ths[i].className);
    const rows=[...t.querySelectorAll('tbody tr')].filter(tr=>tr.cells.length===ths.length),sor=[];
    const urut=ths.map((_,i)=>i).slice(1);if(!t.classList.contains('hmt'))urut.reverse();
    /* keutamaan lajur (28 Okt 2026, permintaan pengguna): kp-lo disembunyi dahulu, kp-hi paling akhir; susunan
       kiri/kanan dikekalkan dalam setiap peringkat (Array.sort stabil) */
    const kp=i=>ths[i].classList.contains('kp-lo')?0:ths[i].classList.contains('kp-hi')?2:1;
    urut.sort((a,b)=>kp(a)-kp(b));
    for(const i of urut){if(!lebih())break;if(utama(i))continue;
      ths[i].classList.add('sbn');rows.forEach(tr=>tr.cells[i].classList.add('sbn'));const nm=(ths[i].textContent||'').replace(/[↕↓↑]/g,'').trim();if(nm)sor.push(nm);}
    if(!t.classList.contains('hmt'))sor.reverse();
    if(sor.length)w.insertAdjacentHTML('afterend',`<p class="sbn-nota">Lajur disembunyi kerana skrin tidak cukup lebar: ${esc(sor.join(', '))}. ${t.querySelector('tbody tr[tabindex]')?'Ketik baris untuk butiran penuh, atau besarkan tetingkap.':'Besarkan tetingkap untuk melihatnya.'}</p>`);
  });
}
