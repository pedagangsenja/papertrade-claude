# Fundamental SEC: EPS/hasil suku point-in-time (XBRL companyfacts) + tarikh earnings 8-K Item 2.02 + SUE
# -> BacktestShariah2/data/sec/ (standard/fundamental_sec.py; 27 Okt 2026). Sesi Claude tidak boleh capai sec.gov;
# runner GitHub boleh. Rahsia repo SEC_USER_AGENT (nama + e-mel) wajib oleh SEC.
# Isian awal berperingkat: companyfacts maksimum 300 saham setiap larian; larian seterusnya hanya ambil semula
# saham yang ada 10-Q/10-K baharu. Masa (UTC): 23:41 Isn–Jum dan sandaran 04:11 Sel–Sab.
# Universe dilebarkan 911 -> 3335 pada 28 Okt 2026 (data/univ_sec.txt = 3260 ticker A02). Sapuan submissions
# penuh ~3335 x 0.15s jeda ~ 20 min, maka had masa 60 -> 120 min. Input maks_saham mengehadkan bilangan ticker
# disentuh setiap larian (berputar ikut kursor status.json) jika isian awal perlu dipecahkan.
name: Fundamental SEC

on:
  schedule:
    - cron: '41 23 * * 1-5'
    - cron: '11 4 * * 2-6'
  workflow_dispatch:
    inputs:
      maks_fakta:
        description: 'companyfacts maksimum setiap larian'
        required: false
        default: '300'
      maks_saham:
        description: 'ticker maksimum disentuh setiap larian (0 = semua)'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: fundamental-sec
  cancel-in-progress: false

jobs:
  sec:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pasang pakej
        run: pip install -q -c kekangan.txt pandas numpy requests
      # Ambil DAN tolak dalam satu langkah, dengan setiap percubaan bermula daripada origin/main
      # terkini. Sebabnya (28 Okt 2026, larian 11 gagal): langkah lama mengira data daripada
      # checkout, kemudian `git pull --rebase` pada hujungnya. Apabila dua larian bertindih, larian
      # kedua mengira daripada data/sec yang LAPUK dan rebase berkonflik. Lebih buruk: jika git
      # berjaya auto-merge CSV itu, ia menyilangkan baris daripada dua penulisan penuh fail yang
      # berbeza dan commit CSV ROSAK ke main. Konflik itu yang menyelamatkan data.
      #
      # fundamental_sec.py membaca CSV yang ada dan menggabungkan baris barunya (`_ganti`), dan
      # `akses` dalam status.json menandakan apa yang sudah diambil. Maka `reset --hard origin/main`
      # diikuti larian semula adalah selamat DAN murah: ia tidak mengulang kerja yang sudah ada
      # dalam main. Tiada konflik mungkin berlaku, kerana tiada rebase.
      - name: Ambil data SEC dan tolak
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          MAKS: ${{ github.event.inputs.maks_fakta }}
          MAKS_SAHAM: ${{ github.event.inputs.maks_saham }}
        run: |
          [ -n "$SEC_USER_AGENT" ] || echo "::warning::Rahsia SEC_USER_AGENT belum ditetapkan; data SEC tidak diambil"
          git config user.name "sec[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for n in 1 2 3 4; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 BacktestShariah2/standard/fundamental_sec.py jalan \
              --maks-fakta "${MAKS:-300}" --maks-saham "${MAKS_SAHAM:-0}" || exit 1
            git add BacktestShariah2/data/sec BacktestShariah2/data/univ_sec.txt 2>/dev/null || true
            git add BacktestShariah2/data/edgar/company_tickers.json 2>/dev/null || true
            if git diff --cached --quiet; then echo "tiada perubahan"; exit 0; fi
            git commit -q -m "Fundamental SEC: $(date -u +%F)"
            if git push -q origin HEAD:main; then exit 0; fi
            echo "::warning::push gagal (main bergerak); jalankan semula atas main terkini (cuba $n)"
            sleep $((n * 15))
          done
          exit 1
