# Lejar Penuh (BacktestShariah2/standard/lejar.py): stor harga repo + beli/keluar SEMUA isyarat semua kaedah,
# satu peraturan untuk semua (tiada had sekaedah, tiada keutamaan 431). Tanpa LLM, tanpa Moomoo.
# Masa (UTC): 06:17 Sel–Sab, sandaran 10:17. lejar.py menangguh sesi jika data yfinance belum muktamad (tarikan < 00:20 UTC
# selepas sesi, atau < 99% saham ada bar); larian seterusnya memproses sesi itu.
# Setiap larian memproses semua sesi yang belum diproses mengikut urutan (larian terlepas ditampung) sebelum buka AS seterusnya.
# Papertrade C (claude*.csv) dan rutin Claude tidak disentuh.
name: Lejar penuh

on:
  schedule:
    # Didaftar semula 19 Okt 2026: tiada cetusan jadual sejak 17 Okt 14:10 UTC (semua workflow active).
    # Jika cetusan hilang/lewat > 30 minit, penjaga_jadual.yml mencetus workflow_dispatch (dalam had masa).
    - cron: '17 6 * * 2-6'
    - cron: '17 10 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # cetus analisis.yml selepas larian dispatch penjaga (lihat langkah terakhir)

concurrency:
  group: lejar
  cancel-in-progress: false

jobs:
  lejar:
    runs-on: ubuntu-latest
    # 330 minit, dinaikkan daripada 150 pada 3 Nov 2026. Sebabnya diukur: satu sesi dengan 228
    # kaedah mengambil ~46 minit pada pelaksana GitHub (14.5 minit pada 4 vCPU tempatan - `--proses 4`
    # melebihi langganan pada 2 vCPU). Jadi TIGA sesi tertinggal sudah mencecah had 150 minit.
    #
    # Had masa SEBENAR kini pada langkah "Proses sesi" (300 minit), bukan hanya pada job. Sebabnya
    # tepat: tamat masa peringkat JOB ialah pembatalan keras dan `if: always()` tidak dijamin
    # berjalan selepasnya, manakala tamat masa peringkat LANGKAH menjadikan langkah itu gagal
    # secara biasa - jadi langkah commit selepasnya berjalan dan menyimpan sesi yang sudah siap.
    # Job kekal 330 sebagai jaring sandaran jika langkah lain tergantung.
    #
    # `if: always()` pada langkah commit kini SELAMAT (4 Nov 2026). Sebelum ini ia tidak selamat
    # kerana `tambah_bulan` menambah tanpa menyahduplikasi: gelung sesi menulis CSV dahulu dan
    # status.json LEPAS, jadi mengekalkan sesi separa ditulis akan menduakan baris pada larian
    # berikutnya. `tambah_bulan` kini mengambil kunci `unik` (id_kaedah+saham+tarikh_beli bagi
    # tutup, +sesi bagi langkau) dan ujian TestTambahBulanIdempoten mengunci sifat itu. Dengan
    # kedua-duanya, larian yang tamat masa tidak lagi membuang kerja sesi yang sudah siap, jadi
    # gelung kegagalan yang tidak pulih sendiri itu hilang.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pasang pakej
        run: pip install -q -c kekangan.txt pandas numpy
      - name: Kemas kini stor harga repo (terkini.csv + sejarah saham baharu)
        run: python3 BacktestShariah2/standard/lejar.py stor
      - name: Proses sesi belum diproses (beli, keluar, isyarat)
        # Had masa di sini, bukan hanya pada job: tamat masa langkah = kegagalan langkah biasa,
        # jadi "Commit dan push" (if: always()) masih berjalan dan sesi yang sudah siap disimpan.
        timeout-minutes: 300
        run: python3 BacktestShariah2/standard/lejar.py jalan --proses 4
      - name: Semak integriti lejar
        run: python3 BacktestShariah2/standard/lejar.py semak
      - name: Ringkasan setiap kaedah dan banding Papertrade C
        run: |
          python3 BacktestShariah2/standard/lejar.py ringkas
          python3 BacktestShariah2/standard/lejar.py banding
      # Konteks isyarat dibekukan (7 Nov 2026): rejim pasaran + ciri saham pada malam isyarat, ditulis TAMBAH-SAHAJA
      # ke data/konteks/ (di luar lejar/ kerana bina semula Lejar memadam fail di bawah lejar/). continue-on-error:
      # kegagalan di sini tidak boleh menghalang sesi Lejar disimpan.
      - name: Bekukan konteks isyarat
        continue-on-error: true
        run: python3 BacktestShariah2/standard/konteks_isyarat.py
      # Saksi Lejar tambah-sahaja (8 Nov 2026): bila setiap posisi mula-mula direkod, sha kod kaedah, versi peraturan,
      # dan hasil tutup yang dibekukan; hanyut selepas bina semula dilapor dalam data/konteks/rekod_status.json.
      - name: Rekod Lejar tambah-sahaja (saksi bina semula)
        continue-on-error: true
        run: python3 BacktestShariah2/standard/rekod_lejar.py
      - name: Portfolio maya 10 slot (RS_10, RAWAK_10; gabungan beku GABUNGAN_10, TOP1_10, RAWAK_KAEDAH_10; jejak hadapan)
        continue-on-error: true
        run: python3 BacktestShariah2/standard/portfolio_slot.py
      - name: Commit dan push
        # always(): simpan sesi yang sudah siap walaupun langkah imbasan tamat masa atau ranap.
        # Selamat hanya kerana tambah_bulan kini idempoten (lihat nota had masa di atas). Job
        # tetap dilapor GAGAL apabila imbasan gagal, jadi amaran_ntfy masih berbunyi - langkah
        # ini menyimpan kemajuan, ia tidak menyembunyikan kegagalan. (Larian dispatch bot TIDAK mencetus
        # amaran_ntfy; lihat langkah amaran di hujung fail ini.)
        if: always()
        run: |
          git config user.name "lejar[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BacktestShariah2/lejar BacktestShariah2/data/harga/stor
          [ -d BacktestShariah2/portfolio_slot ] && git add BacktestShariah2/portfolio_slot
          [ -f BacktestShariah2/data/harga/perlu_sejarah.txt ] && git add BacktestShariah2/data/harga/perlu_sejarah.txt
          git add BacktestShariah2/data/harga/faktor.csv BacktestShariah2/data/harga/faktor_calon.csv 2>/dev/null || true
          # kuarantin data harga (standard/kuarantin.py; ditulis oleh `lejar.py stor` melalui harga_yf.gabung)
          git add BacktestShariah2/data/harga/kuarantin.csv 2>/dev/null || true
          [ -d BacktestShariah2/data/konteks ] && git add BacktestShariah2/data/konteks
          if git diff --cached --quiet; then echo "tiada perubahan"; exit 0; fi
          SESI=$(python3 -c "import json;print(json.load(open('BacktestShariah2/lejar/status.json')).get('sesi_terakhir'))")
          git commit -q -m "Lejar penuh: sesi $SESI"
          # 10 Nov 2026 (larian #62): bina semula penuh ~2.7 jam bertindih dengan harian.yml, yang juga menulis
          # stor harga; rebase berkonflik pada stor/status.json + log_laras.csv dan ketiga-tiga push gagal, jadi
          # sesi itu hilang dan larian seterusnya membina semula sekali lagi. Konflik yang HANYA pada stor harga
          # diselesaikan dengan versi main (lebih baharu; stor ialah cache yfinance, larian seterusnya mengambil
          # semula apa yang tertinggal; log_laras.csv digabung `union` melalui .gitattributes). Konflik pada fail
          # lain (lejar/, konteks/) masih menggagalkan push seperti dahulu.
          selesai_konflik_stor() {
            local C
            while C=$(git diff --name-only --diff-filter=U) && [ -n "$C" ]; do
              if printf '%s\n' "$C" | grep -qv '^BacktestShariah2/data/harga/stor/'; then return 1; fi
              echo "Konflik stor harga, ambil versi main: $C" >&2
              printf '%s\n' "$C" | xargs git checkout --ours --
              printf '%s\n' "$C" | xargs git add --
              GIT_EDITOR=true git rebase --continue >/dev/null 2>&1 && return 0
            done
            return 1
          }
          for n in 1 2 3; do
            if git pull -q --rebase origin main || selesai_konflik_stor; then
              if git push -q origin HEAD:main; then exit 0; fi
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((n * 15))
          done
          echo "Push gagal; larian seterusnya memproses semula sesi yang sama daripada keadaan repo." >&2
          exit 1
      # Larian yang dicetus penjaga_jadual (GITHUB_TOKEN, aktor github-actions[bot]) tidak menjana peristiwa workflow_run,
      # jadi analisis.yml tidak berjalan (23 Okt 2026: Papan Penganalisis kekal sesi 21 Okt). Cetus terus di sini.
      - name: Cetus Papan Penganalisis (larian dispatch bot)
        if: success() && github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run analisis.yml --ref main --repo "$GITHUB_REPOSITORY"
      # Atas sebab yang sama, kegagalan larian dispatch bot TIDAK mencetus amaran_ntfy.yml (10 Nov 2026: larian #62
      # gagal push selepas 2.7 jam tanpa sebarang amaran). Hantar terus; larian jadual/manusia kekal melalui
      # amaran_ntfy supaya tiada amaran berganda.
      - name: Amaran ntfy (kegagalan larian dispatch bot)
        if: failure() && github.actor == 'github-actions[bot]'
        env:
          TOPIK: ${{ secrets.NTFY_TOPIC || 'claude_azim' }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -m 20 -H "Title: papertrade-claude: Lejar penuh (failure)" -H "Tags: warning" -H "Priority: high" \
            -H "Click: $URL" -d "Lejar penuh (dispatch bot) berakhir dengan status failure. Tekan untuk buka larian." \
            "https://ntfy.sh/$TOPIK" > /dev/null || echo "::warning::ntfy gagal"
