# Gred Sektor/Industri v2 (BacktestShariah2/standard/gred_kumpulan.py; kajian BacktestShariah2/kajian/KAJIAN_GRED_KUMPULAN.md):
# kekuatan kumpulan seluruh pasaran AS (yfinance, ~5,600 saham) -> BacktestShariah2/data/kumpulan/gred_kumpulan.csv,
# dibaca oleh gred.py tambah (harian.yml 05:07 UTC dan imbasan Claude). Tanpa LLM, tanpa Moomoo.
# Masa (UTC): 04:17 Sel–Sab (sebelum harian.yml), sandaran 08:17.
name: Gred kumpulan

on:
  schedule:
    # Didaftar semula 19 Okt 2026: tiada cetusan jadual sejak 17 Okt 14:10 UTC (semua workflow active).
    # Jika cetusan hilang/lewat > 30 minit, penjaga_jadual.yml mencetus workflow_dispatch (dalam had masa).
    - cron: '17 4 * * 2-6'
    - cron: '17 8 * * 2-6'
  workflow_dispatch:
    inputs:
      sejarah_sesi:
        description: 'Isi juga gred_kumpulan_sejarah.csv bagi N sesi sebelum sesi terakhir (0 = biasa)'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: gred-kumpulan
  cancel-in-progress: false

jobs:
  masa:
    runs-on: ubuntu-latest
    outputs:
      jalan: ${{ steps.m.outputs.jalan }}
    steps:
      # Jadual GitHub boleh lewat ~6 jam (19 Okt 2026): jangan tarik data semasa pasaran AS dibuka (bar harian separa)
      - id: m
        run: |
          J=$((10#$(TZ=America/New_York date +%H%M))); H=$(TZ=America/New_York date +%u)
          if [ "$H" -le 5 ] && [ $J -ge 925 ] && [ $J -lt 1620 ]; then
            echo "jalan=tidak" >> "$GITHUB_OUTPUT"; echo "pasaran AS dibuka (NY $J): dilangkau"
          else
            echo "jalan=ya" >> "$GITHUB_OUTPUT"
          fi
  gred:
    needs: masa
    if: needs.masa.outputs.jalan == 'ya'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pasang pakej
        run: pip install -q -c kekangan.txt pandas numpy yfinance
      - name: Kira gred kumpulan
        env:
          SESI: ${{ github.event.inputs.sejarah_sesi || '0' }}
        run: python3 BacktestShariah2/standard/gred_kumpulan.py --sejarah-sesi "$SESI"
      - name: Commit dan push
        run: |
          git config user.name "gred-kumpulan[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BacktestShariah2/data/kumpulan
          if git diff --cached --quiet; then echo "tiada perubahan"; exit 0; fi
          T=$(python3 -c "import csv;print(next(csv.DictReader(open('BacktestShariah2/data/kumpulan/gred_kumpulan.csv')))['tarikh'])")
          git commit -q -m "Gred kumpulan: data $T"
          for n in 1 2 3; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((n * 15))
          done
          exit 1
      # 12 Nov 2026: panel "Peta industri" dashboard (db kumpulan/peta) dibina daripada fail di atas oleh
      # standard/peta_kumpulan.py semasa tolak db malam (jadual/tolak_db.md). Semak di sini supaya data yang
      # tidak boleh dibina menjadi kegagalan Actions hari itu, bukan panel basi yang senyap.
      - name: Semak peta industri boleh dibina dan segar
        run: |
          python3 BacktestShariah2/standard/peta_kumpulan.py
          python3 - <<'PY'
          import csv, sys
          sys.path.insert(0, 'BacktestShariah2/standard')
          import peta_kumpulan as P
          d = P.bina()
          t = next(csv.DictReader(open(P.KINI, encoding='utf-8')))['tarikh']
          n = {j: sum(r['j'] == j for r in d['rows']) for j in 'SI'}
          assert d['tarikh'] == t, f"peta {d['tarikh']} != gred_kumpulan.csv {t}"
          assert n['S'] >= 8 and n['I'] >= 50, f'kumpulan terlalu sedikit: {n}'
          print('peta industri:', d['tarikh'], n)
          PY
