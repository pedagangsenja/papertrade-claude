# Papan Penganalisis (BacktestShariah2/standard/penganalisis.py): satu jadual banding semua kaedah, menggabungkan backtest
# (registry 431, S1–S4, WFO W01, AUTOTUNE 2000 saham AS) dan data hadapan (Lejar Penuh + kohort Papertrade C sebelum Lejar).
# Dicetus sebaik "Lejar penuh" siap (~06:30 UTC = 14:30 MYT), jadi laporan memakai lejar terkini dan sedia sebelum rutin
# 6:02 pagi esok menolak db `analisis/papan` ke dashboard. Tanpa LLM. Keputusan pengguna 20 Okt 2026.
# Tiada cron: penjaga_jadual.yml menjaga lejar.yml; larian lejar jadual/sandaran mencetus workflow ini melalui workflow_run;
# larian dispatch penjaga (GITHUB_TOKEN, tiada workflow_run) mencetusnya terus melalui langkah akhir lejar.yml (23 Okt 2026).
name: Papan penganalisis

on:
  workflow_run:
    workflows: ['Lejar penuh']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analisis
  cancel-in-progress: false

jobs:
  analisis:
    # Hanya selepas Lejar BERJAYA (audit 7 Nov 2026): larian selepas Lejar gagal menjana laporan bertarikh hari ini
    # daripada lejar semalam. Penjaga dispatch tetap boleh mencetus secara manual.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # 30 minit (asal 15): portfolio_t4.py membina 444 lorong + 20 cabutan jalur setiap malam, ~1 minit pada
    # 15 sesi dan bertambah linear dengan bilangan sesi (~8 minit pada 126 sesi).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pasang pakej
        run: pip install -q -c kekangan.txt pandas numpy scipy
      - name: Jana papan penganalisis
        run: python3 BacktestShariah2/standard/penganalisis.py
      # Lift setiap kaedah atas kolam Lejar: ukuran yang tidak dicemari penapisan keluar, dan
      # satu-satunya pangkat yang merangkumi Nxx (Nxx tiada backtest set 431, jadi papan di atas
      # tidak boleh memangkatnya).
      #
      # `continue-on-error` + langkah semakan SELEPAS commit, mengikut pelajaran yang sama seperti
      # `koordinator.py --semak` dalam harian.yml: kegagalan alat baharu TIDAK boleh menghalang
      # papan penganalisis daripada dikomit malam itu. Tanpa ini, satu ralat dalam lift_kaedah.py
      # menghentikan job sebelum langkah commit, dan PENGANALISIS.md + papan.json berhenti
      # dikemas secara SENYAP sedangkan penjananya sendiri berjaya. `|| true` sahaja tidak cukup
      # kerana kegagalan senyap bermakna laporan lapuk kelihatan segar — maka langkah terakhir
      # tetap menggagalkan job supaya amaran_ntfy.yml berbunyi, selepas data selamat.
      - name: Jana lift kaedah
        id: lift
        continue-on-error: true
        run: python3 BacktestShariah2/standard/lift_kaedah.py
      # KAEDAH_TERBAIK.md menjawab soalan yang mesti dijawab SEBELUM mana-mana pangkat boleh
      # dipercayai (adakah pangkat backtest meramal hadapan; ada kaedah positif yang bertahan
      # BH-FDR; bila pangkat boleh dipercayai). Sebelum 6 Nov 2026 ia tiada dalam mana-mana
      # workflow — ia berjalan hanya apabila seseorang menaipnya, jadi ia bertarikh 29 Okt
      # sementara datanya bergerak setiap malam, dan enam ayat dalam laporannya menjadi palsu
      # tanpa sesiapa nampak. Teks tetap itu sudah dibuang, tetapi laporan yang hanya dijana
      # dengan tangan tetap akan lapuk. Ia membaca data/analisis/papan.json, jadi ia mesti
      # SELEPAS penganalisis.py.
      - name: Jana laporan kaedah terbaik
        id: terbaik
        continue-on-error: true
        run: python3 BacktestShariah2/standard/kaedah_terbaik.py
      # Lorong T4 satu-kaedah + kad skor keputusan (keputusan pengguna 6 Nov 2026, audit dashboard
      # v154 Pilihan B + T4; pradaftar standard/SPEC_KAD_SKOR.md). portfolio_t4.py MESTI sebelum
      # kad_skor.py (G6 membaca t4_ringkasan.csv), dan kad_skor.py MESTI selepas lift_kaedah.py
      # (G3) dan penganalisis.py (G5). continue-on-error atas sebab yang sama seperti lift di atas.
      - name: Jana lorong T4 setiap kaedah
        id: t4
        continue-on-error: true
        run: python3 BacktestShariah2/standard/portfolio_t4.py
      # Kad skor hanya jika lift DAN T4 malam ini berjaya: jika tidak ia akan menilai gate G3/G6 dengan fail
      # larian lalu (audit 7 Nov 2026). kad_skor.py juga menyemak sendiri tarikh lift.json lawan sesi Lejar.
      - name: Jana kad skor keputusan
        id: kad
        if: steps.lift.outcome == 'success' && steps.t4.outcome == 'success'
        continue-on-error: true
        run: python3 BacktestShariah2/standard/kad_skor.py
      # Skor Kaedah 0-100 (keputusan pengguna 9 Nov 2026; pradaftar standard/SPEC_SKOR_KAEDAH.md): pangkat
      # maklumat empat tiang atas penyebut kad skor, BUKAN keputusan. Membaca kad_skor.json + t4_siri.csv,
      # jadi hanya selepas kad skor malam ini berjaya (jika tidak ia menskor fail larian lalu).
      - name: Jana skor kaedah
        id: skor
        if: steps.kad.outcome == 'success'
        continue-on-error: true
        run: python3 BacktestShariah2/standard/skor_kaedah.py
      # Ringkasan setiap kaedah untuk helaian kaedah dashboard v161 (keputusan pengguna 8 Nov 2026):
      # sebab keluar, taburan pulangan dan tiga contoh dagangan sebenar dengan lilin. Populasi SAMA
      # seperti kad skor (Lejar Penuh lorong 1, terbuka ditanda-ke-pasaran); paparan sahaja.
      - name: Jana ringkasan setiap kaedah
        id: siri
        continue-on-error: true
        run: python3 BacktestShariah2/standard/kaedah_siri.py
      - name: Commit dan push
        run: |
          git config user.name "analisis[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BacktestShariah2/laporan/PENGANALISIS.md BacktestShariah2/data/analisis/papan.json
          # Fail lift ditambah hanya jika ia WUJUD: pada larian pertama selepas gabung ia belum
          # dijejak, dan `git add` pada laluan yang tiada menggagalkan langkah ini — iaitu tepat
          # kegagalan yang baris continue-on-error di atas cuba elakkan.
          for f in BacktestShariah2/laporan/LIFT_KAEDAH.md BacktestShariah2/data/analisis/lift.json \
                   BacktestShariah2/laporan/KAEDAH_TERBAIK.md \
                   BacktestShariah2/portfolio_slot/t4_ringkasan.csv BacktestShariah2/portfolio_slot/t4_siri.csv \
                   BacktestShariah2/laporan/T4_KAEDAH.md BacktestShariah2/data/analisis/kad_skor.json \
                   BacktestShariah2/laporan/KAD_SKOR.md BacktestShariah2/data/analisis/kaedah_siri.json \
                   BacktestShariah2/data/analisis/skor_kaedah.json BacktestShariah2/laporan/SKOR_KAEDAH.md \
                   BacktestShariah2/data/analisis/skor_kaedah_sejarah.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then echo "tiada perubahan"; exit 0; fi
          git commit -q -m "Papan penganalisis: data $(python3 -c "import json;print(json.load(open('BacktestShariah2/data/analisis/papan.json'))['kini'])")"
          for n in 1 2 3; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((n * 15))
          done
          echo "Push gagal; larian seterusnya menjana semula." >&2
          exit 1
      # Dijalankan SELEPAS commit: data malam ini sudah selamat, jadi job boleh gagal dengan jujur.
      - name: Semak laporan sampingan berjaya
        if: >-
          steps.lift.outcome == 'failure' || steps.terbaik.outcome == 'failure' ||
          steps.t4.outcome == 'failure' || steps.kad.outcome == 'failure' || steps.kad.outcome == 'skipped' ||
          steps.skor.outcome == 'failure' || steps.skor.outcome == 'skipped' || steps.siri.outcome == 'failure'
        run: |
          if [ "${{ steps.lift.outcome }}" = "failure" ]; then
            echo "lift_kaedah.py GAGAL (lihat langkah 'Jana lift kaedah'); analisis/lift lapuk." >&2
          fi
          if [ "${{ steps.terbaik.outcome }}" = "failure" ]; then
            echo "kaedah_terbaik.py GAGAL (lihat langkah 'Jana laporan kaedah terbaik')." >&2
          fi
          if [ "${{ steps.t4.outcome }}" = "failure" ]; then
            echo "portfolio_t4.py GAGAL (lihat langkah 'Jana lorong T4 setiap kaedah'); G6 lapuk." >&2
          fi
          if [ "${{ steps.kad.outcome }}" = "failure" ] || [ "${{ steps.kad.outcome }}" = "skipped" ]; then
            echo "kad_skor.py GAGAL (lihat langkah 'Jana kad skor keputusan'); analisis/kad_skor lapuk." >&2
          fi
          if [ "${{ steps.skor.outcome }}" = "failure" ] || [ "${{ steps.skor.outcome }}" = "skipped" ]; then
            echo "skor_kaedah.py GAGAL (lihat langkah 'Jana skor kaedah'); SKOR_KAEDAH.md lapuk." >&2
          fi
          if [ "${{ steps.siri.outcome }}" = "failure" ]; then
            echo "kaedah_siri.py GAGAL (lihat langkah 'Jana ringkasan setiap kaedah'); analisis/kaedah_siri lapuk." >&2
          fi
          echo "Papan penganalisis sudah dikomit; hanya laporan sampingan yang lapuk." >&2
          exit 1
