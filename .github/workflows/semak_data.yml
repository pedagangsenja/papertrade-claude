# Semakan automatik setiap push ke main: ujian unit + sahkan.py (semak sahaja, tanpa --betulkan).
# Gagal = data atau kod rosak; GitHub menghantar e-mel kegagalan kepada pemilik repo.
# Commit bot harga harian (GITHUB_TOKEN) tidak mencetus workflow ini.
name: Semak data

on:
  push:
    branches: [main]
    paths:
      - 'BacktestShariah2/**'
      - 'requirements.txt'
      - '**/*.py'
      - 'ruff.toml'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semak-data
  cancel-in-progress: true

jobs:
  semak:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pasang pakej
        run: pip install -q -c kekangan.txt -r requirements.txt
      - name: Semak pepijat kod (ruff; peraturan dalam ruff.toml)
        run: pip install -q ruff==0.16.9 && ruff check --output-format github .
      - name: Semak workflow (actionlint; tanpa shellcheck, nota gaya shell diabaikan)
        run: |
          mkdir -p /tmp/al
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 /tmp/al
          /tmp/al/actionlint -shellcheck= -color
      - name: Ujian unit
        run: python3 -m unittest discover -s BacktestShariah2/ujian
      - name: Semak data papertrade (sahkan.py)
        run: python3 BacktestShariah2/standard/sahkan.py
      - name: Saiz dokumen claude_N di bawah had db (pecah_claude.py)
        run: python3 BacktestShariah2/standard/pecah_claude.py
      - name: Integriti Lejar Penuh (lejar.py semak)
        run: python3 BacktestShariah2/standard/lejar.py semak
      # Hanya arah "repo disunting tanpa diterbitkan". Arah bertentangan ("diterbitkan
      # tanpa dikomit", yang berlaku DUA KALI pada 30-31 Okt 2026) TIDAK boleh disemak di
      # sini: /api/artifacts/... dilindungi cabaran Cloudflare, jadi runner tidak dapat
      # membaca artifact hidup. Arah itu disemak setiap hari oleh jadual/tolak_db.md §7.
      - name: Dashboard selaras dengan terbitan terakhir (semak_terbit.py)
        run: python3 BacktestShariah2/standard/semak_terbit.py
